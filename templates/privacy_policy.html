<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Privacy Policy - Creditsbazaar | Data Protection</title>
    <meta name="description"
        content="Read Creditsbazaar's Privacy Policy to understand how we collect, use, and protect your personal data. We are committed to your privacy and security.">
    <meta name="keywords" content="privacy policy, data protection, creditsbazaar privacy, user data, security">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://creditsbazaar.com/privacy-policy">

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://creditsbazaar.com/privacy-policy">
    <meta property="og:title" content="Privacy Policy - Creditsbazaar | Data Protection">
    <meta property="og:description"
        content="Read Creditsbazaar's Privacy Policy to understand how we collect, use, and protect your personal data.">
    <meta property="og:image" content="https://creditsbazaar.com/static/logo.png">

    <!-- Twitter -->
    <meta property="twitter:card" content="summary">
    <meta property="twitter:url" content="https://creditsbazaar.com/privacy-policy">
    <meta property="twitter:title" content="Privacy Policy - Creditsbazaar | Data Protection">
    <meta property="twitter:description"
        content="Read Creditsbazaar's Privacy Policy to understand how we collect, use, and protect your personal data.">
    <meta property="twitter:image" content="https://creditsbazaar.com/static/logo.png">

    <!-- Schema.org Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebPage",
      "name": "Privacy Policy",
      "description": "Privacy Policy and data protection practices of Creditsbazaar.",
      "url": "https://creditsbazaar.com/privacy-policy"
    }
    </script>

    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
    <style>
        body {
            font-family: 'Open Sans', sans-serif;
        }
    </style>
</head>

<body class="bg-gray-50">
    <div id="root"></div>

    {% raw %}
    <script type="text/babel">
        const { useState, useEffect } = React;

        const Navbar = ({ onSignInClick }) => {
            const [isMenuOpen, setIsMenuOpen] = useState(false);
            const menuItems = [
                { name: "Home", link: "/" },
                { name: "Loans", link: "/loans" },
                { name: "Credit Cards", link: "/creditcards" },
                { name: "Calculators", link: "/calculators" }
            ];

            return (
                <nav className="bg-white shadow-md sticky top-0 z-50">
                    <div className="mx-2 md:mx-8 lg:mx-16 py-3 flex items-center justify-between">
                        <div className="flex items-center gap-4">
                            {/* Hamburger Menu Button */}
                            <button
                                className="lg:hidden text-gray-700 focus:outline-none"
                                onClick={() => setIsMenuOpen(!isMenuOpen)}
                            >
                                <svg
                                    className="w-6 h-6"
                                    fill="none"
                                    stroke="currentColor"
                                    viewBox="0 0 24 24"
                                >
                                    {isMenuOpen ? (
                                        <path
                                            strokeLinecap="round"
                                            strokeLinejoin="round"
                                            strokeWidth="2"
                                            d="M6 18L18 6M6 6l12 12"
                                        />
                                    ) : (
                                        <path
                                            strokeLinecap="round"
                                            strokeLinejoin="round"
                                            strokeWidth="2"
                                            d="M4 6h16M4 12h16M4 18h16"
                                        />
                                    )}
                                </svg>
                            </button>
                            <a href="/" className="flex items-center gap-2">
                                <img src="/static/logo.png" alt="CreditsBazaar" className="h-16" />
                            </a>
                        </div>
                        <div className="flex items-center gap-4">
                            <div className="hidden lg:flex items-center gap-6">
                                {menuItems.map((item) => (
                                    <a key={item.name} href={item.link} className="font-semibold text-sm cursor-pointer flex items-center gap-1 transition-colors text-gray-700 hover:text-blue-600">
                                        {item.name}
                                    </a>
                                ))}
                            </div>
                        </div>
                    </div>

                    {/* Mobile Menu Dropdown */}
                    {isMenuOpen && (
                        <div className="lg:hidden bg-white border-t border-gray-100 shadow-lg absolute w-full left-0 py-4 flex flex-col gap-4 px-6">
                            {menuItems.map((item) => (
                                <a
                                    key={item.name}
                                    href={item.link}
                                    className="block text-gray-700 font-semibold hover:text-blue-600 transition"
                                    onClick={() => setIsMenuOpen(false)}
                                >
                                    {item.name}
                                </a>
                            ))}
                        </div>
                    )}
                </nav>
            );
        };

        const PrivacyContent = () => (
            <div className="bg-white py-16">
                <div className="max-w-5xl mx-auto px-4 md:px-8">
                    <h1 className="text-3xl md:text-4xl font-bold text-[#052F5F] mb-8 text-center">Privacy Policy</h1>

                    <div className="prose prose-lg max-w-none text-gray-700 space-y-8">
                        <p className="font-medium text-lg leading-relaxed">
                            CreditsBazaar (“CreditsBazaar”, “we”, “our”, or “us”) respects your privacy and is committed to protecting your personal data in accordance with the Digital Personal Data Protection Act, 2023 (“DPDP Act”), the Information Technology Act, 2000, and applicable rules thereunder.
                        </p>
                        <p className="leading-relaxed">
                            This Privacy Policy explains how personal data is collected, used, stored, disclosed, and protected when you access or use <a href="http://www.creditsbazaar.com" className="text-blue-600 hover:underline">www.creditsbazaar.com</a> (“Website”).
                        </p>
                        <p className="leading-relaxed">
                            CreditsBazaar.com operates as an educational and loan comparison platform. We do not directly provide loans. Loan applications, where applicable, are facilitated through partner DSAs (Direct Selling Agents), banks, and NBFCs, using their authorized systems and login/code access.
                        </p>
                        <p className="font-semibold">
                            By accessing or using this Website, you consent to the terms of this Privacy Policy.
                        </p>

                        <div className="space-y-4">
                            <h2 className="text-2xl font-bold text-[#052F5F]">1. Controllers of Personal Information (Data Fiduciary)</h2>
                            <p>For the purposes of the DPDP Act, 2023, CreditsBazaar.com acts as the “Data Fiduciary” with respect to the personal data collected through this Website.</p>
                            <p>As a Data Fiduciary, we determine:</p>
                            <ul className="list-disc list-inside space-y-2 ml-4">
                                <li>The purpose of collection of personal data</li>
                                <li>The means of processing such data</li>
                                <li>The safeguards applicable to such data</li>
                            </ul>
                            <p>We ensure that personal data is processed lawfully, fairly, and transparently.</p>
                        </div>

                        <div className="space-y-4">
                            <h2 className="text-2xl font-bold text-[#052F5F]">2. What Personal Information We Gather About You</h2>
                            <p>We collect only such personal data as is necessary for providing educational, comparison, and facilitation services.</p>

                            <h3 className="text-xl font-semibold text-gray-800">2.1 Personal Data Provided by You</h3>
                            <ul className="list-disc list-inside space-y-1 ml-4">
                                <li>Full name</li>
                                <li>Mobile number</li>
                                <li>Email address</li>
                                <li>Loan preferences, requirements, and eligibility details</li>
                                <li>Information submitted through enquiry forms, callback requests, or communications</li>
                            </ul>

                            <h3 className="text-xl font-semibold text-gray-800 mt-4">2.2 Automatically Collected Data</h3>
                            <p>When you access the Website, we may automatically collect:</p>
                            <ul className="list-disc list-inside space-y-1 ml-4">
                                <li>IP address</li>
                                <li>Browser type, operating system, and device information</li>
                                <li>Website usage data (pages visited, interactions, timestamps)</li>
                                <li>Cookies and similar tracking technologies</li>
                            </ul>

                            <h3 className="text-xl font-semibold text-gray-800 mt-4">2.3 Accuracy of Information</h3>
                            <p>You are responsible for ensuring that the information provided is accurate and up to date.</p>
                        </div>

                        <div className="space-y-4">
                            <h2 className="text-2xl font-bold text-[#052F5F]">3. We Collect Cookies</h2>
                            <p>CreditsBazaar.com uses cookies and similar tracking technologies to improve Website performance and user experience.</p>
                            <p>Cookies are used to:</p>
                            <ul className="list-disc list-inside space-y-1 ml-4">
                                <li>Analyze Website traffic and usage patterns</li>
                                <li>Store user preferences</li>
                                <li>Improve content, tools, and functionality</li>
                            </ul>
                            <p>You may control or disable cookies through your browser settings. Disabling cookies may limit certain Website features.</p>
                            <p>Cookie practices are governed by this Privacy Policy and applicable laws.</p>
                        </div>

                        <div className="space-y-4">
                            <h2 className="text-2xl font-bold text-[#052F5F]">4. How Do We Use the Information</h2>
                            <p>Personal data collected is used strictly for legitimate purposes, including:</p>
                            <ul className="list-disc list-inside space-y-2 ml-4">
                                <li>Educating users about loan products, borrowing processes, and eligibility</li>
                                <li>Comparing loan options across multiple banks and financial institutions</li>
                                <li>Facilitating connections with partner DSAs and lenders using authorized login/code systems, where the user chooses to proceed</li>
                                <li>Communicating with users regarding enquiries, updates, and services</li>
                                <li>Improving Website content, tools, analytics, and user experience</li>
                                <li>Ensuring compliance with legal, regulatory, and contractual obligations</li>
                            </ul>
                            <p className="font-medium mt-2">CreditsBazaar.com does not sell personal data and does not use data for unlawful or unauthorized purposes.</p>
                        </div>

                        <div className="space-y-4">
                            <h2 className="text-2xl font-bold text-[#052F5F]">5. Disclosure to Third Parties</h2>
                            <p>We may disclose personal data only in the following circumstances:</p>

                            <h3 className="text-xl font-semibold text-gray-800">5.1 DSAs, Banks, and Lending Institutions</h3>
                            <p>With your explicit consent, relevant personal data may be shared with:</p>
                            <ul className="list-disc list-inside space-y-1 ml-4">
                                <li>Partner DSAs</li>
                                <li>Banks and NBFCs</li>
                            </ul>
                            <p>Such disclosure is solely for loan comparison, eligibility assessment, or facilitation purposes.</p>

                            <h3 className="text-xl font-semibold text-gray-800 mt-4">5.2 Data Processors / Service Providers</h3>
                            <p>We may share data with third-party service providers (Data Processors) for:</p>
                            <ul className="list-disc list-inside space-y-1 ml-4">
                                <li>Website hosting and maintenance</li>
                                <li>Analytics and technology support</li>
                                <li>Communication and customer support services</li>
                            </ul>
                            <p>All such parties are contractually obligated to process data only as instructed and to maintain confidentiality and security.</p>

                            <h3 className="text-xl font-semibold text-gray-800 mt-4">5.3 Legal and Regulatory Disclosure</h3>
                            <p>We may disclose personal data where required by:</p>
                            <ul className="list-disc list-inside space-y-1 ml-4">
                                <li>Applicable law</li>
                                <li>Court orders</li>
                                <li>Government or regulatory authorities</li>
                            </ul>

                            <h3 className="text-xl font-semibold text-gray-800 mt-4">5.4 External Websites</h3>
                            <p>The Website may contain links to external third-party websites. CreditsBazaar.com is not responsible for the privacy practices of such websites. Users are advised to review their privacy policies independently.</p>
                        </div>

                        <div className="space-y-4">
                            <h2 className="text-2xl font-bold text-[#052F5F]">6. Data Retention</h2>
                            <p>Personal data shall be retained only for:</p>
                            <ul className="list-disc list-inside space-y-1 ml-4">
                                <li>As long as necessary to fulfill the purposes stated in this Policy</li>
                                <li>The period required under applicable law or regulatory requirements</li>
                            </ul>
                            <p>Upon fulfillment of the purpose or withdrawal of consent (subject to legal obligations), personal data shall be deleted or anonymized.</p>
                        </div>

                        <div className="space-y-4">
                            <h2 className="text-2xl font-bold text-[#052F5F]">7. Data Security Safeguards</h2>
                            <p>CreditsBazaar.com implements reasonable security safeguards including administrative, technical, and organizational measures to protect personal data from unauthorized access, disclosure, alteration, or destruction.</p>
                            <p>However, users acknowledge that no system is completely secure, and data transmission over the internet carries inherent risks.</p>
                        </div>

                        <div className="space-y-4">
                            <h2 className="text-2xl font-bold text-[#052F5F]">8. User Rights Under DPDP Act, 2023</h2>
                            <p>Subject to applicable law, users have the right to:</p>
                            <ul className="list-disc list-inside space-y-1 ml-4">
                                <li>Access their personal data</li>
                                <li>Request correction or updating of personal data</li>
                                <li>Withdraw consent for data processing</li>
                                <li>Request erasure of personal data (subject to legal obligations)</li>
                                <li>Grievance redressal</li>
                            </ul>
                            <p>Requests may be submitted using the contact details provided on <a href="http://www.creditsbazaar.com" className="text-blue-600 hover:underline">www.creditsbazaar.com</a>.</p>
                        </div>

                        <div className="space-y-4">
                            <h2 className="text-2xl font-bold text-[#052F5F]">9. Children’s Privacy</h2>
                            <p>CreditsBazaar.com does not knowingly collect personal data of children below the age specified under applicable law. If such data is identified, it will be deleted in accordance with legal requirements.</p>
                        </div>

                        <div className="space-y-4">
                            <h2 className="text-2xl font-bold text-[#052F5F]">10. Changes to This Privacy Policy</h2>
                            <p>We reserve the right to update or modify this Privacy Policy at any time to reflect changes in law, technology, or business practices. Updates will be posted on this page with a revised effective date.</p>
                            <p>Continued use of the Website constitutes acceptance of the revised Policy.</p>
                        </div>

                        <div className="space-y-4">
                            <h2 className="text-2xl font-bold text-[#052F5F]">11. Contact & Grievance Redressal</h2>
                            <p>For questions, concerns, or grievances related to this Privacy Policy or personal data processing, users may contact us through the official contact details provided on:</p>
                            <ul className="list-none space-y-1 font-semibold ml-4">
                                <li>Email: <a href="mailto:support@creditsbazaar.in" className="text-blue-600 hover:underline">support@creditsbazaar.in</a></li>
                                <li>Website: <a href="http://www.creditsbazaar.com" className="text-blue-600 hover:underline">www.creditsbazaar.com</a></li>
                            </ul>
                        </div>
                    </div>
                </div>
            </div>
        );

                            <a href="/privacy-policy" className="hover:text-white transition-colors duration-200 text-white">Privacy Policy</a>

                    </div>

        );

                                    className="flex items-center justify-center gap-2 bg-gradient-to-r from-blue-600 to-blue-700 text-white font-bold py-3 px-4 rounded-lg hover:from-blue-700 hover:to-blue-800 transition shadow-lg transform hover:scale-105 no-underline"
                                >
                                    <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"></path>
                                    </svg>
                                    9625835453
                                </a>
                            </div>

                            <p className="text-xs text-blue-100 text-center">
                                Call us for instant loan & credit card assistance
                            </p>
                        </div>

                        {!isOpen && (
                            <div
                                onClick={() => setIsOpen(true)}
                                className="absolute left-0 top-1/2 -translate-y-1/2 -translate-x-full bg-blue-600 text-white px-3 py-6 rounded-l-lg shadow-lg cursor-pointer hover:bg-blue-700 transition-colors"
                            >
                                <div className="flex flex-col items-center gap-2">
                                    <span className="text-xs font-bold writing-mode-vertical transform rotate-180" style={{ writingMode: 'vertical-rl' }}>
                                        CONTACT
                                    </span>
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        function App() {
            const [isContactOpen, setIsContactOpen] = useState(false);

            const handleTalkToExpert = () => {
                setIsContactOpen(true);
            };

            return (
                <div className="font-sans text-gray-800 bg-gray-50 min-h-screen pb-0 flex flex-col">
                    <Navbar />
                    <div className="flex-grow">
                        <PrivacyContent />
                    </div>
                    <Footer onContactClick={handleTalkToExpert} />
                    <FloatingContactWidget
                        isOpen={isContactOpen}
                        setIsOpen={setIsContactOpen}
                    />
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
    {% endraw %}
</body>

</html>
