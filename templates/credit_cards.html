<body class="bg-gray-50">
    <div id="root"></div>

    {% raw %}
    <script type="text/babel">
        const { useState, useEffect } = React;

        const Navbar = ({ onSignInClick }) => {
            const [isMenuOpen, setIsMenuOpen] = useState(false);
            const menuItems = [
                { name: "Home", link: "/" },
                { name: "Loans", link: "/loans" },
                { name: "Credit Cards", link: "/creditcards" },
                { name: "Calculators", link: "/calculators" }
            ];

            // Placeholder for Logo component, assuming it's defined elsewhere or will be added.
            // For now, I'll keep the original image tag wrapped in a component-like structure.
            const Logo = () => (
                <a href="/" className="flex items-center gap-2">
                    <img src="/static/logo.png" alt="CreditBazaar" className="h-16" />
                </a>
            );

            return (
                <nav className="bg-white shadow-md sticky top-0 z-50">
                    <div className="mx-2 md:mx-8 lg:mx-16 py-3 flex items-center justify-between">
                        <div className="flex items-center gap-4">
                            {/* Hamburger Menu Button */}
                            <button
                                className="lg:hidden text-gray-700 focus:outline-none"
                                onClick={() => setIsMenuOpen(!isMenuOpen)}
                            >
                                <svg
                                    className="w-6 h-6"
                                    fill="none"
                                    stroke="currentColor"
                                    viewBox="0 0 24 24"
                                >
                                    {isMenuOpen ? (
                                        <path
                                            strokeLinecap="round"
                                            strokeLinejoin="round"
                                            strokeWidth="2"
                                            d="M6 18L18 6M6 6l12 12"
                                        />
                                    ) : (
                                        <path
                                            strokeLinecap="round"
                                            strokeLinejoin="round"
                                            strokeWidth="2"
                                            d="M4 6h16M4 12h16M4 18h16"
                                        />
                                    )}
                                </svg>
                            </button>
                            <Logo />
                        </div>
                        <div className="flex items-center gap-4">
                            <div className="hidden lg:flex items-center gap-6">
                                {menuItems.map((item) => (
                                    <a key={item.name} href={item.link} className={`font-semibold text-sm cursor-pointer flex items-center gap-1 transition-colors ${item.name === "Credit Cards" ? "text-blue-600" : "text-gray-700 hover:text-blue-600"}`}>
                                        {item.name}
                                    </a>
                                ))}
                            </div>
                        </div>
                    </div>

                    {/* Mobile Menu Dropdown */}
                    {isMenuOpen && (
                        <div className="lg:hidden bg-white border-t border-gray-100 shadow-lg absolute w-full left-0 py-4 flex flex-col gap-4 px-6">
                            {menuItems.map((item) => (
                                <a
                                    key={item.name}
                                    href={item.link}
                                    className="block text-gray-700 font-semibold hover:text-blue-600 transition"
                                    onClick={() => setIsMenuOpen(false)}
                                >
                                    {item.name}
                                </a>
                            ))}
                        </div>
                    )}
                </nav>
            );
        };

        const CreditCardForm = () => {
            const [formData, setFormData] = useState({
                customer_name: '',
                email: '',
                contact_no: '',
                company_name: '',
                annual_salary: '',
                card_type: '',
                salary_mode: '',
                pincode: ''
            });

            const handleChange = (e) => {
                const { name, value } = e.target;
                setFormData(prev => ({ ...prev, [name]: value }));
            };

            const handleSubmit = async (e) => {
                e.preventDefault();
                try {
                    const response = await fetch('/api/apply-credit-card', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify(formData),
                    });
                    const result = await response.json();
                    if (response.ok) {
                        alert('Application Submitted Successfully!');
                        setFormData({
                            customer_name: '', email: '', contact_no: '', company_name: '',
                            annual_salary: '', card_type: '', salary_mode: '', pincode: ''
                        });
                    } else {
                        alert('Error: ' + result.error);
                    }
                } catch (error) {
                    console.error('Error:', error);
                    alert('Failed to submit application.');
                }
            };

            return (
                <div className="bg-white p-8 rounded-2xl shadow-lg border border-gray-100">
                    <h2 className="text-2xl font-bold text-[#052F5F] mb-6">Unlock Your Purchasing Power</h2>
                    <form className="space-y-5" onSubmit={handleSubmit}>
                        <div className="space-y-1">
                            <label className="text-sm font-semibold text-gray-700">Customer Name</label>
                            <input
                                type="text"
                                name="customer_name"
                                value={formData.customer_name}
                                onChange={handleChange}
                                placeholder="Enter your full name"
                                className="w-full px-4 py-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500 transition"
                                required
                            />
                        </div>

                        <div className="grid grid-cols-1 md:grid-cols-2 gap-5">
                            <div className="space-y-1">
                                <label className="text-sm font-semibold text-gray-700">Email ID</label>
                                <input
                                    type="email"
                                    name="email"
                                    value={formData.email}
                                    onChange={handleChange}
                                    placeholder="name@example.com"
                                    className="w-full px-4 py-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500 transition"
                                    required
                                />
                            </div>
                            <div className="space-y-1">
                                <label className="text-sm font-semibold text-gray-700">Contact No</label>
                                <input
                                    type="tel"
                                    name="contact_no"
                                    value={formData.contact_no}
                                    onChange={handleChange}
                                    placeholder="Mobile Number"
                                    className="w-full px-4 py-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500 transition"
                                    required
                                />
                            </div>
                        </div>

                        <div className="space-y-1">
                            <label className="text-sm font-semibold text-gray-700">Company Name</label>
                            <input
                                type="text"
                                name="company_name"
                                value={formData.company_name}
                                onChange={handleChange}
                                placeholder="Current Employer Name"
                                className="w-full px-4 py-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500 transition"
                            />
                        </div>

                        <div className="space-y-1">
                            <label className="text-sm font-semibold text-gray-700">Annual Salary</label>
                            <select
                                name="annual_salary"
                                value={formData.annual_salary}
                                onChange={handleChange}
                                className="w-full px-4 py-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500 transition bg-white cursor-pointer"
                                required
                            >
                                <option value="">Select Salary Range</option>
                                <option value="Below 3 Lakhs">Below ₹3 Lakhs</option>
                                <option value="3 Lakhs - 5 Lakhs">₹3 Lakhs - ₹5 Lakhs</option>
                                <option value="5 Lakhs - 10 Lakhs">₹5 Lakhs - ₹10 Lakhs</option>
                                <option value="Above 10 Lakhs">Above ₹10 Lakhs</option>
                            </select>
                        </div>

                        <div className="grid grid-cols-1 md:grid-cols-2 gap-5">
                            <div className="space-y-1">
                                <label className="text-sm font-semibold text-gray-700">Credit Card Type</label>
                                <select
                                    name="card_type"
                                    value={formData.card_type}
                                    onChange={handleChange}
                                    className="w-full px-4 py-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500 transition bg-white cursor-pointer"
                                    required
                                >
                                    <option value="">Select Type</option>
                                    <option value="Rupay">Rupay</option>
                                    <option value="Visa">Visa</option>
                                    <option value="Mastercard">Mastercard</option>
                                    <option value="Amex">Amex</option>
                                    <option value="Diners Club">Diners Club</option>
                                </select>
                            </div>
                            <div className="space-y-1">
                                <label className="text-sm font-semibold text-gray-700">Mode of Salary</label>
                                <select
                                    name="salary_mode"
                                    value={formData.salary_mode}
                                    onChange={handleChange}
                                    className="w-full px-4 py-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500 transition bg-white cursor-pointer"
                                    required
                                >
                                    <option value="">Select Mode</option>
                                    <option value="Cash">Cash</option>
                                    <option value="Bank Transfer">Bank Transfer</option>
                                </select>
                            </div>
                        </div>

                        <div className="space-y-1">
                            <label className="text-sm font-semibold text-gray-700">Pin Code</label>
                            <input
                                type="number"
                                name="pincode"
                                value={formData.pincode}
                                onChange={handleChange}
                                placeholder="Six Digit Pin Code"
                                className="w-full px-4 py-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500 transition"
                                required
                            />
                        </div>

                        <div className="flex items-start gap-3 pt-2">
                            <input type="checkbox" id="consent" className="mt-1 w-5 h-5 text-blue-600 rounded focus:ring-blue-500 border-gray-300 cursor-pointer" required />
                            <label htmlFor="consent" className="text-xs text-gray-500 cursor-pointer">
                                I authorize CreditBazaar and its partner banks/NBFCs to contact me for credit card offers.
                            </label>
                        </div>

                        <button type="submit" className="w-full bg-[#FF6F3C] text-white font-bold py-4 rounded-lg hover:bg-[#ff8a5e] transition shadow-lg transform hover:scale-[1.01] uppercase tracking-wide text-sm">
                            Proceed to Apply
                        </button>
                    </form>
                </div>
            );
        }

        const FloatingContactWidget = ({ isOpen, setIsOpen }) => {


            useEffect(() => {
                const timer = setTimeout(() => {
                    if (!hasBeenClosed) {
                        setIsOpen(false);
                        setHasBeenClosed(true);

                        <div className="bg-blue-800 px-6 py-4 flex items-center justify-between">
                            <div className="flex items-center gap-3">
                                <div className="w-10 h-10 bg-white rounded-full flex items-center justify-center">
                                    <svg className="w-6 h-6 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"></path>
                                    </svg>
                                </div>
                                <div>
                                    <h3 className="font-bold text-sm">Need Help?</h3>
                                    <p className="text-xs text-blue-100">Talk to Expert</p>
                                </div>
                            </div>
                            <button
                                onClick={handleClose}
                                className="text-white hover:text-blue-200 transition"
                            >
                                <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12"></path>
                                </svg>
                            </button>
                        </div>
                        <div className="px-6 py-6">
                            <p className="text-sm mb-4 text-blue-50">
                                Get instant assistance from our customer executives. We're here to help!
                            </p>
                            <div className="bg-white rounded-xl p-4 mb-4">
                                <div className="flex items-center gap-3 mb-3">
                                    <div className="w-12 h-12 bg-blue-100 rounded-full flex items-center justify-center">
                                        <svg className="w-6 h-6 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                                        </svg>
                                    </div>
                                    <div>
                                        <p className="text-xs text-gray-500 font-semibold">Customer Executive</p>
                                        <p className="text-sm text-gray-800 font-bold">Available 24/7</p>
                                    </div>
                                </div>
                                <a
                                    href="tel:9625835453"
                                    className="flex items-center justify-center gap-2 bg-gradient-to-r from-blue-600 to-blue-700 text-white font-bold py-3 px-4 rounded-lg hover:from-blue-700 hover:to-blue-800 transition shadow-lg transform hover:scale-105 no-underline"
                                >
                                    <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"></path>
                                    </svg>
                                    9625835453
                                </a>
                            </div>
                            <p className="text-xs text-blue-100 text-center">
                                Call us for instant loan & credit card assistance
                            </p>
                        </div>
                        {!isOpen && (
                            <div
                                onClick={() => setIsOpen(true)}
                                className="absolute left-0 top-1/2 -translate-y-1/2 -translate-x-full bg-blue-600 text-white px-3 py-6 rounded-l-lg shadow-lg cursor-pointer hover:bg-blue-700 transition-colors"
                            >
                                <div className="flex flex-col items-center gap-2">
                                    <span className="text-xs font-bold writing-mode-vertical transform rotate-180" style={{ writingMode: 'vertical-rl' }}>
                                        CONTACT US
                                    </span>
                                </div>
                            </div>
                        )}
                    </div>

                </div>
            );
        };

        const Footer = ({ onContactClick }) => (
            <footer className="bg-[#1A202C] text-gray-400 py-12 text-sm">
                <div className="mx-2 md:mx-8 lg:mx-16">
                    <div className="grid grid-cols-2 md:grid-cols-4 gap-8 mb-8">
                        <div>
                            <h4 className="text-white font-bold mb-4 uppercase">Company</h4>
                            <ul className="space-y-2">
                                <li className="hover:text-white cursor-pointer"><a href="/about">About Us</a></li>
                                <li className="hover:text-white cursor-pointer"><a href="/careers">Careers</a></li>
                                <li className="hover:text-white cursor-pointer"><a href="/#partners">Partners</a></li>
                                <li className="hover:text-white cursor-pointer"><a href="/contact">Contact Us</a></li>
                            </ul>
                        </div>
                        <div>
                            <h4 className="text-white font-bold mb-4 uppercase">Our DSA's Partner Services</h4>
                            <ul className="space-y-2">
                                <li className="hover:text-white cursor-pointer"><a href="/loans">Personal Loan</a></li>
                                <li className="hover:text-white cursor-pointer"><a href="/loans">Home Loan</a></li>
                                <li className="hover:text-white cursor-pointer"><a href="/loans">Business Loan</a></li>
                                <li className="hover:text-white cursor-pointer"><a href="/creditcards">Credit Card</a></li>
                            </ul>
                        </div>
                        <div>
                            <h4 className="text-white font-bold mb-4 uppercase">Resources</h4>
                            <ul className="space-y-2">
                                <li className="hover:text-white cursor-pointer"><a href="/calculators">Financial Tools</a></li>
                                <li className="hover:text-white cursor-pointer">Blogs</li>
                                <li className="hover:text-white cursor-pointer"><a href="/faq">FAQs</a></li>
                                <li className="hover:text-white cursor-pointer"><a href="/glossary">Glossary</a></li>
                            </ul>
                        </div>
                        <div>
                            <h4 className="text-white font-bold mb-4 uppercase">Contact Us</h4>

                                <li className="mt-4 flex gap-4">
                                    <a href="https://www.instagram.com/official_creditsbazaar?igsh=MW5iaWQ1OTkxemFncQ==" target="_blank" rel="noopener noreferrer" className="w-8 h-8 bg-gray-700 rounded-full flex items-center justify-center hover:bg-pink-600 cursor-pointer transition-colors block">

            const [isContactOpen, setIsContactOpen] = useState(false);

            const handleTalkToExpert = () => {

            };
            return (
                <div className="min-h-screen flex flex-col">
                    <Navbar />
                    <div className="flex-grow py-12 px-4 md:px-8 lg:px-16">
                        <div className="max-w-7xl mx-auto grid grid-cols-1 lg:grid-cols-2 gap-12 items-start">
                            {/* Left Side: Form */}
                            <div className="w-full">
                                <CreditCardForm />
                            </div>

                            {/* Right Side: Marketing Images */}
                            <div className="hidden lg:block sticky top-24">
                                <div className="space-y-8">
                                    <div className="relative group">
                                        <div className="absolute -inset-1 bg-gradient-to-r from-blue-600 to-orange-400 rounded-2xl blur opacity-25 group-hover:opacity-50 transition duration-1000 group-hover:duration-200"></div>
                                        <div className="relative bg-white rounded-2xl overflow-hidden shadow-xl p-8 flex flex-col items-center text-center">
                                            {/* Using the same image for now, can be updated if user provides a credit card specific image */}
                                            <img src="/static/credit_cards_hero_realistic.png" alt="Swipe Your Way to Benefits" className="w-full h-auto object-contain mb-6 transform group-hover:scale-105 transition duration-500" />
                                            <h3 className="text-2xl font-bold text-[#052F5F] mb-3">Swipe Your Way to Benefits</h3>
                                            <p className="text-gray-600 leading-relaxed">
                                                From cashback to travel perks, find the perfect credit card that matches your lifestyle and spending habits.
                                            </p>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        {/* New Content Section */}
                        <div className="max-w-7xl mx-auto mt-12 md:mt-24">
                            <div className="bg-white rounded-[2rem] shadow-xl border border-gray-100 p-8 md:p-14 overflow-hidden relative">
                                <div className="absolute top-0 left-0 w-full h-2 bg-gradient-to-r from-[#052F5F] via-blue-600 to-[#FF6F3C]"></div>

                                <h1 className="text-3xl md:text-5xl font-extrabold text-[#052F5F] mb-8 text-center tracking-tight leading-tight">
                                    Credit Card <span className="text-gray-400 font-light">|</span> <span className="text-transparent bg-clip-text bg-gradient-to-r from-blue-700 to-blue-500">Apply Online</span>
                                </h1>
                                <p className="text-gray-600 leading-relaxed text-lg md:text-xl mb-16 text-center max-w-4xl mx-auto">
                                    Unlock financial freedom with Credits Bazaar. We guide you to the <span className="font-semibold text-[#052F5F]">perfect credit card</span> tailored to your lifestyle—offering maximum rewards, seamless approval, and exclusive privileges.
                                </p>

                                {/* What is a Credit Card Section */}
                                <div className="grid grid-cols-1 lg:grid-cols-2 gap-16 items-center mb-20">
                                    <div className="order-2 lg:order-1">
                                        <div className="relative pl-6 border-l-4 border-[#FF6F3C]">
                                            <h2 className="text-3xl font-bold text-[#052F5F] mb-6">What is a Credit Card?</h2>
                                            <p className="text-gray-600 leading-relaxed mb-6 text-lg">
                                                A credit card is more than just a payment tool; it's your financial power-up. It allows you to borrow funds up to a set limit for immediate purchases, giving you the flexibility to pay later.
                                            </p>
                                            <p className="text-[#052F5F] font-semibold text-lg">
                                                Experience convenience, security, and financial flexibility like never before.
                                            </p>
                                        </div>
                                    </div>
                                    <div className="order-1 lg:order-2 flex justify-center">
                                        <div className="relative">
                                            <div className="absolute -inset-4 bg-blue-100 rounded-full blur-2xl opacity-50"></div>
                                            <img src="/static/credit_card_benefits.png" alt="Credit Card Benefits" className="relative rounded-2xl shadow-2xl hover:scale-[1.02] transition duration-500 transform" />
                                        </div>
                                    </div>
                                </div>

                                {/* Benefits Section */}
                                <div className="mb-20">
                                    <h2 className="text-3xl font-bold text-[#052F5F] mb-10 text-center">Benefits of Using a Credit Card</h2>
                                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
                                        {[
                                            "Instant Liquidity",
                                            "Reward Points",
                                            "Cashback Offers",
                                            "Lounge Access",
                                            "Fuel Waiver",
                                            "EMI Options",
                                            "Credit Building",
                                            "Secure Pay"
                                        ].map((benefit, index) => (
                                            <div key={index} className="group flex flex-col items-center justify-center p-6 bg-white rounded-2xl border border-gray-100 shadow-sm hover:shadow-xl hover:-translate-y-1 transition-all duration-300">
                                                <div className="w-12 h-1 bg-gradient-to-r from-blue-500 to-blue-600 rounded-full mb-4 group-hover:w-20 transition-all duration-300"></div>
                                                <span className="text-gray-800 font-bold text-lg text-center group-hover:text-blue-700 transition-colors">{benefit}</span>
                                            </div>
                                        ))}
                                    </div>
                                </div>

                                {/* Types of Cards */}
                                <div className="mb-24">
                                    <div className="text-center mb-12">
                                        <h2 className="text-3xl font-bold text-[#052F5F] mb-4">Curated Cards for Every Lifestyle</h2>
                                        <p className="text-gray-500">Choose the card that fits your world.</p>
                                    </div>
                                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
                                        {[
                                            { title: "Lifestyle", desc: "Dining, entertainment & shopping perks.", color: "from-purple-500 to-indigo-500" },
                                            { title: "Travel", desc: "Miles, hotels & airport lounge access.", color: "from-blue-400 to-cyan-400" },
                                            { title: "Fuel", desc: "Surcharge waivers & fuel cashback.", color: "from-orange-400 to-red-400" },
                                            { title: "Cashback", desc: "Money back on every spend.", color: "from-emerald-400 to-green-500" },
                                            { title: "Business", desc: "High limits & expense management.", color: "from-gray-700 to-gray-900" },
                                            { title: "Shopping", desc: "Exclusive discounts on top brands.", color: "from-pink-500 to-rose-500" }
                                        ].map((card, index) => (
                                            <div key={index} className="relative group bg-white p-8 rounded-2xl border border-gray-100 shadow-md hover:shadow-2xl transition-all duration-300 overflow-hidden">
                                                <div className={`absolute top-0 left-0 w-2 h-full bg-gradient-to-b ${card.color}`}></div>
                                                <h3 className="font-bold text-2xl text-[#052F5F] mb-3 group-hover:translate-x-2 transition-transform duration-300">{card.title}</h3>
                                                <p className="text-gray-600">{card.desc}</p>
                                            </div>
                                        ))}
                                    </div>
                                </div>

                                {/* Eligibility & Docs (Split View) */}
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-10 mb-24">
                                    <div className="bg-blue-50/50 p-10 rounded-3xl">
                                        <h2 className="text-2xl font-bold text-[#052F5F] mb-8 flex items-center gap-3">
                                            <span className="w-8 h-8 rounded-lg bg-blue-100 text-blue-600 flex items-center justify-center text-sm font-bold">01</span>
                                            Eligibility Criteria
                                        </h2>
                                        <ul className="space-y-4">
                                            {[
                                                "Age: 21 to 60 years",
                                                "Income: ₹15k – ₹25k / month",
                                                "Credit Score: 650+",
                                                "Stable Income Source"
                                            ].map((item, i) => (
                                                <li key={i} className="flex items-center gap-4 bg-white p-4 rounded-xl shadow-sm">
                                                    <div className="w-2 h-2 bg-blue-500 rounded-full"></div>
                                                    <span className="text-gray-700 font-medium">{item}</span>
                                                </li>
                                            ))}
                                        </ul>
                                    </div>
                                    <div className="bg-orange-50/50 p-10 rounded-3xl">
                                        <h2 className="text-2xl font-bold text-[#052F5F] mb-8 flex items-center gap-3">
                                            <span className="w-8 h-8 rounded-lg bg-orange-100 text-orange-600 flex items-center justify-center text-sm font-bold">02</span>
                                            Documents Required
                                        </h2>
                                        <ul className="space-y-4">
                                            {[
                                                "Identity Proof (Aadhaar/PAN)",
                                                "Address Proof",
                                                "Income Proof (Salary Slip/ITR)",
                                                "Bank Statements"
                                            ].map((item, i) => (
                                                <li key={i} className="flex items-center gap-4 bg-white p-4 rounded-xl shadow-sm">
                                                    <div className="w-2 h-2 bg-orange-500 rounded-full"></div>
                                                    <span className="text-gray-700 font-medium">{item}</span>
                                                </li>
                                            ))}
                                        </ul>
                                    </div>
                                </div>

                                {/* Process Steps */}
                                <div className="mb-24">
                                    <h2 className="text-3xl font-bold text-[#052F5F] mb-12 text-center">Seamless Application Process</h2>
                                    <div className="grid grid-cols-1 md:grid-cols-5 gap-4 relative">
                                        {/* Connecting Line (Desktop) */}
                                        <div className="hidden md:block absolute top-8 left-0 w-full h-0.5 bg-gray-200 -z-10"></div>

                                        {[
                                            "Fill Form",
                                            "Submit Docs",
                                            "Check Eligibility",
                                            "Select Offer",
                                            "Get Approval"
                                        ].map((step, index) => (
                                            <div key={index} className="flex flex-col items-center text-center group">
                                                <div className="w-16 h-16 rounded-full bg-white border-4 border-[#FF6F3C] text-[#FF6F3C] font-extrabold flex items-center justify-center mb-6 text-xl shadow-md group-hover:bg-[#FF6F3C] group-hover:text-white transition-all duration-300 z-10">
                                                    {index + 1}
                                                </div>
                                                <h4 className="font-bold text-[#052F5F] mb-2">{step}</h4>
                                                <p className="text-xs text-gray-500 px-4">Simple & Fast</p>
                                            </div>
                                        ))}
                                    </div>
                                </div>

                                {/* Why Choose Us */}
                                <div className="mb-24 bg-[#052F5F] text-white rounded-3xl p-10 md:p-16 text-center relative overflow-hidden">
                                    <div className="absolute top-0 right-0 w-64 h-64 bg-white opacity-5 rounded-full -mr-32 -mt-32 blur-3xl"></div>
                                    <div className="absolute bottom-0 left-0 w-64 h-64 bg-[#FF6F3C] opacity-10 rounded-full -ml-32 -mb-32 blur-3xl"></div>

                                    <h2 className="text-3xl font-bold mb-10 relative z-10">Why Credits Bazaar?</h2>
                                    <div className="grid grid-cols-2 md:grid-cols-3 gap-8 relative z-10">
                                        {[
                                            "Zero Fees",
                                            "Fast Approval",
                                            "Top Banks",
                                            "Best Deals",
                                            "Secure Data",
                                            "Financial Expert"
                                        ].map((reason, index) => (
                                            <div key={index} className="bg-white/10 backdrop-blur-sm p-4 rounded-xl border border-white/10 hover:bg-white/20 transition duration-300">
                                                <span className="font-semibold">{reason}</span>
                                            </div>
                                        ))}
                                    </div>
                                </div>

                                {/* Bank Partners */}
                                <div className="mb-20">
                                    <p className="text-center text-gray-500 mb-8 tracking-widest text-sm font-semibold">Lenders Available Through Partner DSAs</p>
                                    <div className="flex flex-wrap justify-center gap-4">
                                        {[
                                            "HDFC Bank", "ICICI Bank", "Axis Bank",
                                            "SBI Card", "Yes Bank", "IndusInd Bank", "Kotak"
                                        ].map((bank, i) => (
                                            <span key={i} className="px-6 py-3 bg-white rounded-full text-gray-600 font-bold shadow-sm border border-gray-100 hover:border-blue-200 hover:text-blue-600 transition-colors cursor-default">
                                                {bank}
                                            </span>
                                        ))}
                                    </div>
                                </div>

                                {/* FAQs */}
                                <div>
                                    <h2 className="text-3xl font-bold text-[#052F5F] mb-10 text-center">Frequently Asked Questions</h2>
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                        {[
                                            { q: "Low CIBIL Score?", a: "Yes, we have options for every score range." },
                                            { q: "Approval Time?", a: "Typically 24-48 hours depending on verification." },
                                            { q: "Annual Fees?", a: "Ranges from Lifetime Free to Premium cards." },
                                            { q: "Documents Needed?", a: "Basic KYC and Income proof is sufficient." }
                                        ].map((faq, index) => (
                                            <div key={index} className="p-6 bg-gray-50 rounded-2xl hover:bg-white hover:shadow-lg transition-all duration-300">
                                                <h3 className="font-bold text-[#052F5F] text-lg mb-2">{faq.q}</h3>
                                                <p className="text-gray-600">{faq.a}</p>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <Footer onContactClick={handleTalkToExpert} />
                    <FloatingContactWidget
                        isOpen={isContactOpen}
                        setIsOpen={setIsContactOpen}
                    />
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<CreditCardPage />);
    </script>
    {% endraw %}
</body>

</html>
