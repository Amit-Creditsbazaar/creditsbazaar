<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Disclaimer - Creditsbazaar</title>
    <meta name="description"
        content="Creditsbazaar facilitates loan comparisons and is not a lender. Read our disclaimer for full details on our role, liabilities, and third-party partnerships.">
    <meta name="keywords"
        content="disclaimer, creditsbazaar disclaimer, legal notice, loan disclaimer, fintech policies">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://creditsbazaar.com/disclaimer">

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://creditsbazaar.com/disclaimer">
    <meta property="og:title" content="Disclaimer - Creditsbazaar">
    <meta property="og:description"
        content="Creditsbazaar facilitates loan comparisons and is not a lender. Read our disclaimer for full details on our role and liabilities.">
    <meta property="og:image" content="https://creditsbazaar.com/static/logo.png">

    <!-- Twitter -->
    <meta property="twitter:card" content="summary">
    <meta property="twitter:url" content="https://creditsbazaar.com/disclaimer">
    <meta property="twitter:title" content="Disclaimer - Creditsbazaar">
    <meta property="twitter:description"
        content="Creditsbazaar facilitates loan comparisons and is not a lender. Read our disclaimer for full details on our role and liabilities.">
    <meta property="twitter:image" content="https://creditsbazaar.com/static/logo.png">

    <!-- Schema.org Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebPage",
      "name": "Disclaimer",
      "description": "Legal disclaimer for Creditsbazaar.",
      "url": "https://creditsbazaar.com/disclaimer"
    }
    </script>

    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
    <style>
        body {
            font-family: 'Open Sans', sans-serif;
        }
    </style>
</head>

<body class="bg-gray-50">
    <div id="root"></div>

    {% raw %}
    <script type="text/babel">
        const { useState, useEffect } = React;

        const Navbar = ({ onSignInClick }) => {
            const [isMenuOpen, setIsMenuOpen] = useState(false);
            const menuItems = [
                { name: "Home", link: "/" },
                { name: "Loans", link: "/loans" },
                { name: "Credit Cards", link: "/creditcards" },
                { name: "Calculators", link: "/calculators" }
            ];

            return (
                <nav className="bg-white shadow-md sticky top-0 z-50">
                    <div className="mx-2 md:mx-8 lg:mx-16 py-3 flex items-center justify-between">
                        <div className="flex items-center gap-4">
                            {/* Hamburger Menu Button */}
                            <button
                                className="lg:hidden text-gray-700 focus:outline-none"
                                onClick={() => setIsMenuOpen(!isMenuOpen)}
                            >
                                <svg
                                    className="w-6 h-6"
                                    fill="none"
                                    stroke="currentColor"
                                    viewBox="0 0 24 24"
                                >
                                    {isMenuOpen ? (
                                        <path
                                            strokeLinecap="round"
                                            strokeLinejoin="round"
                                            strokeWidth="2"
                                            d="M6 18L18 6M6 6l12 12"
                                        />
                                    ) : (
                                        <path
                                            strokeLinecap="round"
                                            strokeLinejoin="round"
                                            strokeWidth="2"
                                            d="M4 6h16M4 12h16M4 18h16"
                                        />
                                    )}
                                </svg>
                            </button>
                            <a href="/" className="flex items-center gap-2">
                                <img src="/static/logo.png" alt="CreditsBazaar" className="h-16" />
                            </a>
                        </div>
                        <div className="flex items-center gap-4">
                            <div className="hidden lg:flex items-center gap-6">
                                {menuItems.map((item) => (
                                    <a key={item.name} href={item.link} className="font-semibold text-sm cursor-pointer flex items-center gap-1 transition-colors text-gray-700 hover:text-blue-600">
                                        {item.name}
                                    </a>
                                ))}
                            </div>
                        </div>
                    </div>

                    {/* Mobile Menu Dropdown */}
                    {isMenuOpen && (
                        <div className="lg:hidden bg-white border-t border-gray-100 shadow-lg absolute w-full left-0 py-4 flex flex-col gap-4 px-6">
                            {menuItems.map((item) => (
                                <a
                                    key={item.name}
                                    href={item.link}
                                    className="block text-gray-700 font-semibold hover:text-blue-600 transition"
                                    onClick={() => setIsMenuOpen(false)}
                                >
                                    {item.name}
                                </a>
                            ))}
                        </div>
                    )}
                </nav>
            );
        };

        const DisclaimerContent = () => (
            <div className="bg-white py-16">
                <div className="max-w-5xl mx-auto px-4 md:px-8">
                    <h1 className="text-3xl md:text-4xl font-bold text-[#052F5F] mb-8 text-center">Disclaimer</h1>

                    <div className="prose prose-lg max-w-none text-gray-700 space-y-6">
                        <p>
                            CreditsBazaar is a fintech platform that facilitates access to loan products offered by third-party banks and NBFCs through authorized Digital Service Agent (DSA) partners. CreditsBazaar is not a bank, NBFC, or financial institution and does not provide loans directly.
                        </p>
                        <p>
                            CreditsBazaar does not have direct partnerships with all banks or NBFCs displayed or referenced on this website unless expressly stated. All loan approvals, interest rates, tenure, fees, and disbursal decisions are made solely by the respective lender in accordance with their internal policies.
                        </p>
                        <p>
                            Submission of information on this platform does not guarantee loan approval or disbursal. CreditsBazaar’s role is limited to collecting user information with consent and facilitating communication between users and third-party DSAs or lending partners.
                        </p>
                        <p>
                            CreditsBazaar does not charge any upfront fees for loan facilitation unless explicitly disclosed. Any applicable fees or charges are levied by the respective lender or DSA as per their terms and conditions.
                        </p>
                        <p>
                            All trademarks, logos, brand names, and service marks displayed on this website belong to their respective owners. Their use is for informational purposes only and does not imply endorsement, sponsorship, or direct partnership with CreditsBazaar.
                        </p>
                        <p className="font-semibold">
                            Users are advised to independently verify all loan terms and conditions and carefully review the lender’s documentation before availing any loan product.
                        </p>
                    </div>
                </div>
            </div>
        );

        const Footer = ({ onContactClick }) => (
            <footer className="bg-[#1A202C] text-gray-400 py-12 text-sm">
                <div className="mx-2 md:mx-8 lg:mx-16">
                    <div className="grid grid-cols-2 md:grid-cols-4 gap-8 mb-8">
                        <div>
                            <h4 className="text-white font-bold mb-4 uppercase">Company</h4>
                            <ul className="space-y-2">
                                <li className="hover:text-white cursor-pointer"><a href="/about">About Us</a></li>
                                <li className="hover:text-white cursor-pointer"><a href="/careers">Careers</a></li>
                                <li className="hover:text-white cursor-pointer"><a href="/#partners">Partners</a></li>
                                <li className="hover:text-white cursor-pointer"><a href="/contact">Contact Us</a></li>
                            </ul>
                        </div>
                        <div>
                            <h4 className="text-white font-bold mb-4 uppercase">Our DSA's Partner Services</h4>
                            <ul className="space-y-2">
                                <li className="hover:text-white cursor-pointer"><a href="/loans">Personal Loan</a></li>
                                <li className="hover:text-white cursor-pointer"><a href="/loans">Home Loan</a></li>
                                <li className="hover:text-white cursor-pointer"><a href="/loans">Business Loan</a></li>
                                <li className="hover:text-white cursor-pointer"><a href="/creditcards">Credit Card</a></li>
                            </ul>
                        </div>
                        <div>
                            <h4 className="text-white font-bold mb-4 uppercase">Resources</h4>
                            <ul className="space-y-2">
                                <li className="hover:text-white cursor-pointer"><a href="/calculators">Financial Tools</a></li>
                                <li className="hover:text-white cursor-pointer">Blogs</li>
                                <li className="hover:text-white cursor-pointer"><a href="/faq">FAQs</a></li>
                                <li className="hover:text-white cursor-pointer"><a href="/glossary">Glossary</a></li>
                            </ul>
                        </div>
                        <div>
                            <h4 className="text-white font-bold mb-4 uppercase">Contact</h4>
                            <ul className="space-y-2">
                                <li>amit@creditsbazaar.com</li>
                                <li>9625835453</li>
                                <li className="mt-4 flex gap-4">
                                    <a href="https://www.instagram.com/official_creditsbazaar?igsh=MW5iaWQ1OTkxemFncQ==" target="_blank" rel="noopener noreferrer" className="w-8 h-8 bg-gray-700 rounded-full flex items-center justify-center hover:bg-pink-600 cursor-pointer transition-colors block">
                                        <svg className="w-4 h-4 text-white" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                                            <path fillRule="evenodd" d="M12.315 2c2.43 0 2.784.013 3.808.06 1.064.049 1.791.218 2.427.465a4.902 4.902 0 011.772 1.153 4.902 4.902 0 011.153 1.772c.247.636.416 1.363.465 2.427.048 1.067.06 1.407.06 4.123v.08c0 2.643-.012 2.987-.06 4.043-.049 1.064-.218 1.791-.465 2.427a4.902 4.902 0 01-1.153 1.772 4.902 4.902 0 01-1.153-1.772c-.636.247-1.363.416-2.427.465-1.067.048-1.407.06-4.123.06h-.08c-2.643 0-2.987-.012-4.043-.06-1.064-.049-1.791-.218-2.427-.465a4.902 4.902 0 01-1.772-1.153 4.902 4.902 0 01-1.153-1.772c-.247-.636-.416-1.363-.465-2.427-.047-1.024-.06-1.379-.06-3.808v-.63c0-2.43.013-2.784.06-3.808.049-1.064.218-1.791.465-2.427a4.902 4.902 0 011.153-1.772A4.902 4.902 0 015.468 2.525c.636-.247 1.363-.416 2.427-.465C8.901 2.013 9.256 2 11.685 2h.63zm-.081 1.802h-.468c-2.456 0-2.784.011-3.807.058-.975.045-1.504.207-1.857.344-.467.182-.8.398-1.15.748-.35.35-.566.683-.748 1.15-.137.353-.3.882-.344 1.857-.047 1.023-.058 1.351-.058 3.807v.468c0 2.456.011 2.784.058 3.807.045.975.207 1.504.344 1.857.182.466.399.8.748 1.15.35.35.683.566 1.15.748.353.137.882.3 1.857.344 1.054.048 1.37.058 4.041.058h.08c2.597 0 2.917-.01 3.96-.058.976-.045 1.505-.207 1.858-.344.466-.182.8-.398 1.15-.748.35-.35.566-.683.748-1.15.137-.353.3-.882.344-1.857.048-1.055.058-1.37.058-4.041v-.08c0-2.597-.01-2.917-.058-3.96-.045-.976-.207-1.505-.344-1.858a3.097 3.097 0 00-.748-1.15 3.098 3.098 0 00-1.15-.748c-.353-.137-.882-.3-1.857-.344-1.023-.047-1.351-.058-3.807-.058zM12 6.865a5.135 5.135 0 110 10.27 5.135 5.135 0 010-10.27zm0 1.802a3.333 3.333 0 100 6.666 3.333 3.333 0 000-6.666zm5.338-3.205a1.2 1.2 0 110 2.4 1.2 1.2 0 010-2.4z" clipRule="evenodd" />
                                        </svg>
                                    </a>
                                </li>
                            </ul>
                        </div>
                    </div>
                    <div className="border-t border-gray-700 mt-12 pt-8">
                        <div className="flex flex-wrap justify-center gap-x-8 gap-y-4 text-xs font-medium text-gray-400 mb-6 uppercase tracking-wide">
                            <a href="/privacy-policy" className="hover:text-white transition-colors duration-200">Privacy Policy</a>
                            <a href="/terms-condition" className="hover:text-white transition-colors duration-200">Terms & Conditions</a>
                            <a href="/disclaimer" className="hover:text-white transition-colors duration-200 text-white">Disclaimer</a>
                        </div>
                        <div className="text-center text-xs text-gray-600">
                            <p>&copy; 2026 Creditsbazaar.com. All Rights Reserved.</p>
                            <p className="mt-2">Disclaimer: All info provided is for informational purposes only.</p>
                        </div>
                    </div>
                </div>
            </footer>
        );

        const FloatingContactWidget = ({ isOpen, setIsOpen }) => {
            const handleClose = () => {
                setIsOpen(false);
            };

            return (
                <div
                    className="fixed right-0 top-1/2 -translate-y-1/2 z-50 transition-all duration-500 ease-in-out"
                    style={{
                        transform: `translateY(-50%) translateX(${isOpen ? '0' : '100%'})`
                    }}
                >
                    <div className="bg-gradient-to-br from-blue-600 to-blue-700 text-white rounded-l-2xl shadow-2xl overflow-hidden" style={{ width: '320px' }}>
                        <div className="bg-blue-800 px-6 py-4 flex items-center justify-between">
                            <div className="flex items-center gap-3">
                                <div className="w-10 h-10 bg-white rounded-full flex items-center justify-center">
                                    <svg className="w-6 h-6 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"></path>
                                    </svg>
                                </div>
                                <div>
                                    <h3 className="font-bold text-sm">Need Help?</h3>
                                    <p className="text-xs text-blue-100">Talk to Expert</p>
                                </div>
                            </div>
                            <button
                                onClick={handleClose}
                                className="text-white hover:text-blue-200 transition"
                            >
                                <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12"></path>
                                </svg>
                            </button>
                        </div>

                        <div className="px-6 py-6">
                            <p className="text-sm mb-4 text-blue-50">
                                Get instant assistance from our customer executives. We're here to help!
                            </p>

                            <div className="bg-white rounded-xl p-4 mb-4">
                                <div className="flex items-center gap-3 mb-3">
                                    <div className="w-12 h-12 bg-blue-100 rounded-full flex items-center justify-center">
                                        <svg className="w-6 h-6 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                                        </svg>
                                    </div>
                                    <div>
                                        <p className="text-xs text-gray-500 font-semibold">Customer Executive</p>
                                        <p className="text-sm text-gray-800 font-bold">Available 24/7</p>
                                    </div>
                                </div>

                                <a
                                    href="tel:9625835453"
                                    className="flex items-center justify-center gap-2 bg-gradient-to-r from-blue-600 to-blue-700 text-white font-bold py-3 px-4 rounded-lg hover:from-blue-700 hover:to-blue-800 transition shadow-lg transform hover:scale-105 no-underline"
                                >
                                    <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"></path>
                                    </svg>
                                    9625835453
                                </a>
                            </div>

                            <p className="text-xs text-blue-100 text-center">
                                Call us for instant loan & credit card assistance
                            </p>
                        </div>

                        {!isOpen && (
                            <div
                                onClick={() => setIsOpen(true)}
                                className="absolute left-0 top-1/2 -translate-y-1/2 -translate-x-full bg-blue-600 text-white px-3 py-6 rounded-l-lg shadow-lg cursor-pointer hover:bg-blue-700 transition-colors"
                            >
                                <div className="flex flex-col items-center gap-2">
                                    <span className="text-xs font-bold writing-mode-vertical transform rotate-180" style={{ writingMode: 'vertical-rl' }}>
                                        CONTACT
                                    </span>
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        };


        function App() {
            const [isContactOpen, setIsContactOpen] = useState(false);

            const handleTalkToExpert = () => {
                setIsContactOpen(true);
            };

            return (
                <div className="font-sans text-gray-800 bg-gray-50 min-h-screen pb-0 flex flex-col">
                    <Navbar />
                    <div className="flex-grow">
                        <DisclaimerContent />
                    </div>
                    <Footer onContactClick={handleTalkToExpert} />
                    <FloatingContactWidget
                        isOpen={isContactOpen}
                        setIsOpen={setIsContactOpen}
                    />
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
    {% endraw %}
</body>

</html>
