        content="Explore career opportunities at Creditsbazaar. Join a fast-growing fintech company and help shape the future of digital lending in India. View open roles now.">

        content="careers at creditsbazaar, fintech jobs, finance jobs, hiring, startup jobs, internship, work at creditsbazaar">

<body class="bg-gray-50">
    <div id="root"></div>

    <script id="job-data" type="application/json">
        {{ jobs | tojson | safe }}
    </script>

    {% raw %}
    <script type="text/babel">
        const { useState, useEffect } = React;

        const Navbar = () => {
            const [isMenuOpen, setIsMenuOpen] = useState(false);
            const menuItems = [
                { name: "Home", link: "/" },
                { name: "Loans", link: "/loans" },
                { name: "Credit Cards", link: "/creditcards" },
                { name: "Calculators", link: "/calculators" }
            ];
            const loanTypes = [
                { name: "Personal Loan", link: "/loans/personal-loan" },
                { name: "Business Loan", link: "/loans/business-loan" },
                { name: "Loan Against Property", link: "/loans/loan-against-property" },
                { name: "Home Loan", link: "/loans/home-loan" },
                { name: "OverDraft", link: "/loans/overdraft" },
                { name: "Credit Card", link: "/loans/credit-card" },
                { name: "Car Loan", link: "/loans/car-loan" }
            ];

            return (
                <nav className="bg-white shadow-md sticky top-0 z-50">
                    <div className="mx-2 md:mx-8 lg:mx-16 py-3 flex items-center justify-between">
                        <div className="flex items-center gap-4">
                            <button
                                className="lg:hidden text-gray-700 focus:outline-none"
                                onClick={() => setIsMenuOpen(!isMenuOpen)}
                            >
                                <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    {isMenuOpen ? (
                                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12" />
                                    ) : (
                                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 6h16M4 12h16M4 18h16" />
                                    )}
                                </svg>
                            </button>
                            <a href="/" className="flex items-center gap-2">
                                <img src="/static/logo.png" alt="Creditsbazaar" className="h-16" />
                            </a>
                        </div>
                        <div className="flex items-center gap-4">
                            <div className="hidden lg:flex items-center gap-6">
                                {menuItems.map((item) => (
                                    item.name === "Loans" ? (
                                        <div key={item.name} className="relative group">
                                            <a href="/loans" className="font-semibold text-sm cursor-pointer flex items-center gap-1 transition-colors text-gray-700 hover:text-blue-600 py-2">
                                                Loans
                                                <svg className="w-3 h-3 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 9l-7 7-7-7" /></svg>
                                            </a>
                                            <div className="absolute left-0 top-full hidden group-hover:block bg-white shadow-xl rounded-lg border border-gray-100 py-2 w-56 z-50">
                                                {loanTypes.map((lt) => (
                                                    <a key={lt.name} href={lt.link} className="block px-4 py-2 text-sm text-gray-700 hover:bg-blue-50 hover:text-blue-600 transition-colors">
                                                        {lt.name}
                                                    </a>
                                                ))}
                                            </div>
                                        </div>
                                    ) : (
                                        <a key={item.name} href={item.link} className="font-semibold text-sm cursor-pointer text-gray-700 hover:text-blue-600 transition-colors">
                                            {item.name}
                                        </a>
                                    )
                                    ))}
                            </div>
                        </div>
                    </div>
                    {isMenuOpen && (
                        <div className="lg:hidden bg-white border-t border-gray-100 shadow-lg absolute w-full left-0 py-4 flex flex-col gap-4 px-6">
                            {menuItems.map((item) => (
                                item.name === "Loans" ? (
                                    <div key={item.name} className="flex flex-col gap-2">
                                        <span className="block text-gray-700 font-bold">Loans</span>
                                        <div className="flex flex-col gap-2 pl-4 border-l-2 border-gray-100">
                                            {loanTypes.map((lt) => (
                                                <a key={lt.name} href={lt.link} className="block text-gray-600 text-sm hover:text-blue-600 transition" onClick={() => setIsMenuOpen(false)}>
                                                    {lt.name}
                                                </a>
                                            ))}
                                        </div>
                                    </div>
                                ) : (
                                <a key={item.name} href={item.link} className="block text-gray-700 font-semibold hover:text-blue-600 transition" onClick={() => setIsMenuOpen(false)}>
                                    {item.name}
                                </a>
                                )
                            ))}
                        </div>
                    )}
                </nav>
            );
        };

        const Footer = () => (
            <footer className="bg-[#1A202C] text-gray-400 py-12 text-sm">
                <div className="mx-2 md:mx-8 lg:mx-16">
                    <div className="grid grid-cols-2 md:grid-cols-4 gap-8 mb-8">
                        <div>
                            <h4 className="text-white font-bold mb-4 uppercase">Company</h4>
                            <ul className="space-y-2">
                                <li className="hover:text-white cursor-pointer"><a href="/about">About Us</a></li>
                                <li className="hover:text-white cursor-pointer"><a href="/careers">Careers</a></li>
                                <li className="hover:text-white cursor-pointer"><a href="/#partners">Partners</a></li>
                                <li className="hover:text-white cursor-pointer"><a href="/contact">Contact Us</a></li>
                            </ul>
                        </div>
                        <div>
                            <h4 className="text-white font-bold mb-4 uppercase">Our DSA's Partner Services</h4>
                            <ul className="space-y-2">
                                <li className="hover:text-white cursor-pointer"><a href="/loans/personal-loan">Personal Loan</a></li>
                                <li className="hover:text-white cursor-pointer"><a href="/loans/business-loan">Business Loan</a></li>
                                <li className="hover:text-white cursor-pointer"><a href="/loans/loan-against-property">Loan Against Property</a></li>
                                <li className="hover:text-white cursor-pointer"><a href="/loans/home-loan">Home Loan</a></li>
                                <li className="hover:text-white cursor-pointer"><a href="/loans/overdraft">OverDraft</a></li>
                                <li className="hover:text-white cursor-pointer"><a href="/loans/credit-card">Credit Card</a></li>
                                <li className="hover:text-white cursor-pointer"><a href="/loans/car-loan">Car Loan</a></li>
                            </ul>
                        </div>
                        <div>
                            <h4 className="text-white font-bold mb-4 uppercase">Resources</h4>
                            <ul className="space-y-2">
                                <li className="hover:text-white cursor-pointer"><a href="/calculators">Financial Tools</a></li>
                                <li className="hover:text-white cursor-pointer">Blogs</li>
                                <li className="hover:text-white cursor-pointer"><a href="/faq">FAQs</a></li>
                                <li className="hover:text-white cursor-pointer"><a href="/glossary">Glossary</a></li>
                            </ul>
                        </div>
                        <div>
                            <h4 className="text-white font-bold mb-4 uppercase">Contact Us</h4>
                            <ul className="space-y-2">
                                <li>amit@creditsbazaar.com</li>
                                <li className="mt-4 flex gap-4">
                                    <a href="https://www.instagram.com/officialcreditsbazaar?igsh=YjhsMmtsZ2UydDg3" target="_blank" rel="noopener noreferrer" className="w-8 h-8 bg-gray-700 rounded-full flex items-center justify-center hover:bg-pink-600 cursor-pointer transition-colors block">
                                        <svg className="w-4 h-4 text-white" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                                            <path fillRule="evenodd" d="M12.315 2c2.43 0 2.784.013 3.808.06 1.064.049 1.791.218 2.427.465a4.902 4.902 0 011.772 1.153 4.902 4.902 0 011.153 1.772c.247.636.416 1.363.465 2.427.048 1.067.06 1.407.06 4.123v.08c0 2.643-.012 2.987-.06 4.043-.049 1.064-.218 1.791-.465 2.427a4.902 4.902 0 01-1.153 1.772 4.902 4.902 0 01-1.772 1.153c-.636.247-1.363.416-2.427.465-1.067.048-1.407.06-4.123.06h-.08c-2.643 0-2.987-.012-4.043-.06-1.064-.049-1.791-.218-2.427-.465a4.902 4.902 0 01-1.772-1.153 4.902 4.902 0 01-1.153-1.772c-.247-.636-.416-1.363-.465-2.427-.047-1.024-.06-1.379-.06-3.808v-.63c0-2.43.013-2.784.06-3.808.049-1.064.218-1.791.465-2.427a4.902 4.902 0 011.153-1.772A4.902 4.902 0 015.468 2.525c.636-.247 1.363-.416 2.427-.465C8.901 2.013 9.256 2 11.685 2h.63zm-.081 1.802h-.468c-2.456 0-2.784.011-3.807.058-.975.045-1.504.207-1.857.344-.467.182-.8.398-1.15.748-.35.35-.566.683-.748 1.15-.137.353-.3.882-.344 1.857-.047 1.023-.058 1.351-.058 3.807v.468c0 2.456.011 2.784.058 3.807.045.975.207 1.504.344 1.857.182.466.399.8.748 1.15.35.35.683.566 1.15.748.353.137.882.3 1.857.344 1.054.048 1.37.058 4.041.058h.08c2.597 0 2.917-.01 3.96-.058.976-.045 1.505-.207 1.858-.344.466-.182.8-.398 1.15-.748.35-.35.566-.683.748-1.15.137-.353.3-.882.344-1.857.048-1.055.058-1.37.058-4.041v-.08c0-2.597-.01-2.917-.058-3.96-.045-.976-.207-1.505-.344-1.858a3.097 3.097 0 00-.748-1.15 3.098 3.098 0 00-1.15-.748c-.353-.137-.882-.3-1.857-.344-1.023-.047-1.351-.058-3.807-.058zM12 6.865a5.135 5.135 0 110 10.27 5.135 5.135 0 010-10.27zm0 1.802a3.333 3.333 0 100 6.666 3.333 3.333 0 000-6.666zm5.338-3.205a1.2 1.2 0 110 2.4 1.2 1.2 0 010-2.4z" clipRule="evenodd" />
                                        </svg>
                                    </a>
                                    <a href="https://www.facebook.com/share/1ETijZE7iE/" target="_blank" rel="noopener noreferrer" className="w-8 h-8 bg-gray-700 rounded-full flex items-center justify-center hover:bg-blue-600 cursor-pointer transition-colors block">
                                        <svg className="w-4 h-4 text-white" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                                            <path d="M22 12c0-5.523-4.477-10-10-10S2 6.477 2 12c0 4.991 3.657 9.128 8.438 9.878v-6.987h-2.54V12h2.54V9.797c0-2.506 1.492-3.89 3.777-3.89 1.094 0 2.238.195 2.238.195v2.46h-1.26c-1.243 0-1.63.771-1.63 1.562V12h2.773l-.443 2.89h-2.33v6.988C18.343 21.128 22 16.991 22 12z"/>
                                        </svg>
                                    </a>
                                    <a href="https://youtube.com/@creditsbazaar_official?si=qb1TA8U71P9U-C8-" target="_blank" rel="noopener noreferrer" className="w-8 h-8 bg-gray-700 rounded-full flex items-center justify-center hover:bg-red-600 cursor-pointer transition-colors block">
                                        <svg className="w-4 h-4 text-white" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                                            <path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/>
                                        </svg>
                                    </a>
                                    <a href="https://www.linkedin.com/in/credit-bazaar-4b20483b8?utm_source=share_via&utm_content=profile&utm_medium=member_android" target="_blank" rel="noopener noreferrer" className="w-8 h-8 bg-gray-700 rounded-full flex items-center justify-center hover:bg-blue-700 cursor-pointer transition-colors block">
                                        <svg className="w-4 h-4 text-white" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                                            <path d="M19 0h-14c-2.761 0-5 2.239-5 5v14c0 2.761 2.239 5 5 5h14c2.762 0 5-2.239 5-5v-14c0-2.761-2.238-5-5-5zm-11 19h-3v-11h3v11zm-1.5-12.268c-.966 0-1.75-.79-1.75-1.764s.784-1.764 1.75-1.764 1.75.79 1.75 1.764-.783 1.764-1.75 1.764zm13.5 12.268h-3v-5.604c0-3.368-4-3.113-4 0v5.604h-3v-11h3v1.765c1.396-2.586 7-2.777 7 2.476v6.759z"/>
                                        </svg>
                                    </a>
                                    <a href="https://x.com/CreditsBazaar" target="_blank" rel="noopener noreferrer" className="w-8 h-8 bg-gray-700 rounded-full flex items-center justify-center hover:bg-black cursor-pointer transition-colors block">
                                        <svg className="w-4 h-4 text-white" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true">

                                        </svg>
                                    </a>
                                </li>
                            </ul>
                        </div>
                    </div>
                    <div className="border-t border-gray-700 mt-12 pt-8">
                        <div className="flex flex-wrap justify-center gap-x-8 gap-y-4 text-xs font-medium text-gray-400 mb-6 uppercase tracking-wide">
                            <a href="/privacy-policy" className="hover:text-white transition-colors duration-200">Privacy Policy</a>
                            <a href="/terms-condition" className="hover:text-white transition-colors duration-200">Terms & Conditions</a>
                            <a href="/disclaimer" className="hover:text-white transition-colors duration-200">Disclaimer</a>
                        </div>
                        <div className="text-center text-xs text-gray-600">
                            <p>&copy; 2026 Creditsbazaar.com. All Rights Reserved.</p>
                            <p className="mt-2">Disclaimer: All info provided is for informational purposes only.</p>
                        </div>
                    </div>
                </div>
            </footer>
        );

        const CareersHero = () => (
            <div className="bg-[#052F5F] text-white py-20 text-center relative overflow-hidden">
                <div className="absolute top-0 left-0 w-64 h-64 bg-blue-500 rounded-full mix-blend-multiply filter blur-3xl opacity-20 -translate-x-1/2 -translate-y-1/2"></div>
                <div className="absolute bottom-0 right-0 w-64 h-64 bg-purple-500 rounded-full mix-blend-multiply filter blur-3xl opacity-20 translate-x-1/2 translate-y-1/2"></div>

                <div className="relative z-10 mx-2 md:mx-8 lg:mx-16 max-w-4xl lg:mx-auto">
                    <h1 className="text-4xl md:text-5xl font-bold mb-6">Build Fintech That Expands Access to Credit</h1>
                    <p className="text-xl text-blue-100 leading-relaxed">
                        CreditsBazaar is a technology-driven fintech platform that helps users discover and apply for loan products through trusted DSA and lending partners. We are not a bank or NBFC — we build systems, processes, and partnerships that make credit access simpler and more transparent.
                    </p>
                </div>
            </div>
        );

        const WhyJoin = () => (
            <div className="py-16 bg-white">
                <div className="mx-2 md:mx-8 lg:mx-16">
                    <div className="text-center mb-12">
                        <h2 className="text-3xl font-bold text-[#052F5F] mb-4">Why Join CreditsBazaar?</h2>
                        <p className="text-gray-600">If you want to grow in fintech, technology, and financial services, you’re in the right place.</p>
                    </div>

                    <div className="grid md:grid-cols-2 lg:grid-cols-5 gap-6">
                        {[
                            { icon: "🚀", title: "Fast-growing fintech environment" },
                            { icon: "💡", title: "Hands-on exposure to lending workflows" },
                            { icon: "🤝", title: "Collaborative, learning-focused culture" },
                            { icon: "📈", title: "Growth opportunities as company scales" },
                            { icon: "🎯", title: "Work that impacts real users" }
                        ].map((item, idx) => (
                            <div key={idx} className="bg-blue-50 p-6 rounded-xl text-center hover:bg-blue-100 transition duration-300">
                                <div className="text-3xl mb-3">{item.icon}</div>
                                <h3 className="font-bold text-gray-800 text-sm leading-tight">{item.title}</h3>
                            </div>
                        ))}
                    </div>
                </div>
            </div>
        );

        const OpenRoles = ({ jobs }) => (
            <div className="py-16 bg-gray-50">
                <div className="mx-2 md:mx-8 lg:mx-16">
                    <div className="text-center mb-10">
                        <h2 className="text-3xl font-bold text-[#052F5F] mb-2">Open Roles</h2>
                        <div className="h-1 w-16 bg-blue-600 mx-auto rounded"></div>
                    </div>

                    {jobs && jobs.length > 0 ? (
                        <div className="grid gap-6 max-w-4xl mx-auto">
                            {jobs.map((job) => (
                                <div key={job.id} className="bg-white p-8 rounded-2xl shadow-sm hover:shadow-md transition border border-gray-100">
                                    <div className="flex flex-col md:flex-row md:items-start justify-between gap-4 mb-4">
                                        <div>
                                            <h3 className="text-2xl font-bold text-[#052F5F]">{job.title}</h3>
                                            <div className="flex gap-3 text-sm text-gray-500 mt-2">
                                                <span className="bg-blue-50 text-blue-700 px-3 py-1 rounded-full">{job.department}</span>
                                                <span className="flex items-center gap-1">
                                                    <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                                                    {job.location}
                                                </span>
                                            </div>
                                        </div>
                                        <div className="flex-shrink-0">
                                            <span className="inline-block px-3 py-1 bg-green-100 text-green-700 rounded-full text-xs font-bold uppercase tracking-wide">{job.type}</span>
                                        </div>
                                    </div>

                                    <div className="grid md:grid-cols-2 gap-8 mt-6">
                                        {job.responsibilities && (
                                            <div>
                                                <h4 className="font-bold text-gray-800 mb-2">Responsibilities:</h4>
                                                <div className="text-gray-600 text-sm whitespace-pre-line leading-relaxed">{job.responsibilities}</div>
                                            </div>
                                        )}
                                        {job.requirements && (
                                            <div>
                                                <h4 className="font-bold text-gray-800 mb-2">Ideal for:</h4>
                                                <div className="text-gray-600 text-sm whitespace-pre-line leading-relaxed">{job.requirements}</div>
                                            </div>
                                        )}
                                    </div>

                                    <div className="mt-8 pt-6 border-t border-gray-100">
                                        <p className="text-sm font-semibold mb-2">How to Apply:</p>
                                        <div className="flex flex-wrap gap-4 text-sm text-gray-600">
                                            <span className="flex items-center gap-2">
                                                <span>📧 Email:</span>
                                                <a href="mailto:Amit@creditsbazaar.com" className="text-blue-600 hover:underline">Amit@creditsbazaar.com</a>
                                            </span>
                                            <span>📌 Subject: {job.title} – Your Name</span>
                                        </div>
                                    </div>
                                </div>
                            ))}
                        </div>
                    ) : (
                        <div className="text-center py-10 bg-white rounded-xl shadow-sm border border-gray-100 max-w-2xl mx-auto">
                            <p className="text-gray-500">No open positions currently. Check back soon!</p>
                        </div>
                    )}
                </div>
            </div>
        );

        const Internship = () => (
            <div className="py-16 bg-white">
                <div className="mx-2 md:mx-8 lg:mx-16 max-w-5xl lg:mx-auto">
                    <div className="bg-gradient-to-r from-blue-600 to-blue-800 rounded-3xl p-8 md:p-12 text-white relative overflow-hidden">
                        <div className="relative z-10">
                            <div className="grid md:grid-cols-2 gap-10 items-center">
                                <div>
                                    <h2 className="text-3xl font-bold mb-4">Internship Program</h2>
                                    <p className="text-blue-100 mb-6">CreditsBazaar Internship Program is designed for students and fresh graduates who want practical exposure to fintech and digital lending.</p>

                                    <div className="mb-6">
                                        <h4 className="font-bold text-white mb-3">Domains Available:</h4>
                                        <ul className="grid grid-cols-2 gap-2 text-sm text-blue-100">
                                            <li className="flex items-center gap-2">✓ Sales & Customer Support</li>
                                            <li className="flex items-center gap-2">✓ Operations & Documentation</li>
                                            <li className="flex items-center gap-2">✓ Technology & Product</li>
                                            <li className="flex items-center gap-2">✓ Compliance & Research</li>
                                        </ul>
                                    </div>

                                    <div className="flex gap-6 text-sm">
                                        <div>
                                            <span className="block text-blue-300 text-xs">Duration</span>
                                            <span className="font-bold">2–6 months</span>
                                        </div>
                                        <div>
                                            <span className="block text-blue-300 text-xs">Mode</span>
                                            <span className="font-bold">Remote / Hybrid</span>
                                        </div>
                                    </div>
                                </div>
                                <div className="bg-white/10 backdrop-blur-md p-6 rounded-2xl border border-white/20">
                                    <h3 className="font-bold mb-4">Apply for Internship</h3>
                                    <div className="space-y-3 text-sm">
                                        <div className="p-3 bg-white/10 rounded-lg">
                                            <p className="text-blue-200 text-xs">Email to:</p>
                                            <p className="font-mono">Amit@creditsbazaar.com</p>
                                        </div>
                                        <div className="p-3 bg-white/10 rounded-lg">
                                            <p className="text-blue-200 text-xs">Subject Line:</p>
                                            <p className="font-mono">Internship – Your Name</p>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        );

        const EqualOpportunity = () => (
            <div className="py-8 bg-gray-50 border-t border-gray-200">
                <div className="mx-2 md:mx-8 lg:mx-16 text-center">
                    <p className="text-sm text-gray-400">** CreditsBazaar is an equal opportunity employer. We do not discriminate based on gender, caste, religion, background, or disability.</p>
                </div>
            </div>
        );

        function App() {
            // Read jobs from the injected script tag
            const jobsText = document.getElementById('job-data').textContent;
            const jobs = JSON.parse(jobsText || "[]");

            return (
                <div className="font-sans text-gray-800 bg-gray-50 min-h-screen pb-0">
                    <Navbar />
                    <CareersHero />
                    <WhyJoin />
                    <OpenRoles jobs={jobs} />
                    <Internship />
                    <EqualOpportunity />
                    <Footer />
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
    {% endraw %}
</body>
