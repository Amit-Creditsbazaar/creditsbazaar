<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="google-site-verification" content="xD85Mz8xn2ZWUWSRvvkrPq_47S2qwhhu5urrxYnTYdI" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Creditsbazaar - Smart Loans & Credit Card Offers</title>
    <meta name="description"
        content="Discover smart financial solutions with Creditsbazaar. Compare and apply for Personal Loans, Home Loans, Business Loans, and Credit Cards with quick approval and competitive rates.">
    <meta name="keywords"
        content="personal loan, home loan, business loan, credit cards, loan calculator, instant loan approval, creditsbazaar, finance, low interest loans">
    <meta name="author" content="Creditsbazaar">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://creditsbazaar.com/">

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://creditsbazaar.com/">
    <meta property="og:title" content="Creditsbazaar - Smart Loans & Credit Card Offers">
    <meta property="og:description"
        content="Discover smart financial solutions with Creditsbazaar. Compare and apply for Personal Loans, Home Loans, Business Loans, and Credit Cards.">
    <meta property="og:image" content="https://creditsbazaar.com/static/logo.png">

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://creditsbazaar.com/">
    <meta property="twitter:title" content="Creditsbazaar - Smart Loans & Credit Card Offers">
    <meta property="twitter:description"
        content="Discover smart financial solutions with Creditsbazaar. Compare and apply for Personal Loans, Home Loans, Business Loans, and Credit Cards.">
    <meta property="twitter:image" content="https://creditsbazaar.com/static/logo.png">

    <!-- Schema.org Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Creditsbazaar",
      "url": "https://creditsbazaar.com/",
      "logo": "https://creditsbazaar.com/static/logo.png",
      "description": "Creditsbazaar offers smart financial solutions including Personal Loans, Home Loans, Business Loans, and Credit Cards.",
      "contactPoint": {
        "@type": "ContactPoint",
        "telephone": "+91-9625835453",
        "contactType": "customer service",
        "areaServed": "IN",
        "availableLanguage": "en"
      },
      "sameAs": [
        "https://www.instagram.com/officialcreditsbazaar?igsh=YjhsMmtsZ2UydDg3",
        "https://www.facebook.com/share/1ETijZE7iE/",
        "https://youtube.com/@creditsbazaar_official?si=qb1TA8U71P9U-C8-"
      ]
    }
    </script>

    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
    <style>
        body {
            font-family: 'Open Sans', sans-serif;
        }
    </style>
</head>

<body>
    <div id="root"></div>

    {% raw %}
    <script type="text/babel">
        const { useState, useEffect } = React;

        const Logo = () => (
            <div className="flex items-center">
                <img src="/static/logo.png" alt="Creditsbazaar" className="h-16" />
            </div>
        );



        const Navbar = ({ onSignInClick }) => {
            const [isMenuOpen, setIsMenuOpen] = useState(false);
            const menuItems = [
                { name: "Home", link: "/" },
                { name: "Loans", link: "/loans" },
                { name: "Credit Cards", link: "/creditcards" },
                { name: "Calculators", link: "/calculators" }
            ];
            const loanTypes = [
                { name: "Personal Loan", link: "/loans/personal-loan" },
                { name: "Business Loan", link: "/loans/business-loan" },
                { name: "Loan Against Property", link: "/loans/loan-against-property" },
                { name: "Home Loan", link: "/loans/home-loan" },
                { name: "OverDraft", link: "/loans/overdraft" },
                { name: "Credit Card", link: "/loans/credit-card" },
                { name: "Car Loan", link: "/loans/car-loan" }
            ];

            return (
                <nav className="bg-white shadow-md sticky top-0 z-50">
                    <div className="mx-2 md:mx-8 lg:mx-16 py-3 flex items-center justify-between">
                        <div className="flex items-center gap-4">
                            {/* Hamburger Menu Button */}
                            <button
                                className="lg:hidden text-gray-700 focus:outline-none"
                                onClick={() => setIsMenuOpen(!isMenuOpen)}
                            >
                                <svg
                                    className="w-6 h-6"
                                    fill="none"
                                    stroke="currentColor"
                                    viewBox="0 0 24 24"
                                >
                                    {isMenuOpen ? (
                                        <path
                                            strokeLinecap="round"
                                            strokeLinejoin="round"
                                            strokeWidth="2"
                                            d="M6 18L18 6M6 6l12 12"
                                        />
                                    ) : (
                                        <path
                                            strokeLinecap="round"
                                            strokeLinejoin="round"
                                            strokeWidth="2"
                                            d="M4 6h16M4 12h16M4 18h16"
                                        />
                                    )}
                                </svg>
                            </button>
                            <Logo />
                        </div>

                        <div className="flex items-center gap-4">
                            <div className="hidden lg:flex items-center gap-6">
                                {menuItems.map((item) => (
                                    item.name === "Loans" ? (
                                        <div key={item.name} className="relative group">
                                            <a href="/loans" className={`font-semibold text-sm cursor-pointer flex items-center gap-1 transition-colors py-2 ${item.name === "Home" ? "text-blue-600" : "text-gray-700 hover:text-blue-600"}`}>
                                                Loans
                                                <svg className="w-3 h-3 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 9l-7 7-7-7" /></svg>
                                            </a>
                                            <div className="absolute left-0 top-full hidden group-hover:block bg-white shadow-xl rounded-lg border border-gray-100 py-2 w-56 z-50">
                                                {loanTypes.map((lt) => (
                                                    <a key={lt.name} href={lt.link} className="block px-4 py-2 text-sm text-gray-700 hover:bg-blue-50 hover:text-blue-600 transition-colors">
                                                        {lt.name}
                                                    </a>
                                                ))}
                                            </div>
                                        </div>
                                    ) : (
                                    <a key={item.name} href={item.link} className={`font-semibold text-sm cursor-pointer flex items-center gap-1 transition-colors ${item.name === "Home" ? "text-blue-600" : "text-gray-700 hover:text-blue-600"}`}>
                                        {item.name}
                                    </a>
                                    )
                                ))}
                            </div>
                            <button onClick={onSignInClick} className="hidden lg:block text-blue-600 font-bold text-sm border border-blue-600 px-5 py-2 rounded hover:bg-blue-50 transition">
                                Sign In
                            </button>
                        </div>
                    </div>

                    {/* Mobile Menu Dropdown */}
                    {isMenuOpen && (
                        <div className="lg:hidden bg-white border-t border-gray-100 shadow-lg absolute w-full left-0 py-4 flex flex-col gap-4 px-6">
                            {menuItems.map((item) => (
                                item.name === "Loans" ? (
                                    <div key={item.name} className="flex flex-col gap-2">
                                        <span className="block text-gray-700 font-bold">Loans</span>
                                        <div className="flex flex-col gap-2 pl-4 border-l-2 border-gray-100">
                                            {loanTypes.map((lt) => (
                                                <a
                                                    key={lt.name}
                                                    href={lt.link}
                                                    className="block text-gray-600 text-sm hover:text-blue-600 transition"
                                                    onClick={() => setIsMenuOpen(false)}
                                                >
                                                    {lt.name}
                                                </a>
                                            ))}
                                        </div>
                                    </div>
                                ) : (
                                <a
                                    key={item.name}
                                    href={item.link}
                                    className="block text-gray-700 font-semibold hover:text-blue-600 transition"
                                    onClick={() => setIsMenuOpen(false)}
                                >
                                    {item.name}
                                </a>
                                )
                            ))}
                            <button
                                onClick={() => {
                                    setIsMenuOpen(false);
                                    onSignInClick();
                                }}
                                className="block w-full text-center text-blue-600 font-bold text-sm border border-blue-600 px-5 py-2 rounded hover:bg-blue-50 transition"
                            >
                                Sign In
                            </button>
                        </div>
                    )}
                </nav>
            );
        };

        const ImageSlider = () => {
            const images = [
                "/static/1.png",
                "/static/2.png",
                "/static/3.png"
            ];
            const [currentIndex, setCurrentIndex] = useState(0);

            useEffect(() => {
                const timer = setInterval(() => {
                    setCurrentIndex((prev) => (prev + 1) % images.length);
                }, 3000);
                return () => clearInterval(timer);
            }, []);

            return (
                <div className="rounded-3xl shadow-lg overflow-hidden">
                    <a href="/loans" className="block w-full h-full relative cursor-pointer group">
                        <div className="relative w-full aspect-[2.16/1] rounded-3xl overflow-hidden">
                            <div
                                className="flex transition-transform duration-700 ease-in-out h-full"
                                style={{ transform: `translateX(-${currentIndex * 100}%)` }}
                            >
                                {images.map((img, index) => (
                                    <div
                                        key={index}
                                        className="w-full flex-shrink-0"
                                    >
                                        <img
                                            src={img}
                                            alt={`Slide ${index + 1}`}
                                            className="w-full h-full object-cover"
                                        />
                                    </div>
                                ))}
                            </div>
                            {/* Navigation dots */}
                            <div className="absolute bottom-4 left-1/2 transform -translate-x-1/2 flex gap-2 z-10">
                                {images.map((_, idx) => (
                                    <button
                                        key={idx}
                                        onClick={(e) => {
                                            e.preventDefault();
                                            setCurrentIndex(idx);
                                        }}
                                        className={`w-2 h-2 rounded-full transition-all shadow-sm border border-white/50 ${idx === currentIndex ? "bg-blue-600 w-6" : "bg-gray-300"
                                            }`}
                                    />
                                ))}
                            </div>
                        </div>
                    </a>
                </div>
            );
        };

        const Hero = ({ onTalkToExpert }) => (
            <div className="bg-white py-12 md:py-20 relative overflow-hidden">
                {/* Background decorative elements */}
                <div className="absolute top-0 right-0 w-1/3 h-full bg-gradient-to-l from-blue-50 to-transparent opacity-50 z-0 pointer-events-none"></div>

                <div className="mx-2 md:mx-8 lg:mx-16 flex flex-col md:flex-row items-center justify-between gap-10 relative z-10">
                    <div className="md:w-1/2 space-y-8">
                        <div>
                            <h1 className="text-4xl md:text-6xl font-bold text-[#052F5F] leading-tight mt-2">
                                Smart Loans Begin with <span className="text-blue-600">Smart Guidance</span>
                            </h1>
                        </div>
                        <p className="text-gray-600 text-lg md:max-w-xl leading-relaxed">Discover and apply for the best loan and credit options—simple, fast, and reliable</p>
                        <div className="flex flex-col sm:flex-row gap-4">
                            <a href="#services" className="bg-blue-600 text-center text-white font-bold py-3 px-8 rounded-lg hover:bg-blue-700 transition shadow-lg transition transform hover:-translate-y-0.5 inline-block">
                                View Services
                            </a>
                            <button onClick={onTalkToExpert} className="bg-white text-blue-600 border-2 border-blue-600 font-bold py-3 px-8 rounded-lg hover:bg-blue-50 transition">
                                Talk to Expert
                            </button>
                        </div>
                        <ul className="grid grid-cols-1 sm:grid-cols-2 gap-4 text-gray-600 text-sm mt-4">
                            <li className="flex items-center gap-2">
                                <svg className="w-5 h-5 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 13l4 4L19 7"></path></svg>
                                Unbiased Education
                            </li>
                            <li className="flex items-center gap-2">
                                <svg className="w-5 h-5 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 13l4 4L19 7"></path></svg>
                                100% Digital Process
                            </li>
                            <li className="flex items-center gap-2">
                                <svg className="w-5 h-5 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 13l4 4L19 7"></path></svg>
                                Tailored for You
                            </li>
                            <li className="flex items-center gap-2">
                                <svg className="w-5 h-5 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 13l4 4L19 7"></path></svg>
                                Data Security
                            </li>
                        </ul>
                    </div>

                    <div className="md:w-[550px] w-full mt-10 md:mt-0">
                        <ImageSlider />
                    </div>
                </div>
            </div>
        );

        const AboutPromise = () => (
            <div className="py-16 bg-blue-50">
                <div className="mx-2 md:mx-8 lg:mx-16 text-center">
                    <h2 className="text-3xl lg:text-4xl font-bold text-[#052F5F] mb-6">Simple Lending. Smart Solutions.</h2>
                    <p className="text-gray-600 text-lg max-w-3xl mx-auto leading-relaxed">
                        We believe that accessing funds shouldn't be a struggle. We cut through the red tape to offer loan solutions that are straightforward and quick. Our mission is to empower your financial decisions with competitive interest rates and flexible repayment tenures.
                    </p>
                </div>
            </div>
        );

        const ServicesGrid = () => {
            const products = [
                {
                    title: "Personal Loan",
                    headline: "Funds for Whatever Life Throws at You.",
                    copy: "Unplanned expenses? Dream vacation? Medical emergency? Our Personal Loans are unsecured, meaning no collateral is needed. Get instant approval with minimal documentation and use the funds for absolutely any purpose.",
                    features: ["Quick Disbursal", "No Collateral", "Flexible Tenure (12–60 months)"],
                    image: "/static/personal_loan.png",
                    link: "/loans/personal-loan"
                },
                {
                    title: "Home Loan",
                    headline: "Open the Door to Your Dream Home.",
                    copy: "Stop renting and start owning. Whether you are buying a ready-to-move apartment, constructing a house, or renovating your current space, our Home Loans offer attractive interest rates and longer repayment periods to make your EMI affordable.",
                    features: ["High Loan-to-Value Ratio", "Tax Benefits", "Doorstep Service"],
                    image: "/static/home_loan.png",
                    link: "/loans/home-loan"
                },
                {
                    title: "Business Loan",
                    headline: "Capital to Scale Your Ambitions.",
                    copy: "Every business needs fuel to grow. Whether you need working capital, funds for new machinery, or cash for expansion, our Business Loans are designed to keep your operations running smoothly without disrupting your cash flow.",
                    features: ["Customized Limits", "Minimal Paperwork", "Tailored for SMEs and Enterprises"],
                    image: "/static/business_loan.png",
                    link: "/loans/business-loan"
                },
                {
                    title: "Transfer Loan (Balance Transfer)",
                    headline: "Switch to Lower Rates. Save More.",
                    copy: "Burdened by high-interest rates on your existing loans? Move your outstanding loan balance to us. Our Balance Transfer facility helps you reduce your monthly EMIs and interest outflow, giving you better control over your finances.",
                    features: ["Lower Interest Rates", "Top-up Loan Facility Available", "Simple Process"],
                    image: "/static/transfer_loan.png",
                    link: "/loans"
                },
                {
                    title: "Overdraft Facility",
                    headline: "Pay Interest Only on What You Use.",
                    copy: "Need liquidity without the pressure of a fixed EMI? Our Overdraft facility gives you a credit limit against your assets or salary. Withdraw what you need, when you need it, and pay interest only on the utilized amount, not the total limit.",
                    features: ["Instant Liquidity", "Interest Saving", "Revolving Credit"],
                    image: "/static/overdraft.png",
                    link: "/loans/overdraft"
                },
                {
                    title: "Credit Card",
                    headline: "Swipe Smart. Earn More.",
                    copy: "Experience the power of premium credit cards with exclusive rewards, cashback, and lifestyle benefits. Choose from a wide range of cards tailored to your spending habits.",
                    features: ["Lifetime Free Options", "Cashback & Rewards", "Airport Lounge Access"],
                    image: "/static/credit_card.png",
                    link: "/creditcards"
                }
            ];

            return (
                <div id="services" className="py-16 bg-white relative">
                    <div className="mx-2 md:mx-8 lg:mx-16 relative z-10">
                        <div className="text-center mb-12">
                            <h2 className="text-3xl font-bold text-gray-800 mb-3">Our Partner DSA's Services</h2>
                            <p className="text-gray-500">Tailored financial solutions for every need.</p>
                            <div className="h-1 w-16 bg-blue-600 mx-auto rounded mt-4"></div>
                        </div>
                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
                            {products.map((product, idx) => (
                                <div key={idx} className="bg-white border border-gray-100 rounded-2xl overflow-hidden shadow-sm hover:shadow-2xl transition duration-300 group flex flex-col h-full">
                                    <div className="h-56 overflow-hidden relative">
                                        <img
                                            src={product.image}
                                            alt={product.title}
                                            className="w-full h-full object-cover transition duration-500 group-hover:scale-110"
                                        />
                                        <div className="absolute inset-0 bg-gradient-to-t from-black/50 to-transparent opacity-60"></div>
                                        <h3 className="absolute bottom-4 left-4 text-white text-2xl font-bold shadow-sm">{product.title}</h3>
                                    </div>
                                    <div className="p-6 flex flex-col flex-grow">
                                        <h4 className="font-bold text-[#052F5F] text-lg mb-3 leading-tight">{product.headline}</h4>
                                        <p className="text-gray-600 text-sm mb-4 leading-relaxed flex-grow">{product.copy}</p>
                                        <div className="mb-6">
                                            <p className="text-xs font-bold text-gray-400 uppercase tracking-wider mb-2">Key Features</p>
                                            <div className="flex flex-wrap gap-2">
                                                {product.features.map((feature, i) => (
                                                    <span key={i} className="text-xs bg-blue-50 text-blue-700 px-2 py-1 rounded-md font-medium border border-blue-100">
                                                        {feature}
                                                    </span>
                                                ))}
                                            </div>
                                        </div>
                                        <a href={product.link} className="w-full bg-white text-blue-600 border border-blue-600 font-bold py-3 rounded-lg hover:bg-blue-600 hover:text-white transition duration-300 flex items-center justify-center gap-2 group-hover:bg-blue-600 group-hover:text-white">
                                            Apply Now
                                            <svg className="w-4 h-4 transform group-hover:translate-x-1 transition" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M17 8l4 4m0 0l-4 4m4-4H3"></path></svg>
                                        </a>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );
        };



        const Partners = () => {
            const bankLogos = [
                "Bajaj Finserv.png",
                "Bandhan bank.png",
                "Finnable.png",
                "abfl.png",
                "axis.png",
                "hdfc png.png",
                "icici.png",
                "idfc.png",
                "incred finance.png",
                "kotak.png",
                "l&t Finance.png",
                "piramal.png",
                "poonawaallah.png",
                "smfg.png",
                "tata.png",
                "yes bank.png"
            ];

            return (
                <div id="partners" className="py-16 bg-white border-t border-gray-100">
                    <div className="mx-2 md:mx-8 lg:mx-16">
                        <div className="text-center mb-10">
                            <h2 className="text-2xl font-bold text-gray-800">Lenders Available Through Partner DSAs</h2>
                            <p className="text-gray-500 mt-2">Loan products are facilitated via third-party DSAs</p>
                        </div>
                        <div className="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-6">
                            {bankLogos.map((logo, i) => (
                                <div key={i} className="bg-white p-6 rounded-xl border border-gray-100 flex items-center justify-center hover:shadow-lg transition transform hover:-translate-y-1 group h-24 hover:border-blue-100 cursor-pointer relative overflow-hidden">
                                    <div className="absolute inset-0 bg-blue-50 opacity-0 group-hover:opacity-100 transition duration-300"></div>
                                    <img
                                        src={`/static/images/${logo}`}
                                        alt="Bank Logo"
                                        className="h-12 w-auto object-contain mix-blend-multiply filter contrast-125"
                                    />
                                </div>
                            ))}
                        </div>
                        <p className="text-xs text-gray-400 mt-8 text-center max-w-4xl mx-auto leading-relaxed">
                            *We do not have a direct partnership with the banks or NBFCs displayed above. Loan offers are facilitated through third-party DSAs and lending partners. All trademarks, logos, and brand names are the property of their respective owners and are used for informational purposes only.
                        </p>
                    </div>
                </div>
            );
        };

        const Testimonials = () => {
            const reviews = [
                {
                    name: "Mukesh Singh Naruka",
                    location: "Alwar",
                    rating: 5,
                    text: "I had a great experience with you as well CreditsBazaar.com for the disbursement of my personal loan. The entire process was smooth, quick, and handled with minimal queries, exactly as per my requirement. The team was supportive and professional throughout the process. I would definitely recommend Mr. Amit & CreditsBazaar.com for processing personal loan applications."
                },
                {
                    name: "Kuppala Kirankumar",
                    location: "Bangalore",
                    rating: 5,
                    text: "I recently took a loan from your company and had a very smooth experience throughout the process. The application and approval were quick, transparent, and hassle-free. Your staff was supportive and clearly explained all terms and conditions. The disbursement was timely, and the service exceeded my expectations."
                },
                {
                    name: "Sumit Panchal",
                    location: "Delhi",
                    rating: 5,
                    text: "My experience with CreditsBazaar.com for a personal loan was excellent. The entire process was fast, clear, and hassle-free. The team was helpful and highly professional. I would strongly recommend CreditsBazaar.com."
                }
            ];
            return (
                <div className="py-16 bg-white">
                    <div className="mx-2 md:mx-8 lg:mx-16">
                        <div className="text-center mb-12">
                            <h2 className="text-3xl font-bold text-gray-800 mb-2">What Our Customers Say</h2>
                            <div className="h-1 w-16 bg-blue-600 mx-auto rounded"></div>
                        </div>
                        <div className="grid grid-cols-1 md:grid-cols-3 gap-8">
                            {reviews.map((review, i) => (
                                <div key={i} className="bg-gray-50 p-8 rounded-xl relative hover:shadow-lg transition duration-300 flex flex-col h-full">
                                    <div className="text-yellow-400 text-2xl mb-4">{"★".repeat(review.rating)}</div>
                                    <p className="text-gray-600 italic mb-6 flex-grow leading-relaxed">"{review.text}"</p>
                                    <div className="mt-auto">
                                        <div className="font-bold text-[#052F5F] text-lg">{review.name}</div>
                                        {review.location && (
                                            <div className="text-sm text-gray-500">{review.location}</div>
                                        )}
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );
        };

        const FloatingContactWidget = ({ isOpen, setIsOpen }) => {

            const handleClose = () => {
                setIsOpen(false);
            };

            return (
                <div
                    className="fixed right-0 top-1/2 -translate-y-1/2 z-50 transition-all duration-500 ease-in-out"
                    style={{
                        transform: `translateY(-50%) translateX(${isOpen ? '0' : '100%'})`
                    }}
                >
                    <div className="bg-gradient-to-br from-blue-600 to-blue-700 text-white rounded-l-2xl shadow-2xl overflow-hidden" style={{ width: '320px' }}>
                        {/* Header */}
                        <div className="bg-blue-800 px-6 py-4 flex items-center justify-between">
                            <div className="flex items-center gap-3">
                                <div className="w-10 h-10 bg-white rounded-full flex items-center justify-center">
                                    <svg className="w-6 h-6 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">

        function App() {
            const [isContactOpen, setIsContactOpen] = useState(false);
            const [isLoginModalOpen, setIsLoginModalOpen] = useState(false);

            // Check for existing admin session on load
            useEffect(() => {
                const checkGlobalAuth = async () => {
                    try {
                        const response = await fetch('/admin/check_auth');
                        if (response.ok) {
                            // If response is HTML (redirected to home), json() will fail, which is good
                            const data = await response.json();
                            if (data.authenticated) {
                                window.location.href = '/admin/dashboard';
                            }
                        }
                    } catch (error) {
                        // User is not logged in or token is invalid
                    }
                };
                checkGlobalAuth();
            }, []);

            // Handle hash anchor scrolling after component mounts
            useEffect(() => {
                if (window.location.hash) {
                    const id = window.location.hash.substring(1);
                    setTimeout(() => {
                        const element = document.getElementById(id);
                        if (element) {
                            element.scrollIntoView({ behavior: 'smooth' });
                        }
                    }, 100);
                }
            }, []);

            const handleTalkToExpert = () => {
                setIsContactOpen(true);
            };

            const handleSignInClick = async () => {
                try {
                    // Check if already authenticated via JWT cookie
                    const response = await fetch('/admin/check_auth');
                    if (response.ok) {
                        const data = await response.json();
                        if (data.authenticated) {
                            window.location.href = '/admin/dashboard';
                            return;
                        }
                    }
                } catch (error) {
                    console.error("Auth check failed", error);
                }
                // If not authenticated or error, show login modal
                setIsLoginModalOpen(true);
            };

            return (
                <div className="font-sans text-gray-800 bg-gray-50 min-h-screen pb-0">
                    <Navbar onSignInClick={handleSignInClick} />
                    <Hero onTalkToExpert={handleTalkToExpert} />
                    <AboutPromise />
                    <ServicesGrid />

                    <Partners />
                    <Testimonials />
                    <Footer onContactClick={handleTalkToExpert} />
                    <FloatingContactWidget
                        isOpen={isContactOpen}
                        setIsOpen={setIsContactOpen}
                    />
                    <LoginModal
                        isOpen={isLoginModalOpen}
                        onClose={() => setIsLoginModalOpen(false)}
                    />
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
