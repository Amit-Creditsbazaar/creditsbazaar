<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CreditBazaar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Open Sans', sans-serif;
        }
    </style>
</head>

<body>
    <div id="root"></div>

    {% raw %}
    <script type="text/babel">
        const { useState, useEffect } = React;

        const Logo = () => (
            <div className="flex items-center">
                <img src="/static/logo.png" alt="CreditBazaar" className="h-16" />
            </div>
        );



        const Navbar = () => {
            const menuItems = [
                { name: "Home", link: "/" },
                { name: "Loans", link: "/loans" },
                { name: "Credit Cards", link: "/creditcards" },
                { name: "Calculators", link: "/calculators" }
            ];
            return (
                <nav className="bg-white shadow-md sticky top-0 z-50">
                    <div className="mx-2 md:mx-8 lg:mx-16 py-3 flex items-center justify-between">
                        <Logo />
                        <div className="flex items-center gap-4">
                            <div className="hidden lg:flex items-center gap-6">
                                {menuItems.map((item) => (
                                    <a key={item.name} href={item.link} className={`font-semibold text-sm cursor-pointer flex items-center gap-1 transition-colors ${item.name === "Home" ? "text-blue-600" : "text-gray-700 hover:text-blue-600"}`}>
                                        {item.name}
                                    </a>
                                ))}
                            </div>
                            <button className="text-blue-600 font-bold text-sm border border-blue-600 px-5 py-2 rounded hover:bg-blue-50 transition">
                                Sign In
                            </button>
                        </div>
                    </div>
                </nav>
            );
        };

        const ImageSlider = () => {
            const images = [
                "/static/1.png",
                "/static/2.png",
                "/static/3.png"
            ];
            const [currentIndex, setCurrentIndex] = useState(0);

            useEffect(() => {
                const timer = setInterval(() => {
                    setCurrentIndex((prev) => (prev + 1) % images.length);
                }, 3000);
                return () => clearInterval(timer);
            }, []);

            return (
                <div className="rounded-3xl shadow-lg">
                    <a href="/loans" className="block w-full h-full relative cursor-pointer group">
                        <div className="relative w-full aspect-[2.16/1] rounded-3xl overflow-hidden">
                            {images.map((img, index) => (
                                <div
                                    key={index}
                                    className={`absolute inset-0 transition-opacity duration-1000 ease-in-out ${index === currentIndex ? "opacity-100" : "opacity-0"
                                        }`}
                                >
                                    <img
                                        src={img}
                                        alt={`Slide ${index + 1}`}
                                        className="w-full h-full object-cover"
                                    />
                                </div>
                            ))}
                            {/* Navigation dots */}
                            <div className="absolute bottom-4 left-1/2 transform -translate-x-1/2 flex gap-2 z-10">
                                {images.map((_, idx) => (
                                    <button
                                        key={idx}
                                        onClick={(e) => {
                                            e.preventDefault();
                                            setCurrentIndex(idx);
                                        }}
                                        className={`w-2 h-2 rounded-full transition-all shadow-sm border border-white/50 ${idx === currentIndex ? "bg-blue-600 w-6" : "bg-gray-300"
                                            }`}
                                    />
                                ))}
                            </div>
                        </div>
                    </a>
                </div>
            );
        };

        const Hero = ({ onTalkToExpert }) => (
            <div className="bg-white py-12 md:py-20 relative overflow-hidden">
                {/* Background decorative elements */}
                <div className="absolute top-0 right-0 w-1/3 h-full bg-gradient-to-l from-blue-50 to-transparent opacity-50 z-0 pointer-events-none"></div>

                <div className="mx-2 md:mx-8 lg:mx-16 flex flex-col md:flex-row items-center justify-between gap-10 relative z-10">
                    <div className="md:w-1/2 space-y-8">
                        <div>
                            <h1 className="text-4xl md:text-6xl font-bold text-[#052F5F] leading-tight mt-2">
                                Financial Wellness starts with the <span className="text-blue-600">Right Advice</span>.
                            </h1>
                        </div>
                        <p className="text-gray-600 text-lg md:max-w-xl leading-relaxed">We aren't just a platform; we’re your partner in making healthier financial choices. Compare, choose, and apply for the best financial products.</p>
                        <div className="flex flex-col sm:flex-row gap-4">
                            <a href="#services" className="bg-blue-600 text-center text-white font-bold py-3 px-8 rounded-lg hover:bg-blue-700 transition shadow-lg transition transform hover:-translate-y-0.5 inline-block">
                                View Services
                            </a>
                            <button onClick={onTalkToExpert} className="bg-white text-blue-600 border-2 border-blue-600 font-bold py-3 px-8 rounded-lg hover:bg-blue-50 transition">
                                Talk to Expert
                            </button>
                        </div>
                        <ul className="grid grid-cols-1 sm:grid-cols-2 gap-4 text-gray-600 text-sm mt-4">
                            <li className="flex items-center gap-2">
                                <svg className="w-5 h-5 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 13l4 4L19 7"></path></svg>
                                Unbiased Education
                            </li>
                            <li className="flex items-center gap-2">
                                <svg className="w-5 h-5 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 13l4 4L19 7"></path></svg>
                                100% Digital Process
                            </li>
                            <li className="flex items-center gap-2">
                                <svg className="w-5 h-5 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 13l4 4L19 7"></path></svg>
                                Tailored for You
                            </li>
                            <li className="flex items-center gap-2">
                                <svg className="w-5 h-5 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 13l4 4L19 7"></path></svg>
                                Data Security
                            </li>
                        </ul>
                    </div>

                    <div className="md:w-[450px] w-full mt-10 md:mt-0">
                        <ImageSlider />
                    </div>
                </div>
            </div>
        );

        const AboutPromise = () => (
            <div className="py-16 bg-blue-50">
                <div className="mx-2 md:mx-8 lg:mx-16 text-center">
                    <h2 className="text-3xl lg:text-4xl font-bold text-[#052F5F] mb-6">Simple Lending. Smart Solutions.</h2>
                    <p className="text-gray-600 text-lg max-w-3xl mx-auto leading-relaxed">
                        We believe that accessing funds shouldn't be a struggle. We cut through the red tape to offer loan solutions that are straightforward and quick. Our mission is to empower your financial decisions with competitive interest rates and flexible repayment tenures.
                    </p>
                </div>
            </div>
        );

        const ServicesGrid = () => {
            const products = [
                {
                    title: "Personal Loan",
                    headline: "Funds for Whatever Life Throws at You.",
                    copy: "Unplanned expenses? Dream vacation? Medical emergency? Our Personal Loans are unsecured, meaning no collateral is needed. Get instant approval with minimal documentation and use the funds for absolutely any purpose.",
                    features: ["Quick Disbursal", "No Collateral", "Flexible Tenure (12–60 months)"],
                    image: "/static/personal_loan.png",
                    link: "/loans"
                },
                {
                    title: "Home Loan",
                    headline: "Open the Door to Your Dream Home.",
                    copy: "Stop renting and start owning. Whether you are buying a ready-to-move apartment, constructing a house, or renovating your current space, our Home Loans offer attractive interest rates and longer repayment periods to make your EMI affordable.",
                    features: ["High Loan-to-Value Ratio", "Tax Benefits", "Doorstep Service"],
                    image: "/static/home_loan.png",
                    link: "/loans"
                },
                {
                    title: "Business Loan",
                    headline: "Capital to Scale Your Ambitions.",
                    copy: "Every business needs fuel to grow. Whether you need working capital, funds for new machinery, or cash for expansion, our Business Loans are designed to keep your operations running smoothly without disrupting your cash flow.",
                    features: ["Customized Limits", "Minimal Paperwork", "Tailored for SMEs and Enterprises"],
                    image: "/static/business_loan.png",
                    link: "/loans"
                },
                {
                    title: "Transfer Loan (Balance Transfer)",
                    headline: "Switch to Lower Rates. Save More.",
                    copy: "Burdened by high-interest rates on your existing loans? Move your outstanding loan balance to us. Our Balance Transfer facility helps you reduce your monthly EMIs and interest outflow, giving you better control over your finances.",
                    features: ["Lower Interest Rates", "Top-up Loan Facility Available", "Simple Process"],
                    image: "/static/transfer_loan.png",
                    link: "/loans"
                },
                {
                    title: "Overdraft Facility",
                    headline: "Pay Interest Only on What You Use.",
                    copy: "Need liquidity without the pressure of a fixed EMI? Our Overdraft facility gives you a credit limit against your assets or salary. Withdraw what you need, when you need it, and pay interest only on the utilized amount, not the total limit.",
                    features: ["Instant Liquidity", "Interest Saving", "Revolving Credit"],
                    image: "/static/overdraft.png",
                    link: "/loans"
                },
                {
                    title: "Credit Card",
                    headline: "Swipe Smart. Earn More.",
                    copy: "Experience the power of premium credit cards with exclusive rewards, cashback, and lifestyle benefits. Choose from a wide range of cards tailored to your spending habits.",
                    features: ["Lifetime Free Options", "Cashback & Rewards", "Airport Lounge Access"],
                    image: "/static/credit_card.png",
                    link: "/creditcards"
                }
            ];

            return (
                <div id="services" className="py-16 bg-white relative">
                    <div className="mx-2 md:mx-8 lg:mx-16 relative z-10">
                        <div className="text-center mb-12">
                            <h2 className="text-3xl font-bold text-gray-800 mb-3">Our Services</h2>
                            <p className="text-gray-500">Tailored financial solutions for every need.</p>
                            <div className="h-1 w-16 bg-blue-600 mx-auto rounded mt-4"></div>
                        </div>
                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
                            {products.map((product, idx) => (
                                <div key={idx} className="bg-white border border-gray-100 rounded-2xl overflow-hidden shadow-sm hover:shadow-2xl transition duration-300 group flex flex-col h-full">
                                    <div className="h-56 overflow-hidden relative">
                                        <img
                                            src={product.image}
                                            alt={product.title}
                                            className="w-full h-full object-cover transition duration-500 group-hover:scale-110"
                                        />
                                        <div className="absolute inset-0 bg-gradient-to-t from-black/50 to-transparent opacity-60"></div>
                                        <h3 className="absolute bottom-4 left-4 text-white text-2xl font-bold shadow-sm">{product.title}</h3>
                                    </div>
                                    <div className="p-6 flex flex-col flex-grow">
                                        <h4 className="font-bold text-[#052F5F] text-lg mb-3 leading-tight">{product.headline}</h4>
                                        <p className="text-gray-600 text-sm mb-4 leading-relaxed flex-grow">{product.copy}</p>
                                        <div className="mb-6">
                                            <p className="text-xs font-bold text-gray-400 uppercase tracking-wider mb-2">Key Features</p>
                                            <div className="flex flex-wrap gap-2">
                                                {product.features.map((feature, i) => (
                                                    <span key={i} className="text-xs bg-blue-50 text-blue-700 px-2 py-1 rounded-md font-medium border border-blue-100">
                                                        {feature}
                                                    </span>
                                                ))}
                                            </div>
                                        </div>
                                        <a href={product.link} className="w-full bg-white text-blue-600 border border-blue-600 font-bold py-3 rounded-lg hover:bg-blue-600 hover:text-white transition duration-300 flex items-center justify-center gap-2 group-hover:bg-blue-600 group-hover:text-white">
                                            Apply Now
                                            <svg className="w-4 h-4 transform group-hover:translate-x-1 transition" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M17 8l4 4m0 0l-4 4m4-4H3"></path></svg>
                                        </a>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );
        };

        const CreditScoreBanner = () => (
            <div className="bg-[#052F5F] py-12 md:py-16 text-white overflow-hidden relative">
                {/* Decorative circles */}
                <div className="absolute top-0 left-0 w-64 h-64 bg-blue-500 rounded-full mix-blend-multiply filter blur-3xl opacity-20 -translate-x-1/2 -translate-y-1/2"></div>
                <div className="absolute bottom-0 right-0 w-64 h-64 bg-purple-500 rounded-full mix-blend-multiply filter blur-3xl opacity-20 translate-x-1/2 translate-y-1/2"></div>

                <div className="mx-2 md:mx-8 lg:mx-16 relative z-10 flex flex-col md:flex-row items-center justify-between gap-8 text-center md:text-left">
                    <div>
                        <h2 className="text-3xl md:text-4xl font-bold mb-4">Your Credit Score & Report</h2>
                        <p className="text-blue-200 text-lg mb-6 max-w-xl">
                            Get your free credit report with monthly updates. Check your credit score now to get the best loan and card offers.
                        </p>
                        <ul className="flex flex-wrap justify-center md:justify-start gap-4 md:gap-8 text-sm text-blue-100 font-semibold">
                            <li className="flex items-center gap-2"><div className="w-2 h-2 bg-green-400 rounded-full"></div> Lifetime Free</li>
                            <li className="flex items-center gap-2"><div className="w-2 h-2 bg-green-400 rounded-full"></div> Detailed Analysis</li>
                            <li className="flex items-center gap-2"><div className="w-2 h-2 bg-green-400 rounded-full"></div> Custom Tips</li>
                        </ul>
                    </div>
                    <div className="flex-shrink-0">
                        <button className="bg-[#FF6F3C] text-white font-bold py-3 px-10 rounded-full hover:bg-[#ff8a5e] transition shadow-lg transform hover:scale-105">
                            Get Free Score
                        </button>
                    </div>
                </div>
            </div>
        );

        const Partners = () => {
            const bankLogos = [
                "Bajaj Finserv.png",
                "Bandhan bank.png",
                "Finnable.png",
                "abfl.png",
                "axis.png",
                "hdfc png.png",
                "icici.png",
                "idfc.png",
                "incred finance.png",
                "kotak.png",
                "l&t Finance.png",
                "piramal.png",
                "poonawaallah.png",
                "smfg.png",
                "tata.png",
                "yes bank.png"
            ];

            return (
                <div className="py-16 bg-white border-t border-gray-100">
                    <div className="mx-2 md:mx-8 lg:mx-16">
                        <div className="text-center mb-10">
                            <h2 className="text-2xl font-bold text-gray-800">Our Partners</h2>
                            <p className="text-gray-500 mt-2">Leading Banks & NBFCs trust us</p>
                        </div>
                        <div className="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-6">
                            {bankLogos.map((logo, i) => (
                                <div key={i} className="bg-white p-6 rounded-xl border border-gray-100 flex items-center justify-center hover:shadow-lg transition transform hover:-translate-y-1 group h-24 hover:border-blue-100 cursor-pointer relative overflow-hidden">
                                    <div className="absolute inset-0 bg-blue-50 opacity-0 group-hover:opacity-100 transition duration-300"></div>
                                    <img
                                        src={`/static/images/${logo}`}
                                        alt="Bank Logo"
                                        className="h-12 w-auto object-contain mix-blend-multiply filter contrast-125"
                                    />
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );
        };

        const Testimonials = () => {
            const reviews = [
                { name: "Rahul S.", rating: 5, text: "Excellent service! I got my loan approved within 24 hours. Minimal paperwork and great support." },
                { name: "Priya M.", rating: 4, text: "Very helpful platform to compare credit cards. Found the best lifetime free card for my needs here." },
                { name: "Amit K.", rating: 5, text: "Checking credit score is so easy and detailed. The monthly updates help me track my financial health." }
            ];
            return (
                <div className="py-16 bg-white">
                    <div className="mx-2 md:mx-8 lg:mx-16">
                        <div className="text-center mb-12">
                            <h2 className="text-3xl font-bold text-gray-800 mb-2">What Our Customers Say</h2>
                            <div className="h-1 w-16 bg-blue-600 mx-auto rounded"></div>
                        </div>
                        <div className="grid grid-cols-1 md:grid-cols-3 gap-8">
                            {reviews.map((review, i) => (
                                <div key={i} className="bg-gray-50 p-8 rounded-xl relative">
                                    <div className="text-yellow-400 text-2xl mb-4">{"★".repeat(review.rating)}</div>
                                    <p className="text-gray-600 italic mb-6">"{review.text}"</p>
                                    <div className="font-bold text-gray-800">- {review.name}</div>
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );
        };

        const FloatingContactWidget = ({ isOpen, setIsOpen, hasBeenClosed, setHasBeenClosed }) => {

            const handleClose = () => {
                setIsOpen(false);
                setHasBeenClosed(true);
            };

            return (
                <div
                    className="fixed right-0 top-1/2 -translate-y-1/2 z-50 transition-all duration-500 ease-in-out"
                    style={{
                        transform: `translateY(-50%) translateX(${isOpen || !hasBeenClosed ? '0' : 'calc(100% - 40px)'})`
                    }}
                    onMouseEnter={() => hasBeenClosed && setIsOpen(true)}
                    onMouseLeave={() => hasBeenClosed && setIsOpen(false)}
                >
                    <div className="bg-gradient-to-br from-blue-600 to-blue-700 text-white rounded-l-2xl shadow-2xl overflow-hidden" style={{ width: '320px' }}>
                        {/* Header */}
                        <div className="bg-blue-800 px-6 py-4 flex items-center justify-between">
                            <div className="flex items-center gap-3">
                                <div className="w-10 h-10 bg-white rounded-full flex items-center justify-center">
                                    <svg className="w-6 h-6 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"></path>
                                    </svg>
                                </div>
                                <div>
                                    <h3 className="font-bold text-sm">Need Help?</h3>
                                    <p className="text-xs text-blue-100">Talk to Expert</p>
                                </div>
                            </div>
                            {hasBeenClosed && (
                                <button
                                    onClick={handleClose}
                                    className="text-white hover:text-blue-200 transition"
                                >
                                    <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12"></path>
                                    </svg>
                                </button>
                            )}
                        </div>

                        {/* Content */}
                        <div className="px-6 py-6">
                            <p className="text-sm mb-4 text-blue-50">
                                Get instant assistance from our customer executives. We're here to help!
                            </p>

                            <div className="bg-white rounded-xl p-4 mb-4">
                                <div className="flex items-center gap-3 mb-3">
                                    <div className="w-12 h-12 bg-blue-100 rounded-full flex items-center justify-center">
                                        <svg className="w-6 h-6 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                                        </svg>
                                    </div>
                                    <div>
                                        <p className="text-xs text-gray-500 font-semibold">Customer Executive</p>
                                        <p className="text-sm text-gray-800 font-bold">Available 24/7</p>
                                    </div>
                                </div>

                                <a
                                    href="tel:9625835453"
                                    className="flex items-center justify-center gap-2 bg-gradient-to-r from-blue-600 to-blue-700 text-white font-bold py-3 px-4 rounded-lg hover:from-blue-700 hover:to-blue-800 transition shadow-lg transform hover:scale-105 no-underline"
                                >
                                    <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"></path>
                                    </svg>
                                    9625835453
                                </a>
                            </div>

                            <p className="text-xs text-blue-100 text-center">
                                Call us for instant loan & credit card assistance
                            </p>
                        </div>

                        {/* Side Tab (visible when minimized) */}
                        {!isOpen && hasBeenClosed && (
                            <div className="absolute left-0 top-1/2 -translate-y-1/2 -translate-x-full bg-blue-600 text-white px-3 py-6 rounded-l-lg shadow-lg cursor-pointer">
                                <div className="flex flex-col items-center gap-2">
                                    <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"></path>
                                    </svg>
                                    <span className="text-xs font-bold writing-mode-vertical transform rotate-180" style={{ writingMode: 'vertical-rl' }}>
                                        CONTACT
                                    </span>
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const Footer = ({ onContactClick }) => (
            <footer className="bg-[#1A202C] text-gray-400 py-12 text-sm">
                <div className="mx-2 md:mx-8 lg:mx-16">
                    <div className="grid grid-cols-2 md:grid-cols-4 gap-8 mb-8">
                        <div>
                            <h4 className="text-white font-bold mb-4 uppercase">Company</h4>
                            <ul className="space-y-2">
                                <li className="hover:text-white cursor-pointer"><a href="/about">About Us</a></li>
                                <li className="hover:text-white cursor-pointer">Partners</li>
                                <li className="hover:text-white cursor-pointer">Careers</li>
                                <li className="hover:text-white cursor-pointer" onClick={onContactClick}>Contact Us</li>
                            </ul>
                        </div>
                        <div>
                            <h4 className="text-white font-bold mb-4 uppercase">Services</h4>
                            <ul className="space-y-2">
                                <li className="hover:text-white cursor-pointer">Personal Loan</li>
                                <li className="hover:text-white cursor-pointer">Credit Card</li>
                                <li className="hover:text-white cursor-pointer">Mutual Funds</li>
                                <li className="hover:text-white cursor-pointer">Credit Score</li>
                            </ul>
                        </div>
                        <div>
                            <h4 className="text-white font-bold mb-4 uppercase">Resources</h4>
                            <ul className="space-y-2">
                                <li className="hover:text-white cursor-pointer">Financial Tools</li>
                                <li className="hover:text-white cursor-pointer">Blogs</li>
                                <li className="hover:text-white cursor-pointer">FAQs</li>
                                <li className="hover:text-white cursor-pointer">Glossary</li>
                            </ul>
                        </div>
                        <div>
                            <h4 className="text-white font-bold mb-4 uppercase">Contact</h4>
                            <ul className="space-y-2">
                                <li>support@paisabazaar.com</li>
                                <li>9625835453</li>
                                <li className="mt-4 flex gap-4">
                                    <span className="w-8 h-8 bg-gray-700 rounded-full flex items-center justify-center hover:bg-blue-600 cursor-pointer">f</span>
                                    <span className="w-8 h-8 bg-gray-700 rounded-full flex items-center justify-center hover:bg-blue-400 cursor-pointer">t</span>
                                    <span className="w-8 h-8 bg-gray-700 rounded-full flex items-center justify-center hover:bg-pink-600 cursor-pointer">i</span>

                        <p className="mt-2">Disclaimer: All info provided is for informational purposes only.</p>
                    </div>
                </div>
            </footer>
        );

        function App() {
            const [isContactOpen, setIsContactOpen] = useState(true);
            const [contactHasBeenClosed, setContactHasBeenClosed] = useState(false);

            useEffect(() => {
                let timer;
                if (isContactOpen) {
                    timer = setTimeout(() => {
                        setIsContactOpen(false);
                        setContactHasBeenClosed(true);
                    }, 5000);
                }
                return () => clearTimeout(timer);
            }, [isContactOpen]);

            const handleTalkToExpert = () => {
                setIsContactOpen(true);
            };

            return (
                <div className="font-sans text-gray-800 bg-gray-50 min-h-screen pb-0">
                    <Navbar />
                    <Hero onTalkToExpert={handleTalkToExpert} />
                    <AboutPromise />
                    <ServicesGrid />
                    <CreditScoreBanner />
                    <Partners />
                    <Testimonials />
                    <Footer onContactClick={handleTalkToExpert} />
                    <FloatingContactWidget
                        isOpen={isContactOpen}
                        setIsOpen={setIsContactOpen}
                        hasBeenClosed={contactHasBeenClosed}
                        setHasBeenClosed={setContactHasBeenClosed}
                    />
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
    {% endraw %}
