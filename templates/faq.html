<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="google-site-verification" content="xD85Mz8xn2ZWUWSRvvkrPq_47S2qwhhu5urrxYnTYdI" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frequently Asked Questions - Creditsbazaar Help Center</title>
    <meta name="description"
        content="Find answers to common questions about loans, credit cards, credit scores, and repayment options at Creditsbazaar Help Center.">
    <meta name="keywords"
        content="faq creditsbazaar, loan questions, credit card faq, financial help, creditsbazaar support">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://creditsbazaar.com/faq">

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://creditsbazaar.com/faq">
    <meta property="og:title" content="Frequently Asked Questions - Creditsbazaar Help Center">
    <meta property="og:description"
        content="Find answers to common questions about loans, credit cards, credit scores, and repayment options.">
    <meta property="og:image" content="https://creditsbazaar.com/static/logo.png">

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://creditsbazaar.com/faq">
    <meta property="twitter:title" content="Frequently Asked Questions - Creditsbazaar Help Center">
    <meta property="twitter:description"
        content="Find answers to common questions about loans, credit cards, credit scores, and repayment options.">
    <meta property="twitter:image" content="https://creditsbazaar.com/static/logo.png">

    <!-- Schema.org Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "What types of loans can I apply for?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "You can apply for Personal Loans, Home Loans, Business Loans, and Loan Against Property depending on your eligibility and requirements."
          }
        },
        {
          "@type": "Question",
          "name": "How long does it take to get a loan approved?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Loan approval times vary by lender and loan type. Personal loans can often be approved instantly or within 24 hours, while home loans may take longer due to property verification."
          }
        },
        {
          "@type": "Question",
          "name": "How do I choose the right credit card?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Consider your spending habits. If you travel often, look for travel cards. If you shop online, look for cashback cards. We help you compare features to find the best match."
          }
        },
        {
          "@type": "Question",
          "name": "What is a CIBIL Score?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "A CIBIL Score is a 3-digit number ranging from 300 to 900 that represents your creditworthiness. It is derived from your credit history found in the CIBIL Report."
          }
        }
      ]
    }
    </script>

    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
    <style>
        body {
            font-family: 'Open Sans', sans-serif;
        }

        .accordion-content {
            transition: max-height 0.3s ease-out, opacity 0.3s ease-out;
            max-height: 0;
            opacity: 0;
            overflow: hidden;
        }

        .accordion-content.open {
            max-height: 500px;
            /* Arbitrary large height */
            opacity: 1;
        }
    </style>
</head>

<body class="bg-gray-50">
    <div id="root"></div>

    {% raw %}
    <script type="text/babel">
        const { useState, useEffect } = React;

        // Placeholder for Logo component, assuming it renders the logo image
        const Logo = () => (
            <a href="/" className="flex items-center gap-2">
                <img src="/static/logo.png" alt="CreditBazaar" className="h-16" />
            </a>
        );

        const Navbar = ({ onSignInClick }) => {
            const [isMenuOpen, setIsMenuOpen] = useState(false);
            const menuItems = [
                { name: "Home", link: "/" },
                { name: "Loans", link: "/loans" },
                { name: "Credit Cards", link: "/creditcards" },
                { name: "Calculators", link: "/calculators" }
            ];
            const loanTypes = [
                { name: "Personal Loan", link: "/loans/personal-loan" },
                { name: "Business Loan", link: "/loans/business-loan" },
                { name: "Loan Against Property", link: "/loans/loan-against-property" },
                { name: "Home Loan", link: "/loans/home-loan" },
                { name: "OverDraft", link: "/loans/overdraft" },
                { name: "Credit Card", link: "/loans/credit-card" },
                { name: "Car Loan", link: "/loans/car-loan" }
            ];

            return (
                <nav className="bg-white shadow-md sticky top-0 z-50">
                    <div className="mx-2 md:mx-8 lg:mx-16 py-3 flex items-center justify-between">
                        <div className="flex items-center gap-4">
                            {/* Hamburger Menu Button */}
                            <button
                                className="lg:hidden text-gray-700 focus:outline-none"
                                onClick={() => setIsMenuOpen(!isMenuOpen)}
                            >
                                <svg
                                    className="w-6 h-6"
                                    fill="none"
                                    stroke="currentColor"
                                    viewBox="0 0 24 24"
                                >
                                    {isMenuOpen ? (
                                        <path
                                            strokeLinecap="round"
                                            strokeLinejoin="round"
                                            strokeWidth="2"
                                            d="M6 18L18 6M6 6l12 12"
                                        />
                                    ) : (
                                        <path
                                            strokeLinecap="round"
                                            strokeLinejoin="round"
                                            strokeWidth="2"
                                            d="M4 6h16M4 12h16M4 18h16"
                                        />
                                    )}
                                </svg>
                            </button>
                            <Logo />
                        </div>
                        <div className="flex items-center gap-4">
                            <div className="hidden lg:flex items-center gap-6">
                                {menuItems.map((item) => (
                                    item.name === "Loans" ? (
                                        <div key={item.name} className="relative group">
                                            <a href="/loans" className={`font-semibold text-sm cursor-pointer flex items-center gap-1 transition-colors py-2 ${item.name === "FAQs" ? "text-blue-600" : "text-gray-700 hover:text-blue-600"}`}>
                                                Loans
                                                <svg className="w-3 h-3 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 9l-7 7-7-7" /></svg>
                                            </a>
                                            <div className="absolute left-0 top-full hidden group-hover:block bg-white shadow-xl rounded-lg border border-gray-100 py-2 w-56 z-50">
                                                {loanTypes.map((lt) => (
                                                    <a key={lt.name} href={lt.link} className="block px-4 py-2 text-sm text-gray-700 hover:bg-blue-50 hover:text-blue-600 transition-colors">
                                                        {lt.name}
                                                    </a>
                                                ))}
                                            </div>
                                        </div>
                                    ) : (
                                    <a key={item.name} href={item.link} className={`font-semibold text-sm cursor-pointer flex items-center gap-1 transition-colors ${item.name === "FAQs" ? "text-blue-600" : "text-gray-700 hover:text-blue-600"}`}>
                                        {item.name}
                                    </a>
                                    )
                                ))}
                            </div>
                        </div>
                    </div>

                    {/* Mobile Menu Dropdown */}
                    {isMenuOpen && (
                        <div className="lg:hidden bg-white border-t border-gray-100 shadow-lg absolute w-full left-0 py-4 flex flex-col gap-4 px-6">
                            {menuItems.map((item) => (
                                item.name === "Loans" ? (
                                    <div key={item.name} className="flex flex-col gap-2">
                                        <span className="block text-gray-700 font-bold">Loans</span>
                                        <div className="flex flex-col gap-2 pl-4 border-l-2 border-gray-100">
                                            {loanTypes.map((lt) => (
                                                <a
                                                    key={lt.name}
                                                    href={lt.link}
                                                    className="block text-gray-600 text-sm hover:text-blue-600 transition"
                                                    onClick={() => setIsMenuOpen(false)}
                                                >
                                                    {lt.name}
                                                </a>
                                            ))}
                                        </div>
                                    </div>
                                ) : (
                                <a
                                    key={item.name}
                                    href={item.link}
                                    className="block text-gray-700 font-semibold hover:text-blue-600 transition"
                                    onClick={() => setIsMenuOpen(false)}
                                >
                                    {item.name}
                                </a>
                                )
                            ))}
                        </div>
                    )}
                </nav>
            );
        };

        const FAQHero = () => (
            <div className="bg-[#052F5F] text-white py-20 text-center relative overflow-hidden">
                <div className="absolute top-0 left-0 w-64 h-64 bg-blue-500 rounded-full mix-blend-multiply filter blur-3xl opacity-20 -translate-x-1/2 -translate-y-1/2"></div>
                <div className="absolute bottom-0 right-0 w-64 h-64 bg-purple-500 rounded-full mix-blend-multiply filter blur-3xl opacity-20 translate-x-1/2 translate-y-1/2"></div>

                <div className="relative z-10 mx-2 md:mx-8 lg:mx-16">
                    <h1 className="text-4xl md:text-6xl font-bold mb-6">Frequently Asked Questions</h1>
                    <p className="text-xl md:text-2xl text-blue-100 max-w-3xl mx-auto leading-relaxed">
                        Got questions? We've got answers. Find everything you need to know about our services.
                    </p>
                </div>
            </div>
        );

        const FAQItem = ({ question, answer, isOpen, toggleOpen }) => {
            return (
                <div className="bg-white rounded-xl border border-gray-100 mb-4 overflow-hidden shadow-sm hover:shadow-md transition">
                    <button
                        onClick={toggleOpen}
                        className="w-full px-6 py-5 flex items-center justify-between text-left focus:outline-none bg-white hover:bg-gray-50 transition"
                    >
                        <span className="font-bold text-lg text-[#052F5F]">{question}</span>
                        <svg
                            className={`w-6 h-6 text-blue-500 transform transition-transform duration-300 ${isOpen ? 'rotate-180' : ''}`}
                            fill="none"
                            stroke="currentColor"
                            viewBox="0 0 24 24"
                        >
                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 9l-7 7-7-7"></path>
                        </svg>
                    </button>
                    <div className={`accordion-content bg-gray-50 px-6 ${isOpen ? 'open py-5 border-t border-gray-100' : ''}`}>
                        <p className="text-gray-600 leading-relaxed">{answer}</p>
                    </div>
                </div>
            );
        };

        const FAQSection = () => {
            const faqs = {
                "Loans": [
                    { q: "What types of loans can I apply for?", a: "You can apply for Personal Loans, Home Loans, Business Loans, and Loan Against Property depending on your eligibility and requirements." },
                    { q: "How long does it take to get a loan approved?", a: "Loan approval times vary by lender and loan type. Personal loans can often be approved instantly or within 24 hours, while home loans may take longer due to property verification." },
                    { q: "What documents are required for a Personal Loan?", a: "Typically, you need identity proof (Aadhaar/PAN), address proof, income proof (salary slips/bank statements), and photographs. Requirements may vary by lender." },
                    { q: "Can I get a loan with a low credit score?", a: "While a high credit score (750+) improves your chances, some lenders do offer loans to individuals with lower scores, though potentially at higher interest rates." },
                    { q: "What is the difference between specific and floating interest rates?", a: "A fixed interest rate remains the same throughout the loan tenure, meaning your EMI stays constant. A floating interest rate fluctuates based on market trends (like the Repo Rate), so your EMI may go up or down." },
                    { q: "Can I prepay or foreclose my loan?", a: "Yes, most lenders allow prepayment or foreclosure after a certain period (usually 6-12 months). Some may charge a small fee, while others offer it for free." }
                ],
                "Credit Cards": [
                    { q: "How do I choose the right credit card?", a: "Consider your spending habits. If you travel often, look for travel cards. If you shop online, look for cashback cards. We help you compare features to find the best match." },
                    { q: "What is the minimum salary required for a credit card?", a: "Eligibility criteria vary by bank and card type. Generally, a minimum monthly income of ₹15,000 - ₹25,000 is required for entry-level cards." },
                    { q: "How can I check my credit card application status?", a: "You can track your application status directly on our website or by contacting our customer support team." },
                    { q: "What is the 'Interest-Free Period'?", a: "It is the grace period (usually 20-50 days) during which you don't have to pay interest on your purchases, provided you pay the full bill amount by the due date." },
                    { q: "Will checking my eligibility affect my credit score?", a: "Checking your eligibility on CreditBazaar is a 'soft inquiry' and does not affect your credit score. However, applying directly with multiple banks might." }
                ],
                "Credit Score": [
                    { q: "What is a CIBIL Score?", a: "A CIBIL Score is a 3-digit number ranging from 300 to 900 that represents your creditworthiness. It is derived from your credit history found in the CIBIL Report." },
                    { q: "What is a good CIBIL Score?", a: "A score of 750 or above is generally considered good and increases your chances of getting loan and credit card approvals at better interest rates." },
                    { q: "How can I improve my credit score?", a: "You can improve your score by paying dues on time, maintaining a low credit utilization ratio, maintaining a healthy mix of secured and unsecured credit, and avoiding multiple loan applications in a short span." }
                ],
                "Repayment": [
                    { q: "What happens if I miss an EMI payment?", a: "Missing an EMI payment can lead to late payment charges and negatively impact your credit score. It's advisable to set up auto-debits to avoid missing dates." },
                    { q: "Can I change my EMI date?", a: "Some lenders allow you to change your EMI date for a small fee or upon request, but this is subject to their internal policies." },
                    { q: " What are the modes of repayment available?", a: "You can repay via NACH/ECS (Auto Debit), Post Dated Cheques (PDC), or online through Net Banking/UPI/Debit Card on the lender's portal." }
                ]
            };

            const [activeCategory, setActiveCategory] = useState("Loans");
            const [openIndex, setOpenIndex] = useState(0); // Default open first item

            return (
                <div className="py-16 bg-gray-50 min-h-screen">
                    <div className="mx-2 md:mx-8 lg:mx-16">
                        <div className="grid md:grid-cols-12 gap-8">
                            {/* Sidebar Categories */}
                            <div className="md:col-span-3">
                                <div className="bg-white rounded-xl shadow-sm border border-gray-100 p-2 sticky top-24">
                                    {Object.keys(faqs).map((category) => (
                                        <button
                                            key={category}
                                            onClick={() => {
                                                setActiveCategory(category);
                                                setOpenIndex(null); // Close all when switching category
                                            }}
                                            className={`w-full text-left px-4 py-3 rounded-lg font-bold transition-all mb-1 ${activeCategory === category ? 'bg-blue-50 text-blue-700 border-l-4 border-blue-600' : 'text-gray-600 hover:bg-gray-50'}`}
                                        >
                                            {category}
                                        </button>
                                    ))}
                                </div>
                            </div>

                            {/* Main Content */}
                            <div className="md:col-span-9">
                                <h2 className="text-2xl font-bold text-gray-800 mb-6 border-b pb-4">{activeCategory} FAQs</h2>
                                <div>
                                    {faqs[activeCategory].map((item, index) => (
                                        <FAQItem
                                            key={index}
                                            question={item.q}
                                            answer={item.a}
                                            isOpen={index === openIndex}
                                            toggleOpen={() => setOpenIndex(index === openIndex ? null : index)}
                                        />
                                    ))}
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const FloatingContactWidget = ({ isOpen, setIsOpen }) => {
            const handleClose = () => {
                setIsOpen(false);
            };

            return (
                <div
                    className="fixed right-0 top-1/2 -translate-y-1/2 z-50 transition-all duration-500 ease-in-out"
                    style={{
                        transform: `translateY(-50%) translateX(${isOpen ? '0' : '100%'})`
                    }}
                >
                    <div className="bg-gradient-to-br from-blue-600 to-blue-700 text-white rounded-l-2xl shadow-2xl overflow-hidden" style={{ width: '320px' }}>
                        <div className="bg-blue-800 px-6 py-4 flex items-center justify-between">
                            <div className="flex items-center gap-3">
                                <div className="w-10 h-10 bg-white rounded-full flex items-center justify-center">
                                    <svg className="w-6 h-6 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"></path>
                                    </svg>
                                </div>
                                <div>
                                    <h3 className="font-bold text-sm">Need Help?</h3>
                                    <p className="text-xs text-blue-100">Talk to Expert</p>
                                </div>
                            </div>
                            <button
                                onClick={handleClose}
                                className="text-white hover:text-blue-200 transition"
                            >
                                <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12"></path>
                                </svg>
                            </button>
                        </div>

                        <div className="px-6 py-6">
                            <p className="text-sm mb-4 text-blue-50">
                                Get instant assistance from our customer executives. We're here to help!
                            </p>

                            <div className="bg-white rounded-xl p-4 mb-4">
                                <div className="flex items-center gap-3 mb-3">
                                    <div className="w-12 h-12 bg-blue-100 rounded-full flex items-center justify-center">
                                        <svg className="w-6 h-6 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                                        </svg>
                                    </div>
                                    <div>
                                        <p className="text-xs text-gray-500 font-semibold">Customer Executive</p>
                                        <p className="text-sm text-gray-800 font-bold">Available 24/7</p>
                                    </div>
                                </div>

                                <a
                                    href="tel:9625835453"
                                    className="flex items-center justify-center gap-2 bg-gradient-to-r from-blue-600 to-blue-700 text-white font-bold py-3 px-4 rounded-lg hover:from-blue-700 hover:to-blue-800 transition shadow-lg transform hover:scale-105 no-underline"
                                >
                                    <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"></path>
                                    </svg>
                                    9625835453
                                </a>
                            </div>

                            <p className="text-xs text-blue-100 text-center">
                                Call us for instant loan & credit card assistance
                            </p>
                        </div>

                        {!isOpen && (
                            <div
                                onClick={() => setIsOpen(true)}
                                className="absolute left-0 top-1/2 -translate-y-1/2 -translate-x-full bg-blue-600 text-white px-3 py-6 rounded-l-lg shadow-lg cursor-pointer hover:bg-blue-700 transition-colors"
                            >
                                <div className="flex flex-col items-center gap-2">
                                    <span className="text-xs font-bold writing-mode-vertical transform rotate-180" style={{ writingMode: 'vertical-rl' }}>
                                        CONTACT US
                                    </span>
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const Footer = ({ onContactClick }) => (
            <footer className="bg-[#1A202C] text-gray-400 py-12 text-sm">
                <div className="mx-2 md:mx-8 lg:mx-16">
                    <div className="grid grid-cols-2 md:grid-cols-4 gap-8 mb-8">
                        <div>
                            <h4 className="text-white font-bold mb-4 uppercase">Company</h4>
                            <ul className="space-y-2">
                                <li className="hover:text-white cursor-pointer"><a href="/about">About Us</a></li>
                                <li className="hover:text-white cursor-pointer"><a href="/careers">Careers</a></li>
                                <li className="hover:text-white cursor-pointer"><a href="/#partners">Partners</a></li>
                                <li className="hover:text-white cursor-pointer"><a href="/contact">Contact Us</a></li>
                            </ul>
                        </div>
                        <div>
                            <h4 className="text-white font-bold mb-4 uppercase">Our DSA's Partner Services</h4>
                            <ul className="space-y-2">
                                <li className="hover:text-white cursor-pointer"><a href="/loans/personal-loan">Personal Loan</a></li>
                                <li className="hover:text-white cursor-pointer"><a href="/loans/business-loan">Business Loan</a></li>
                                <li className="hover:text-white cursor-pointer"><a href="/loans/loan-against-property">Loan Against Property</a></li>
                                <li className="hover:text-white cursor-pointer"><a href="/loans/home-loan">Home Loan</a></li>
                                <li className="hover:text-white cursor-pointer"><a href="/loans/overdraft">OverDraft</a></li>
                                <li className="hover:text-white cursor-pointer"><a href="/loans/credit-card">Credit Card</a></li>
                                <li className="hover:text-white cursor-pointer"><a href="/loans/car-loan">Car Loan</a></li>
                            </ul>
                        </div>
                        <div>
                            <h4 className="text-white font-bold mb-4 uppercase">Resources</h4>
                            <ul className="space-y-2">
                                <li className="hover:text-white cursor-pointer"><a href="/calculators">Financial Tools</a></li>
                                <li className="hover:text-white cursor-pointer">Blogs</li>
                                <li className="hover:text-white cursor-pointer"><a href="/faq">FAQs</a></li>
                                <li className="hover:text-white cursor-pointer"><a href="/glossary">Glossary</a></li>
                            </ul>
                        </div>
                        <div>
                            <h4 className="text-white font-bold mb-4 uppercase">Contact Us</h4>
                            <ul className="space-y-2">
                                <li>amit@creditsbazaar.com</li>
                                <li className="mt-4 flex gap-4">

            };

                    <FAQHero />
                    <FAQSection />
                    <Footer onContactClick={handleTalkToExpert} />
