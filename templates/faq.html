<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frequently Asked Questions - CreditBazaar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Open Sans', sans-serif;
        }

        .accordion-content {
            transition: max-height 0.3s ease-out, opacity 0.3s ease-out;
            max-height: 0;
            opacity: 0;
            overflow: hidden;
        }

        .accordion-content.open {
            max-height: 500px;
            /* Arbitrary large height */
            opacity: 1;
        }
    </style>
</head>

<body class="bg-gray-50">
    <div id="root"></div>

    {% raw %}
    <script type="text/babel">
        const { useState, useEffect } = React;

        const Navbar = () => {
            const menuItems = [
                { name: "Home", link: "/" },
                { name: "Loans", link: "/loans" },
                { name: "Credit Cards", link: "/creditcards" },
                { name: "Calculators", link: "/calculators" }
            ];

            return (
                <nav className="bg-white shadow-md sticky top-0 z-50">
                    <div className="mx-2 md:mx-8 lg:mx-16 py-3 flex items-center justify-between">
                        <div className="flex items-center">
                            <a href="/" className="flex items-center gap-2">
                                <img src="/static/logo.png" alt="CreditBazaar" className="h-16" />
                            </a>
                        </div>
                        <div className="flex items-center gap-4">
                            <div className="hidden lg:flex items-center gap-6">
                                {menuItems.map((item) => (
                                    <a key={item.name} href={item.link} className="font-semibold text-sm cursor-pointer text-gray-700 hover:text-blue-600 flex items-center gap-1 transition-colors">
                                        {item.name}
                                    </a>
                                ))}
                            </div>
                        </div>
                    </div>
                </nav>
            );
        };

        const FAQHero = () => (
            <div className="bg-[#052F5F] text-white py-20 text-center relative overflow-hidden">
                <div className="absolute top-0 left-0 w-64 h-64 bg-blue-500 rounded-full mix-blend-multiply filter blur-3xl opacity-20 -translate-x-1/2 -translate-y-1/2"></div>
                <div className="absolute bottom-0 right-0 w-64 h-64 bg-purple-500 rounded-full mix-blend-multiply filter blur-3xl opacity-20 translate-x-1/2 translate-y-1/2"></div>

                <div className="relative z-10 mx-2 md:mx-8 lg:mx-16">
                    <h1 className="text-4xl md:text-6xl font-bold mb-6">Frequently Asked Questions</h1>
                    <p className="text-xl md:text-2xl text-blue-100 max-w-3xl mx-auto leading-relaxed">
                        Got questions? We've got answers. Find everything you need to know about our services.
                    </p>
                </div>
            </div>
        );

        const FAQItem = ({ question, answer, isOpen, toggleOpen }) => {
            return (
                <div className="bg-white rounded-xl border border-gray-100 mb-4 overflow-hidden shadow-sm hover:shadow-md transition">
                    <button
                        onClick={toggleOpen}
                        className="w-full px-6 py-5 flex items-center justify-between text-left focus:outline-none bg-white hover:bg-gray-50 transition"
                    >
                        <span className="font-bold text-lg text-[#052F5F]">{question}</span>
                        <svg
                            className={`w-6 h-6 text-blue-500 transform transition-transform duration-300 ${isOpen ? 'rotate-180' : ''}`}
                            fill="none"
                            stroke="currentColor"
                            viewBox="0 0 24 24"
                        >
                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 9l-7 7-7-7"></path>
                        </svg>
                    </button>
                    <div className={`accordion-content bg-gray-50 px-6 ${isOpen ? 'open py-5 border-t border-gray-100' : ''}`}>
                        <p className="text-gray-600 leading-relaxed">{answer}</p>
                    </div>
                </div>
            );
        };

        const FAQSection = () => {
            const faqs = {
                "Loans": [
                    { q: "What types of loans can I apply for?", a: "You can apply for Personal Loans, Home Loans, Business Loans, and Loan Against Property depending on your eligibility and requirements." },
                    { q: "How long does it take to get a loan approved?", a: "Loan approval times vary by lender and loan type. Personal loans can often be approved instantly or within 24 hours, while home loans may take longer due to property verification." },
                    { q: "What documents are required for a Personal Loan?", a: "Typically, you need identity proof (Aadhaar/PAN), address proof, income proof (salary slips/bank statements), and photographs. Requirements may vary by lender." },
                    { q: "Can I get a loan with a low credit score?", a: "While a high credit score (750+) improves your chances, some lenders do offer loans to individuals with lower scores, though potentially at higher interest rates." },
                    { q: "What is the difference between specific and floating interest rates?", a: "A fixed interest rate remains the same throughout the loan tenure, meaning your EMI stays constant. A floating interest rate fluctuates based on market trends (like the Repo Rate), so your EMI may go up or down." },
                    { q: "Can I prepay or foreclose my loan?", a: "Yes, most lenders allow prepayment or foreclosure after a certain period (usually 6-12 months). Some may charge a small fee, while others offer it for free." }
                ],
                "Credit Cards": [
                    { q: "How do I choose the right credit card?", a: "Consider your spending habits. If you travel often, look for travel cards. If you shop online, look for cashback cards. We help you compare features to find the best match." },
                    { q: "What is the minimum salary required for a credit card?", a: "Eligibility criteria vary by bank and card type. Generally, a minimum monthly income of ₹15,000 - ₹25,000 is required for entry-level cards." },
                    { q: "How can I check my credit card application status?", a: "You can track your application status directly on our website or by contacting our customer support team." },
                    { q: "What is the 'Interest-Free Period'?", a: "It is the grace period (usually 20-50 days) during which you don't have to pay interest on your purchases, provided you pay the full bill amount by the due date." },
                    { q: "Will checking my eligibility affect my credit score?", a: "Checking your eligibility on CreditBazaar is a 'soft inquiry' and does not affect your credit score. However, applying directly with multiple banks might." }
                ],
                "Credit Score": [
                    { q: "What is a CIBIL Score?", a: "A CIBIL Score is a 3-digit number ranging from 300 to 900 that represents your creditworthiness. It is derived from your credit history found in the CIBIL Report." },
                    { q: "What is a good CIBIL Score?", a: "A score of 750 or above is generally considered good and increases your chances of getting loan and credit card approvals at better interest rates." },
                    { q: "How can I improve my credit score?", a: "You can improve your score by paying dues on time, maintaining a low credit utilization ratio, maintaining a healthy mix of secured and unsecured credit, and avoiding multiple loan applications in a short span." }
                ],
                "Repayment": [
                    { q: "What happens if I miss an EMI payment?", a: "Missing an EMI payment can lead to late payment charges and negatively impact your credit score. It's advisable to set up auto-debits to avoid missing dates." },
                    { q: "Can I change my EMI date?", a: "Some lenders allow you to change your EMI date for a small fee or upon request, but this is subject to their internal policies." },
                    { q: " What are the modes of repayment available?", a: "You can repay via NACH/ECS (Auto Debit), Post Dated Cheques (PDC), or online through Net Banking/UPI/Debit Card on the lender's portal." }
                ]
            };

            const [activeCategory, setActiveCategory] = useState("Loans");
            const [openIndex, setOpenIndex] = useState(0); // Default open first item

            return (
                <div className="py-16 bg-gray-50 min-h-screen">
                    <div className="mx-2 md:mx-8 lg:mx-16">
                        <div className="grid md:grid-cols-12 gap-8">
                            {/* Sidebar Categories */}
                            <div className="md:col-span-3">
                                <div className="bg-white rounded-xl shadow-sm border border-gray-100 p-2 sticky top-24">
                                    {Object.keys(faqs).map((category) => (
                                        <button
                                            key={category}
                                            onClick={() => {
                                                setActiveCategory(category);
                                                setOpenIndex(null); // Close all when switching category
                                            }}
                                            className={`w-full text-left px-4 py-3 rounded-lg font-bold transition-all mb-1 ${activeCategory === category ? 'bg-blue-50 text-blue-700 border-l-4 border-blue-600' : 'text-gray-600 hover:bg-gray-50'}`}
                                        >
                                            {category}
                                        </button>
                                    ))}
                                </div>
                            </div>

                            {/* Main Content */}
                            <div className="md:col-span-9">
                                <h2 className="text-2xl font-bold text-gray-800 mb-6 border-b pb-4">{activeCategory} FAQs</h2>
                                <div>
                                    {faqs[activeCategory].map((item, index) => (
                                        <FAQItem
                                            key={index}
                                            question={item.q}
                                            answer={item.a}
                                            isOpen={index === openIndex}
                                            toggleOpen={() => setOpenIndex(index === openIndex ? null : index)}
                                        />
                                    ))}
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const FloatingContactWidget = ({ isOpen, setIsOpen, hasBeenClosed, setHasBeenClosed }) => {
            const handleClose = () => {
                setIsOpen(false);
                setHasBeenClosed(true);
            };

            return (
                <div
                    className="fixed right-0 top-1/2 -translate-y-1/2 z-50 transition-all duration-500 ease-in-out"
                    style={{
                        transform: `translateY(-50%) translateX(${isOpen || !hasBeenClosed ? '0' : 'calc(100% - 40px)'})`
                    }}
                    onMouseEnter={() => hasBeenClosed && setIsOpen(true)}
                    onMouseLeave={() => hasBeenClosed && setIsOpen(false)}
                >
                    <div className="bg-gradient-to-br from-blue-600 to-blue-700 text-white rounded-l-2xl shadow-2xl overflow-hidden" style={{ width: '320px' }}>
                        <div className="bg-blue-800 px-6 py-4 flex items-center justify-between">
                            <div className="flex items-center gap-3">
                                <div className="w-10 h-10 bg-white rounded-full flex items-center justify-center">
                                    <svg className="w-6 h-6 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"></path></svg>
                                </div>
                                <div>
                                    <h3 className="font-bold text-sm">Need Help?</h3>
                                    <p className="text-xs text-blue-100">Talk to Expert</p>
                                </div>
                            </div>
                            {hasBeenClosed && (
                                <button onClick={handleClose} className="text-white hover:text-blue-200 transition">
                                    <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                                </button>
                            )}
                        </div>
                        <div className="px-6 py-6">
                            <p className="text-sm mb-4 text-blue-50">Get instant assistance from our customer executives. We're here to help!</p>
                            <div className="bg-white rounded-xl p-4 mb-4">
                                <div className="flex items-center gap-3 mb-3">
                                    <div className="w-12 h-12 bg-blue-100 rounded-full flex items-center justify-center">
                                        <svg className="w-6 h-6 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                                    </div>
                                    <div>
                                        <p className="text-xs text-gray-500 font-semibold">Customer Executive</p>
                                        <p className="text-sm text-gray-800 font-bold">Available 24/7</p>
                                    </div>
                                </div>
                                <a href="tel:9625835453" className="flex items-center justify-center gap-2 bg-gradient-to-r from-blue-600 to-blue-700 text-white font-bold py-3 px-4 rounded-lg hover:from-blue-700 hover:to-blue-800 transition shadow-lg transform hover:scale-105 no-underline">
                                    <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"></path></svg>
                                    9625835453
                                </a>
                            </div>
                            <p className="text-xs text-blue-100 text-center">Call us for instant loan & credit card assistance</p>
                        </div>
                        {!isOpen && hasBeenClosed && (
                            <div className="absolute left-0 top-1/2 -translate-y-1/2 -translate-x-full bg-blue-600 text-white px-3 py-6 rounded-l-lg shadow-lg cursor-pointer">
                                <div className="flex flex-col items-center gap-2">
                                    <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"></path></svg>
                                    <span className="text-xs font-bold writing-mode-vertical transform rotate-180" style={{ writingMode: 'vertical-rl' }}>CONTACT</span>
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const Footer = ({ onContactClick }) => (
            <footer className="bg-[#1A202C] text-gray-400 py-12 text-sm">
                <div className="mx-2 md:mx-8 lg:mx-16">
                    <div className="grid grid-cols-2 md:grid-cols-4 gap-8 mb-8">
                        <div>
                            <h4 className="text-white font-bold mb-4 uppercase">Company</h4>
                            <ul className="space-y-2">
                                <li className="hover:text-white cursor-pointer"><a href="/about">About Us</a></li>
                                <li className="hover:text-white cursor-pointer"><a href="/#partners">Partners</a></li>
                                <li className="hover:text-white cursor-pointer" onClick={onContactClick}>Contact Us</li>
                            </ul>
                        </div>
                        <div>
                            <h4 className="text-white font-bold mb-4 uppercase">Services</h4>
                            <ul className="space-y-2">
                                <li className="hover:text-white cursor-pointer"><a href="/loans">Personal Loan</a></li>
                                <li className="hover:text-white cursor-pointer"><a href="/loans">Home Loan</a></li>
                                <li className="hover:text-white cursor-pointer"><a href="/loans">Business Loan</a></li>
                                <li className="hover:text-white cursor-pointer"><a href="/creditcards">Credit Card</a></li>
                            </ul>
                        </div>
                        <div>
                            <h4 className="text-white font-bold mb-4 uppercase">Resources</h4>
                            <ul className="space-y-2">
                                <li className="hover:text-white cursor-pointer"><a href="/calculators">Financial Tools</a></li>
                                <li className="hover:text-white cursor-pointer">Blogs</li>
                                <li className="hover:text-white cursor-pointer"><a href="/faq">FAQs</a></li>
                                <li className="hover:text-white cursor-pointer"><a href="/glossary">Glossary</a></li>
                            </ul>
                        </div>
                        <div>
                            <h4 className="text-white font-bold mb-4 uppercase">Contact</h4>
                            <ul className="space-y-2">
                                <li>amit@creditsbazaar.com</li>
                                <li>9625835453</li>
                                <li className="mt-4 flex gap-4">
                                    <a href="https://www.instagram.com/official_creditsbazaar?igsh=MW5iaWQ1OTkxemFncQ==" target="_blank" rel="noopener noreferrer" className="w-8 h-8 bg-gray-700 rounded-full flex items-center justify-center hover:bg-pink-600 cursor-pointer transition-colors block">
                                        <svg className="w-4 h-4 text-white" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                                            <path fillRule="evenodd" d="M12.315 2c2.43 0 2.784.013 3.808.06 1.064.049 1.791.218 2.427.465a4.902 4.902 0 011.772 1.153 4.902 4.902 0 011.153 1.772c.247.636.416 1.363.465 2.427.048 1.067.06 1.407.06 4.123v.08c0 2.643-.012 2.987-.06 4.043-.049 1.064-.218 1.791-.465 2.427a4.902 4.902 0 01-1.153 1.772 4.902 4.902 0 01-1.772 1.153c-.636.247-1.363.416-2.427.465-1.067.048-1.407.06-4.123.06h-.08c-2.643 0-2.987-.012-4.043-.06-1.064-.049-1.791-.218-2.427-.465a4.902 4.902 0 01-1.772-1.153 4.902 4.902 0 01-1.153-1.772c-.247-.636-.416-1.363-.465-2.427-.047-1.024-.06-1.379-.06-3.808v-.63c0-2.43.013-2.784.06-3.808.049-1.064.218-1.791.465-2.427a4.902 4.902 0 011.153-1.772A4.902 4.902 0 015.468 2.525c.636-.247 1.363-.416 2.427-.465C8.901 2.013 9.256 2 11.685 2h.63zm-.081 1.802h-.468c-2.456 0-2.784.011-3.807.058-.975.045-1.504.207-1.857.344-.467.182-.8.398-1.15.748-.35.35-.566.683-.748 1.15-.137.353-.3.882-.344 1.857-.047 1.023-.058 1.351-.058 3.807v.468c0 2.456.011 2.784.058 3.807.045.975.207 1.504.344 1.857.182.466.399.8.748 1.15.35.35.683.566 1.15.748.353.137.882.3 1.857.344 1.054.048 1.37.058 4.041.058h.08c2.597 0 2.917-.01 3.96-.058.976-.045 1.505-.207 1.858-.344.466-.182.8-.398 1.15-.748.35-.35.566-.683.748-1.15.137-.353.3-.882.344-1.857.048-1.055.058-1.37.058-4.041v-.08c0-2.597-.01-2.917-.058-3.96-.045-.976-.207-1.505-.344-1.858a3.097 3.097 0 00-.748-1.15 3.098 3.098 0 00-1.15-.748c-.353-.137-.882-.3-1.857-.344-1.023-.047-1.351-.058-3.807-.058zM12 6.865a5.135 5.135 0 110 10.27 5.135 5.135 0 010-10.27zm0 1.802a3.333 3.333 0 100 6.666 3.333 3.333 0 000-6.666zm5.338-3.205a1.2 1.2 0 110 2.4 1.2 1.2 0 010-2.4z" clipRule="evenodd" />
                                        </svg>
                                    </a>
                                </li>
                            </ul>
                        </div>
                    </div>
                    <div className="border-t border-gray-700 pt-8 text-center text-xs">
                        <p>&copy; 2026 Creditsbazaar.com. All Rights Reserved.</p>
                        <p className="mt-2">Disclaimer: All info provided is for informational purposes only.</p>
                    </div>
                </div>
            </footer>
        );

        function App() {
            const [isContactOpen, setIsContactOpen] = useState(true);
            const [contactHasBeenClosed, setContactHasBeenClosed] = useState(false);

            useEffect(() => {
                let timer;
                if (isContactOpen) {
                    timer = setTimeout(() => {
                        setIsContactOpen(false);
                        setContactHasBeenClosed(true);
                    }, 5000);
                }
                return () => clearTimeout(timer);
            }, [isContactOpen]);

            const handleTalkToExpert = () => {
                setIsContactOpen(true);
            };

            return (
                <div className="font-sans text-gray-800 bg-gray-50 min-h-screen pb-0">
                    <Navbar />
                    <FAQHero />
                    <FAQSection />
                    <Footer onContactClick={handleTalkToExpert} />
                    <FloatingContactWidget
                        isOpen={isContactOpen}
                        setIsOpen={setIsContactOpen}
                        hasBeenClosed={contactHasBeenClosed}
                        setHasBeenClosed={setContactHasBeenClosed}
                    />
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
    {% endraw %}
</body>

</html>
