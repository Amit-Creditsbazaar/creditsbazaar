<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apply for Personal, Home & Business Loans - Creditsbazaar</title>
    <meta name="description"
        content="Apply for Personal Loans, Home Loans, and Business Loans with Creditsbazaar. Enjoy low interest rates, quick disbursal, and flexible tenure options tailored to your needs.">
    <meta name="keywords"
        content="apply for loan, personal loan, home loan, business loan, quick loan, low interest loan, finance, creditsbazaar">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://creditsbazaar.com/loans">

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://creditsbazaar.com/loans">
    <meta property="og:title" content="Apply for Personal, Home & Business Loans - Creditsbazaar">
    <meta property="og:description"
        content="Apply for Personal Loans, Home Loans, and Business Loans with Creditsbazaar. Enjoy low interest rates, quick disbursal, and flexible tenure options.">
    <meta property="og:image" content="https://creditsbazaar.com/static/loans_hero_realistic.png">

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://creditsbazaar.com/loans">
    <meta property="twitter:title" content="Apply for Personal, Home & Business Loans - Creditsbazaar">
    <meta property="twitter:description"
        content="Apply for Personal Loans, Home Loans, and Business Loans with Creditsbazaar. Enjoy low interest rates, quick disbursal, and flexible tenure options.">
    <meta property="twitter:image" content="https://creditsbazaar.com/static/loans_hero_realistic.png">

    <!-- Schema.org Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FinancialProduct",
      "name": "Creditsbazaar Loans",
      "description": "Comprehensive loan solutions including Personal, Home, and Business loans with competitive interest rates.",
      "brand": {
        "@type": "Brand",
        "name": "Creditsbazaar"
      },
      "offers": {
        "@type": "Offer",
        "priceCurrency": "INR",
        "price": "0" 
      },
      "provider": {
        "@type": "Organization",
        "name": "Creditsbazaar",
        "url": "https://creditsbazaar.com"
      }
    }
    </script>

    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
    <style>
        body {
            font-family: 'Open Sans', sans-serif;
        }
    </style>
</head>

<body class="bg-gray-50">
    <div id="root"></div>

    {% raw %}
    <script type="text/babel">
        const { useState, useEffect } = React;

        const Navbar = ({ onSignInClick }) => {
            const [isMenuOpen, setIsMenuOpen] = useState(false);
            const menuItems = [
                { name: "Home", link: "/" },
                { name: "Loans", link: "/loans" },
                { name: "Credit Cards", link: "/creditcards" },
                { name: "Calculators", link: "/calculators" }
            ];

            return (
                <nav className="bg-white shadow-md sticky top-0 z-50">
                    <div className="mx-2 md:mx-8 lg:mx-16 py-3 flex items-center justify-between">
                        <div className="flex items-center gap-4">
                            {/* Hamburger Menu Button */}
                            <button
                                className="lg:hidden text-gray-700 focus:outline-none"
                                onClick={() => setIsMenuOpen(!isMenuOpen)}
                            >
                                <svg
                                    className="w-6 h-6"
                                    fill="none"
                                    stroke="currentColor"
                                    viewBox="0 0 24 24"
                                >
                                    {isMenuOpen ? (
                                        <path
                                            strokeLinecap="round"
                                            strokeLinejoin="round"
                                            strokeWidth="2"
                                            d="M6 18L18 6M6 6l12 12"
                                        />
                                    ) : (
                                        <path
                                            strokeLinecap="round"
                                            strokeLinejoin="round"
                                            strokeWidth="2"
                                            d="M4 6h16M4 12h16M4 18h16"
                                        />
                                    )}
                                </svg>
                            </button>
                            <a href="/" className="flex items-center gap-2">
                                <img src="/static/logo.png" alt="CreditBazaar" className="h-16" />
                            </a>
                        </div>
                        <div className="flex items-center gap-4">
                            <div className="hidden lg:flex items-center gap-6">
                                {menuItems.map((item) => (
                                    <a key={item.name} href={item.link} className={`font-semibold text-sm cursor-pointer flex items-center gap-1 transition-colors ${item.name === "Loans" ? "text-blue-600" : "text-gray-700 hover:text-blue-600"}`}>
                                        {item.name}
                                    </a>
                                ))}
                            </div>
                        </div>
                    </div>

                    {/* Mobile Menu Dropdown */}
                    {isMenuOpen && (
                        <div className="lg:hidden bg-white border-t border-gray-100 shadow-lg absolute w-full left-0 py-4 flex flex-col gap-4 px-6">
                            {menuItems.map((item) => (
                                <a
                                    key={item.name}
                                    href={item.link}
                                    className="block text-gray-700 font-semibold hover:text-blue-600 transition"
                                    onClick={() => setIsMenuOpen(false)}
                                >
                                    {item.name}
                                </a>
                            ))}
                        </div>
                    )}
                </nav>
            );
        };

        const LoanForm = () => {
            const [formData, setFormData] = useState({
                customer_name: '',
                email: '',
                contact_no: '',
                company_name: '',
                annual_salary: '',
                loan_type: '',
                salary_mode: '',
                pincode: ''
            });

            const handleChange = (e) => {
                const { name, value } = e.target;
                setFormData(prev => ({ ...prev, [name]: value }));
            };

            const handleSubmit = async (e) => {
                e.preventDefault();
                try {
                    const response = await fetch('/api/apply-loan', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify(formData),
                    });
                    const result = await response.json();
                    if (response.ok) {
                        alert('Application Submitted Successfully!');
                        setFormData({
                            customer_name: '', email: '', contact_no: '', company_name: '',
                            annual_salary: '', loan_type: '', salary_mode: '', pincode: ''
                        });
                    } else {
                        alert('Error: ' + result.error);
                    }
                } catch (error) {
                    console.error('Error:', error);
                    alert('Failed to submit application.');
                }
            };

            return (
                <div className="bg-white p-8 rounded-2xl shadow-lg border border-gray-100">
                    <h2 className="text-2xl font-bold text-[#052F5F] mb-6">Unlock Your Dreams with the Right Loan</h2>
                    <form className="space-y-5" onSubmit={handleSubmit}>
                        <div className="space-y-1">
                            <label className="text-sm font-semibold text-gray-700">Customer Name</label>
                            <input
                                type="text"
                                name="customer_name"
                                value={formData.customer_name}
                                onChange={handleChange}
                                placeholder="Enter your full name"
                                className="w-full px-4 py-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500 transition"
                                required
                            />
                        </div>

                        <div className="grid grid-cols-1 md:grid-cols-2 gap-5">
                            <div className="space-y-1">
                                <label className="text-sm font-semibold text-gray-700">Email ID</label>
                                <input
                                    type="email"
                                    name="email"
                                    value={formData.email}
                                    onChange={handleChange}
                                    placeholder="name@example.com"
                                    className="w-full px-4 py-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500 transition"
                                    required
                                />
                            </div>
                            <div className="space-y-1">
                                <label className="text-sm font-semibold text-gray-700">Contact No</label>
                                <input
                                    type="tel"
                                    name="contact_no"
                                    value={formData.contact_no}
                                    onChange={handleChange}
                                    placeholder="Mobile Number"
                                    className="w-full px-4 py-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500 transition"
                                    required
                                />
                            </div>
                        </div>

                        <div className="space-y-1">
                            <label className="text-sm font-semibold text-gray-700">Company Name</label>
                            <input
                                type="text"
                                name="company_name"
                                value={formData.company_name}
                                onChange={handleChange}
                                placeholder="Current Employer Name"
                                className="w-full px-4 py-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500 transition"
                            />
                        </div>

                        <div className="space-y-1">
                            <label className="text-sm font-semibold text-gray-700">Annual Salary</label>
                            <select
                                name="annual_salary"
                                value={formData.annual_salary}
                                onChange={handleChange}
                                className="w-full px-4 py-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500 transition bg-white cursor-pointer"
                                required
                            >
                                <option value="">Select Salary Range</option>
                                <option value="Below 3 Lakhs">Below ₹3 Lakhs</option>
                                <option value="3 Lakhs - 5 Lakhs">₹3 Lakhs - ₹5 Lakhs</option>
                                <option value="5 Lakhs - 10 Lakhs">₹5 Lakhs - ₹10 Lakhs</option>
                                <option value="Above 10 Lakhs">Above ₹10 Lakhs</option>
                            </select>
                        </div>

                        <div className="grid grid-cols-1 md:grid-cols-2 gap-5">
                            <div className="space-y-1">
                                <label className="text-sm font-semibold text-gray-700">Loan Type</label>
                                <select
                                    name="loan_type"
                                    value={formData.loan_type}
                                    onChange={handleChange}
                                    className="w-full px-4 py-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500 transition bg-white cursor-pointer"
                                    required
                                >
                                    <option value="">Select Type</option>
                                    <option value="Personal loan">Personal Loan</option>
                                    <option value="Business loan">Business Loan</option>
                                    <option value="Home Loan">Home Loan</option>
                                    <option value="Transfer Loan">Transfer Loan</option>
                                    <option value="Overdraft Facility">Overdraft Facility</option>
                                </select>
                            </div>
                            <div className="space-y-1">
                                <label className="text-sm font-semibold text-gray-700">Mode of Salary</label>
                                <select
                                    name="salary_mode"
                                    value={formData.salary_mode}
                                    onChange={handleChange}
                                    className="w-full px-4 py-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500 transition bg-white cursor-pointer"
                                    required
                                >
                                    <option value="">Select Mode</option>
                                    <option value="Cash">Cash</option>
                                    <option value="Bank Transfer">Bank Transfer</option>
                                </select>
                            </div>
                        </div>

                        <div className="space-y-1">
                            <label className="text-sm font-semibold text-gray-700">Pin Code</label>
                            <input
                                type="number"
                                name="pincode"
                                value={formData.pincode}
                                onChange={handleChange}
                                placeholder="Six Digit Pin Code"
                                className="w-full px-4 py-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500 transition"
                                required
                            />
                        </div>

                        <div className="flex items-start gap-3 pt-2">
                            <input type="checkbox" id="consent" className="mt-1 w-5 h-5 text-blue-600 rounded focus:ring-blue-500 border-gray-300 cursor-pointer" required />
                            <label htmlFor="consent" className="text-xs text-gray-500 cursor-pointer">
                                I authorize CreditBazaar and its partner banks/NBFCs to contact me for personal loan offers.
                            </label>
                        </div>

                        <button type="submit" className="w-full bg-[#FF6F3C] text-white font-bold py-4 rounded-lg hover:bg-[#ff8a5e] transition shadow-lg transform hover:scale-[1.01] uppercase tracking-wide text-sm">
                            Proceed to Apply
                        </button>
                    </form>
                </div>
            );
        }

        const FloatingContactWidget = ({ isOpen, setIsOpen }) => {
            const handleClose = () => {
                setIsOpen(false);
            };

            return (
                <div
                    className="fixed right-0 top-1/2 -translate-y-1/2 z-50 transition-all duration-500 ease-in-out"
                    style={{
                        transform: `translateY(-50%) translateX(${isOpen ? '0' : '100%'})`
                    }}
                >
                    <div className="bg-gradient-to-br from-blue-600 to-blue-700 text-white rounded-l-2xl shadow-2xl overflow-hidden" style={{ width: '320px' }}>
                        <div className="bg-blue-800 px-6 py-4 flex items-center justify-between">
                            <div className="flex items-center gap-3">
                                <div className="w-10 h-10 bg-white rounded-full flex items-center justify-center">
                                    <svg className="w-6 h-6 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"></path>
                                    </svg>
                                </div>
                                <div>
                                    <h3 className="font-bold text-sm">Need Help?</h3>
                                    <p className="text-xs text-blue-100">Talk to Expert</p>
                                </div>
                            </div>
                            <button
                                onClick={handleClose}
                                className="text-white hover:text-blue-200 transition"
                            >
                                <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12"></path>
                                </svg>
                            </button>
                        </div>

                        <div className="px-6 py-6">
                            <p className="text-sm mb-4 text-blue-50">
                                Get instant assistance from our customer executives. We're here to help!
                            </p>

                            <div className="bg-white rounded-xl p-4 mb-4">
                                <div className="flex items-center gap-3 mb-3">
                                    <div className="w-12 h-12 bg-blue-100 rounded-full flex items-center justify-center">
                                        <svg className="w-6 h-6 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                                        </svg>
                                    </div>
                                    <div>
                                        <p className="text-xs text-gray-500 font-semibold">Customer Executive</p>
                                        <p className="text-sm text-gray-800 font-bold">Available 24/7</p>
                                    </div>
                                </div>

                                <a
                                    href="tel:9625835453"
                                    className="flex items-center justify-center gap-2 bg-gradient-to-r from-blue-600 to-blue-700 text-white font-bold py-3 px-4 rounded-lg hover:from-blue-700 hover:to-blue-800 transition shadow-lg transform hover:scale-105 no-underline"
                                >
                                    <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"></path>
                                    </svg>
                                    9625835453
                                </a>
                            </div>

                            <p className="text-xs text-blue-100 text-center">
                                Call us for instant loan & credit card assistance
                            </p>
                        </div>

                        {!isOpen && (
                            <div
                                onClick={() => setIsOpen(true)}
                                className="absolute left-0 top-1/2 -translate-y-1/2 -translate-x-full bg-blue-600 text-white px-3 py-6 rounded-l-lg shadow-lg cursor-pointer hover:bg-blue-700 transition-colors"
                            >
                                <div className="flex flex-col items-center gap-2">
                                    <span className="text-xs font-bold writing-mode-vertical transform rotate-180" style={{ writingMode: 'vertical-rl' }}>
                                        CONTACT
                                    </span>
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        };


        const LoanHeroLower = () => {
            return (
                <div className="bg-white py-16 md:py-24 relative overflow-hidden">
                    <div className="absolute top-0 left-0 w-64 h-64 bg-orange-100 rounded-full mix-blend-multiply filter blur-3xl opacity-30 -translate-x-1/2 -translate-y-1/2"></div>
                    <div className="absolute bottom-0 right-0 w-64 h-64 bg-blue-100 rounded-full mix-blend-multiply filter blur-3xl opacity-30 translate-x-1/2 translate-y-1/2"></div>

                    <div className="mx-2 md:mx-8 lg:mx-16 relative z-10">
                        <div className="flex flex-col lg:flex-row items-center gap-12">
                            <div className="lg:w-1/2 space-y-6">
                                <h2 className="text-3xl md:text-5xl font-bold text-[#052F5F] leading-tight">
                                    Empowering Your Financial Journey with the <span className="text-blue-600">Right Capital</span>.
                                </h2>
                                <p className="text-lg text-gray-600 leading-relaxed">
                                    Whether you are building a home, growing a business, or managing the unexpected—we provide fast, transparent, and flexible loan options tailored to your needs.
                                </p>

                                <div className="flex flex-col sm:flex-row gap-4 pt-4">
                                    <button
                                        onClick={() => window.scrollTo({ top: 0, behavior: 'smooth' })}
                                        className="bg-[#FF6F3C] text-white font-bold py-3 px-8 rounded-lg hover:bg-[#ff8a5e] transition shadow-lg transform hover:scale-[1.02]"
                                    >
                                        Apply Now
                                    </button>
                                </div>
                            </div>
                            <div className="lg:w-1/2 w-full">
                                <div className="relative rounded-2xl overflow-hidden shadow-2xl group">
                                    <div className="absolute inset-0 bg-blue-600 opacity-0 group-hover:opacity-10 transition duration-300 z-10"></div>
                                    <img
                                        src="https://placehold.co/1200x800/eff6ff/1e40af?text=Empowering+Your+Financial+Journey"
                                        alt="Happy Family"
                                        className="w-full h-auto object-cover transform group-hover:scale-105 transition duration-700"
                                    />
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const DetailedServices = () => {
            const services = [
                {
                    title: "1. Personal Loan",
                    headline: "Funds for Life’s Unscripted Moments",
                    subtext: "Don't let a lack of funds pause your life plans. Whether it's a dream wedding, a much-needed vacation, or a medical emergency, our Personal Loans provide you with unsecured capital quickly and with minimal paperwork.",
                    features: [
                        { title: "No Collateral Required", desc: "100% unsecured funding." },
                        { title: "Quick Disbursal", desc: "Get funds in your account within 24–48 hours." },
                        { title: "Flexible Tenure", desc: "Choose a repayment plan that fits your monthly budget." }
                    ],
                    image: "/static/personal_loan_service.png",
                    direction: "ltr"
                },
                {
                    title: "2. Home Loan",
                    headline: "The Keys to Your Dream Home",
                    subtext: "Stop renting and start owning. We offer competitive interest rates and high-value financing to help you buy, build, or renovate your sanctuary. We guide you through the paperwork so you can focus on the housewarming.",
                    features: [
                        { title: "High Loan-to-Value", desc: "Get funding for up to 90% of the property cost." },
                        { title: "Longer Tenures", desc: "Repayment options spanning up to 30 years to lower your EMI." },
                        { title: "Doorstep Service", desc: "We collect documents from your home or office." }
                    ],
                    image: "/static/home_loan_service.png",
                    direction: "rtl"
                },
                {
                    title: "3. Business Loan",
                    headline: "Fuel for Your Enterprise",
                    subtext: "Growth shouldn't wait. Whether you need working capital, machinery, or funds for expansion, our Business Loans are designed to keep your operations running smoothly without providing assets as security.",
                    features: [
                        { title: "Collateral-Free", desc: "Access funds based on your turnover and business health." },
                        { title: "Customized Limits", desc: "Loan amounts tailored to your specific industry needs." },
                        { title: "Tax Benefits", desc: "Interest paid is tax-deductible as a business expense." }
                    ],
                    image: "/static/business_loan_service.png",
                    direction: "ltr"
                },
                {
                    title: "4. Transfer Loan (Balance Transfer)",
                    headline: "Switch to Lower Rates, Save More",
                    subtext: "Stuck with a high-interest loan? Move your existing Personal or Home Loan to us. We reduce your interest burden and offer you a top-up facility for extra cash in hand.",
                    features: [
                        { title: "Reduce Your EMI", desc: "Instantly lower your monthly outflow with better rates." },
                        { title: "Top-Up Facility", desc: "Get additional funds over and above your transferred amount." },
                        { title: "Zero Hidden Charges", desc: "Transparent processing fees and foreclosure norms." }
                    ],
                    image: "/static/transfer_loan_service.png",
                    direction: "rtl"
                },
                {
                    title: "5. Overdraft Facility",
                    headline: "Pay Only For What You Use",
                    subtext: "Liquidity when you need it, zero cost when you don't. Our Overdraft facility links to your bank account, giving you a safety net for cash flow mismatches. You only pay interest on the amount you withdraw, not the total limit.",
                    features: [
                        { title: "Interest Saver", desc: "Interest is calculated daily only on the utilized amount." },
                        { title: "Instant Liquidity", desc: "Withdraw and deposit funds anytime without penalties." },
                        { title: "Revolving Credit", desc: "As you repay, your credit limit is restored instantly." }
                    ],
                    image: "/static/overdraft_service.png",
                    direction: "ltr"
                }
            ];

            return (
                <div className="bg-gray-50 py-16">
                    <div className="mx-2 md:mx-8 lg:mx-16 space-y-24">
                        {services.map((service, idx) => (
                            <div key={idx} className={`flex flex-col ${service.direction === 'rtl' ? 'lg:flex-row-reverse' : 'lg:flex-row'} items-center gap-12`}>
                                <div className="lg:w-1/2 space-y-6">
                                    <div className="inline-block bg-blue-100 text-blue-800 font-bold py-1 px-3 rounded-full text-sm mb-2">
                                        {service.title}
                                    </div>
                                    <h3 className="text-3xl font-bold text-gray-900">{service.headline}</h3>
                                    <p className="text-lg text-gray-600 leading-relaxed">
                                        {service.subtext}
                                    </p>
                                    <div className="grid gap-6 mt-6">
                                        {service.features.map((feature, fIdx) => (
                                            <div key={fIdx} className="flex items-start gap-4">
                                                <div className="flex-shrink-0 w-10 h-10 bg-white rounded-full flex items-center justify-center shadow-sm text-blue-600">
                                                    <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 13l4 4L19 7"></path>
                                                    </svg>
                                                </div>
                                                <div>
                                                    <h4 className="font-bold text-gray-900 text-sm">{feature.title}</h4>
                                                    <p className="text-gray-500 text-sm">{feature.desc}</p>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                                <div className="lg:w-1/2 w-full">
                                    <div className="relative rounded-2xl overflow-hidden shadow-xl hover:shadow-2xl transition duration-500 bg-white p-2">
                                        <div className="rounded-xl overflow-hidden">
                                            <img
                                                src={service.image}
                                                alt={service.headline}
