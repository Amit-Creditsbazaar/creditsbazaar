<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="google-site-verification" content="xD85Mz8xn2ZWUWSRvvkrPq_47S2qwhhu5urrxYnTYdI" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ loan_name }} - Apply Online | Creditsbazaar</title>
    <meta name="description" content="{{ meta_description }}">
    <meta name="keywords" content="{{ loan_name|lower }}, apply for {{ loan_name|lower }}, creditsbazaar, instant loan approval, low interest loan">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://creditsbazaar.com/loans/{{ slug }}">

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://creditsbazaar.com/loans/{{ slug }}">
    <meta property="og:title" content="{{ loan_name }} - Apply Online | Creditsbazaar">
    <meta property="og:description" content="{{ meta_description }}">
    <meta property="og:image" content="https://creditsbazaar.com/static/{{ hero_image }}">

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://creditsbazaar.com/loans/{{ slug }}">
    <meta property="twitter:title" content="{{ loan_name }} - Apply Online | Creditsbazaar">
    <meta property="twitter:description" content="{{ meta_description }}">
    <meta property="twitter:image" content="https://creditsbazaar.com/static/{{ hero_image }}">

    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
    <style>
        body {
            font-family: 'Open Sans', sans-serif;
        }
    </style>
</head>

<body class="bg-gray-50">
    <div id="root"></div>
    <div id="loan-data"
         data-loan-name="{{ loan_name }}"
         data-loan-value="{{ loan_value }}"
         data-hero-image="{{ hero_image }}"
         data-headline="{{ headline }}"
         data-subtext="{{ subtext|e }}"
         style="display:none"></div>
    <script id="loan-content" type="application/json">{{ content_json|safe }}</script>

    {% raw %}
    <script type="text/babel">
        const { useState, useEffect } = React;

        const loanData = (() => {
            const el = document.getElementById('loan-data');
            const content = JSON.parse(document.getElementById('loan-content').textContent);
            return {
                name: el.dataset.loanName,
                value: el.dataset.loanValue,
                heroImage: el.dataset.heroImage,
                headline: el.dataset.headline,
                subtext: el.dataset.subtext,
                content
            };
        })();

        const Navbar = () => {
            const [isMenuOpen, setIsMenuOpen] = useState(false);
            const menuItems = [
                { name: "Home", link: "/" },
                { name: "Loans", link: "/loans" },
                { name: "Credit Cards", link: "/creditcards" },
                { name: "Calculators", link: "/calculators" }
            ];
            const loanTypes = [
                { name: "Personal Loan", link: "/loans/personal-loan" },
                { name: "Business Loan", link: "/loans/business-loan" },
                { name: "Loan Against Property", link: "/loans/loan-against-property" },
                { name: "Home Loan", link: "/loans/home-loan" },
                { name: "OverDraft", link: "/loans/overdraft" },
                { name: "Credit Card", link: "/loans/credit-card" },
                { name: "Car Loan", link: "/loans/car-loan" }
            ];

            return (
                <nav className="bg-white shadow-md sticky top-0 z-50">
                    <div className="mx-2 md:mx-8 lg:mx-16 py-3 flex items-center justify-between">
                        <div className="flex items-center gap-4">
                            <button
                                className="lg:hidden text-gray-700 focus:outline-none"
                                onClick={() => setIsMenuOpen(!isMenuOpen)}
                            >
                                <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    {isMenuOpen ? (
                                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12" />
                                    ) : (
                                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 6h16M4 12h16M4 18h16" />
                                    )}
                                </svg>
                            </button>
                            <a href="/" className="flex items-center gap-2">
                                <img src="/static/logo.png" alt="CreditBazaar" className="h-16" />
                            </a>
                        </div>
                        <div className="flex items-center gap-4">
                            <div className="hidden lg:flex items-center gap-6">
                                {menuItems.map((item) => (
                                    item.name === "Loans" ? (
                                        <div key={item.name} className="relative group">
                                            <a href="/loans" className="font-semibold text-sm cursor-pointer flex items-center gap-1 transition-colors text-blue-600 py-2">
                                                Loans
                                                <svg className="w-3 h-3 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 9l-7 7-7-7" /></svg>
                                            </a>
                                            <div className="absolute left-0 top-full hidden group-hover:block bg-white shadow-xl rounded-lg border border-gray-100 py-2 w-56 z-50">
                                                {loanTypes.map((lt) => (
                                                    <a key={lt.name} href={lt.link} className={`block px-4 py-2 text-sm transition-colors ${lt.name === loanData.name ? "text-blue-600 font-semibold bg-blue-50" : "text-gray-700 hover:bg-blue-50 hover:text-blue-600"}`}>
                                                        {lt.name}
                                                    </a>
                                                ))}
                                            </div>
                                        </div>
                                    ) : (
                                        <a key={item.name} href={item.link} className="font-semibold text-sm cursor-pointer flex items-center gap-1 transition-colors text-gray-700 hover:text-blue-600">
                                            {item.name}
                                        </a>
                                    )
                                ))}
                            </div>
                        </div>
                    </div>

                    {isMenuOpen && (
                        <div className="lg:hidden bg-white border-t border-gray-100 shadow-lg absolute w-full left-0 py-4 flex flex-col gap-4 px-6">
                            {menuItems.map((item) => (
                                item.name === "Loans" ? (
                                    <div key={item.name} className="flex flex-col gap-2">
                                        <span className="block text-gray-700 font-bold">Loans</span>
                                        <div className="flex flex-col gap-2 pl-4 border-l-2 border-gray-100">
                                            {loanTypes.map((lt) => (
                                                <a
                                                    key={lt.name}
                                                    href={lt.link}
                                                    className="block text-gray-600 text-sm hover:text-blue-600 transition"
                                                    onClick={() => setIsMenuOpen(false)}
                                                >
                                                    {lt.name}
                                                </a>
                                            ))}
                                        </div>
                                    </div>
                                ) : (
                                    <a
                                        key={item.name}
                                        href={item.link}
                                        className="block text-gray-700 font-semibold hover:text-blue-600 transition"
                                        onClick={() => setIsMenuOpen(false)}
                                    >
                                        {item.name}
                                    </a>
                                )
                            ))}
                        </div>
                    )}
                </nav>
            );
        };

        const LoanForm = () => {
            const [formData, setFormData] = useState({
                customer_name: '',
                email: '',
                contact_no: '',
                company_name: '',
                annual_salary: '',
                loan_type: loanData.value,
                salary_mode: '',
                pincode: '',
                referral: '',
                referral_other: ''
            });

            const handleChange = (e) => {
                const { name, value } = e.target;
                setFormData(prev => ({ ...prev, [name]: value }));
            };

            const handleSubmit = async (e) => {
                e.preventDefault();
                try {
                    const response = await fetch('/api/apply-loan', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(formData),
                    });
                    const result = await response.json();
                    if (response.ok) {
                        alert('Application Submitted Successfully!');
                        setFormData({
                            customer_name: '', email: '', contact_no: '', company_name: '',
                            annual_salary: '', loan_type: loanData.value, salary_mode: '', pincode: '',
                            referral: '', referral_other: ''
                        });
                    } else {
                        alert('Error: ' + result.error);
                    }
                } catch (error) {
                    console.error('Error:', error);
                    alert('Failed to submit application.');
                }
            };

            return (
                <div className="bg-white p-8 rounded-2xl shadow-lg border border-gray-100">
                    <h2 className="text-2xl font-bold text-[#052F5F] mb-6">Apply for {loanData.name}</h2>
                    <form className="space-y-5" onSubmit={handleSubmit}>
                        <div className="space-y-1">
                            <label className="text-sm font-semibold text-gray-700">Customer Name</label>
                            <input
                                type="text"
                                name="customer_name"
                                value={formData.customer_name}
                                onChange={handleChange}
                                placeholder="Enter your full name"
                                className="w-full px-4 py-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500 transition"
                                required
                            />
                        </div>

                        <div className="grid grid-cols-1 md:grid-cols-2 gap-5">
                            <div className="space-y-1">
                                <label className="text-sm font-semibold text-gray-700">Email ID</label>
                                <input
                                    type="email"
                                    name="email"
                                    value={formData.email}
                                    onChange={handleChange}
                                    placeholder="name@example.com"
                                    className="w-full px-4 py-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500 transition"
                                    required
                                />
                            </div>
                            <div className="space-y-1">
                                <label className="text-sm font-semibold text-gray-700">Contact No</label>
                                <input
                                    type="tel"
                                    name="contact_no"
                                    value={formData.contact_no}
                                    onChange={handleChange}
                                    placeholder="Mobile Number"
                                    className="w-full px-4 py-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500 transition"
                                    required
                                />
                            </div>
                        </div>

                        <div className="space-y-1">
                            <label className="text-sm font-semibold text-gray-700">Company Name</label>
                            <input
                                type="text"
                                name="company_name"
                                value={formData.company_name}
                                onChange={handleChange}
                                placeholder="Current Employer Name"
                                className="w-full px-4 py-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500 transition"
                            />
                        </div>

                        <div className="space-y-1">
                            <label className="text-sm font-semibold text-gray-700">Annual Salary</label>
                            <select
                                name="annual_salary"
                                value={formData.annual_salary}
                                onChange={handleChange}
                                className="w-full px-4 py-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500 transition bg-white cursor-pointer"
                                required
                            >
                                <option value="">Select Salary Range</option>
                                <option value="Below 3 Lakhs">Below ₹3 Lakhs</option>
                                <option value="3 Lakhs - 5 Lakhs">₹3 Lakhs - ₹5 Lakhs</option>
                                <option value="5 Lakhs - 10 Lakhs">₹5 Lakhs - ₹10 Lakhs</option>
                                <option value="Above 10 Lakhs">Above ₹10 Lakhs</option>
                            </select>
                        </div>

                        <div className="grid grid-cols-1 md:grid-cols-2 gap-5">
                            <div className="space-y-1">
                                <label className="text-sm font-semibold text-gray-700">Loan Type</label>
                                <select
                                    name="loan_type"
                                    value={formData.loan_type}
                                    onChange={handleChange}
                                    className="w-full px-4 py-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500 transition bg-white cursor-pointer"
                                    required
                                >
                                    <option value="Personal Loan">Personal Loan</option>
                                    <option value="Business Loan">Business Loan</option>
                                    <option value="Loan Against Property">Loan Against Property</option>
                                    <option value="Home Loan">Home Loan</option>
                                    <option value="OverDraft">OverDraft</option>
                                    <option value="Credit Card">Credit Card</option>
                                    <option value="Car Loan">Car Loan</option>
                                </select>
                            </div>
                            <div className="space-y-1">
                                <label className="text-sm font-semibold text-gray-700">Mode of Salary</label>
                                <select
                                    name="salary_mode"
                                    value={formData.salary_mode}
                                    onChange={handleChange}
                                    className="w-full px-4 py-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500 transition bg-white cursor-pointer"
                                    required
                                >
                                    <option value="">Select Mode</option>
                                    <option value="Cash">Cash</option>
                                    <option value="Bank Transfer">Bank Transfer</option>
                                </select>
                            </div>
                        </div>

                        <div className="space-y-1">
                            <label className="text-sm font-semibold text-gray-700">Pin Code</label>
                            <input
                                type="number"
                                name="pincode"
                                value={formData.pincode}
                                onChange={handleChange}
                                placeholder="Six Digit Pin Code"
                                className="w-full px-4 py-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500 transition"
                                required
                            />
                        </div>

                        <div className="space-y-1">
                            <label className="text-sm font-semibold text-gray-700">Referral</label>
                            <select
                                name="referral"
                                value={formData.referral}
                                onChange={handleChange}
                                className="w-full px-4 py-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500 transition bg-white cursor-pointer"
                            >
                                <option value="">Select Referral</option>
                                <option value="Amit kumar">Amit kumar</option>
                                <option value="Rahul Kumar">Rahul Kumar</option>
                                <option value="Vikas kumar">Vikas kumar</option>
                                <option value="Rahul chauhan">Rahul chauhan</option>
                                <option value="Other">Other / Customized Name</option>
                            </select>
                            {formData.referral === 'Other' && (
                                <input
                                    type="text"
                                    name="referral_other"
                                    value={formData.referral_other}
                                    onChange={handleChange}
                                    placeholder="Enter referral name"
                                    className="w-full mt-2 px-4 py-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500 transition"
                                />
                            )}
                        </div>

                        <div className="flex items-start gap-3 pt-2">
                            <input type="checkbox" id="consent" className="mt-1 w-5 h-5 text-blue-600 rounded focus:ring-blue-500 border-gray-300 cursor-pointer" required />
                            <label htmlFor="consent" className="text-xs text-gray-500 cursor-pointer">
                                I authorize CreditBazaar and its partner banks/NBFCs to contact me for {loanData.name.toLowerCase()} offers.
                            </label>
                        </div>

                        <button type="submit" className="w-full bg-[#FF6F3C] text-white font-bold py-4 rounded-lg hover:bg-[#ff8a5e] transition shadow-lg transform hover:scale-[1.01] uppercase tracking-wide text-sm">
                            Proceed to Apply
                        </button>
                    </form>
                </div>
            );
        };

        const Footer = () => (
            <footer className="bg-[#1A202C] text-gray-400 py-12 text-sm">
                <div className="mx-2 md:mx-8 lg:mx-16">
                    <div className="grid grid-cols-2 md:grid-cols-4 gap-8 mb-8">
                        <div>
                            <h4 className="text-white font-bold mb-4 uppercase">Company</h4>
                            <ul className="space-y-2">
                                <li className="hover:text-white cursor-pointer"><a href="/about">About Us</a></li>
                                <li className="hover:text-white cursor-pointer"><a href="/careers">Careers</a></li>
                                <li className="hover:text-white cursor-pointer"><a href="/#partners">Partners</a></li>
                                <li className="hover:text-white cursor-pointer"><a href="/contact">Contact Us</a></li>
                            </ul>
                        </div>
                        <div>
                            <h4 className="text-white font-bold mb-4 uppercase">Our DSA's Partner Services</h4>
                            <ul className="space-y-2">
                                <li className="hover:text-white cursor-pointer"><a href="/loans/personal-loan">Personal Loan</a></li>
                                <li className="hover:text-white cursor-pointer"><a href="/loans/business-loan">Business Loan</a></li>
                                <li className="hover:text-white cursor-pointer"><a href="/loans/loan-against-property">Loan Against Property</a></li>
                                <li className="hover:text-white cursor-pointer"><a href="/loans/home-loan">Home Loan</a></li>
                                <li className="hover:text-white cursor-pointer"><a href="/loans/overdraft">OverDraft</a></li>
                                <li className="hover:text-white cursor-pointer"><a href="/loans/credit-card">Credit Card</a></li>
                                <li className="hover:text-white cursor-pointer"><a href="/loans/car-loan">Car Loan</a></li>
                            </ul>
                        </div>
                        <div>
                            <h4 className="text-white font-bold mb-4 uppercase">Resources</h4>
                            <ul className="space-y-2">
                                <li className="hover:text-white cursor-pointer"><a href="/calculators">Financial Tools</a></li>
                                <li className="hover:text-white cursor-pointer"><a href="/faq">FAQs</a></li>
                                <li className="hover:text-white cursor-pointer"><a href="/glossary">Glossary</a></li>
                            </ul>
                        </div>
                        <div>
                            <h4 className="text-white font-bold mb-4 uppercase">Contact Us</h4>
                            <ul className="space-y-2">
                                <li>creditsbazaar@gmail.com</li>
                                <li className="mt-4 flex gap-4">
                                    <a href="https://www.instagram.com/officialcreditsbazaar?igsh=YjhsMmtsZ2UydDg3" target="_blank" rel="noopener noreferrer" className="w-8 h-8 bg-gray-700 rounded-full flex items-center justify-center hover:bg-pink-600 cursor-pointer transition-colors block">
                                        <svg className="w-4 h-4 text-white" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                                            <path fillRule="evenodd" d="M12.315 2c2.43 0 2.784.013 3.808.06 1.064.049 1.791.218 2.427.465a4.902 4.902 0 011.772 1.153 4.902 4.902 0 011.153 1.772c.247.636.416 1.363.465 2.427.048 1.067.06 1.407.06 4.123v.08c0 2.643-.012 2.987-.06 4.043-.049 1.064-.218 1.791-.465 2.427a4.902 4.902 0 01-1.153 1.772 4.902 4.902 0 01-1.772 1.153c-.636.247-1.363.416-2.427.465-1.067.048-1.407.06-4.123.06h-.08c-2.643 0-2.987-.012-4.043-.06-1.064-.049-1.791-.218-2.427-.465a4.902 4.902 0 01-1.772-1.153 4.902 4.902 0 01-1.153-1.772c-.247-.636-.416-1.363-.465-2.427-.047-1.024-.06-1.379-.06-3.808v-.63c0-2.43.013-2.784.06-3.808.049-1.064.218-1.791.465-2.427a4.902 4.902 0 011.153-1.772A4.902 4.902 0 015.468 2.525c.636-.247 1.363-.416 2.427-.465C8.901 2.013 9.256 2 11.685 2h.63zm-.081 1.802h-.468c-2.456 0-2.784.011-3.807.058-.975.045-1.504.207-1.857.344-.467.182-.8.398-1.15.748-.35.35-.566.683-.748 1.15-.137.353-.3.882-.344 1.857-.047 1.023-.058 1.351-.058 3.807v.468c0 2.456.011 2.784.058 3.807.045.975.207 1.504.344 1.857.182.466.399.8.748 1.15.35.35.683.566 1.15.748.353.137.882.3 1.857.344 1.054.048 1.37.058 4.041.058h.08c2.597 0 2.917-.01 3.96-.058.976-.045 1.505-.207 1.858-.344.466-.182.8-.398 1.15-.748.35-.35.566-.683.748-1.15.137-.353.3-.882.344-1.857.048-1.055.058-1.37.058-4.041v-.08c0-2.597-.01-2.917-.058-3.96-.045-.976-.207-1.505-.344-1.858a3.097 3.097 0 00-.748-1.15 3.098 3.098 0 00-1.15-.748c-.353-.137-.882-.3-1.857-.344-1.023-.047-1.351-.058-3.807-.058zM12 6.865a5.135 5.135 0 110 10.27 5.135 5.135 0 010-10.27zm0 1.802a3.333 3.333 0 100 6.666 3.333 3.333 0 000-6.666zm5.338-3.205a1.2 1.2 0 110 2.4 1.2 1.2 0 010-2.4z" clipRule="evenodd" />
                                        </svg>
                                    </a>
                                    <a href="https://www.facebook.com/share/1ETijZE7iE/" target="_blank" rel="noopener noreferrer" className="w-8 h-8 bg-gray-700 rounded-full flex items-center justify-center hover:bg-blue-600 cursor-pointer transition-colors block">
                                        <svg className="w-4 h-4 text-white" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                                            <path d="M22 12c0-5.523-4.477-10-10-10S2 6.477 2 12c0 4.991 3.657 9.128 8.438 9.878v-6.987h-2.54V12h2.54V9.797c0-2.506 1.492-3.89 3.777-3.89 1.094 0 2.238.195 2.238.195v2.46h-1.26c-1.243 0-1.63.771-1.63 1.562V12h2.773l-.443 2.89h-2.33v6.988C18.343 21.128 22 16.991 22 12z"/>
                                        </svg>
                                    </a>
                                    <a href="https://youtube.com/@creditsbazaar_official?si=qb1TA8U71P9U-C8-" target="_blank" rel="noopener noreferrer" className="w-8 h-8 bg-gray-700 rounded-full flex items-center justify-center hover:bg-red-600 cursor-pointer transition-colors block">
                                        <svg className="w-4 h-4 text-white" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                                            <path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/>
                                        </svg>
                                    </a>
                                    <a href="https://www.linkedin.com/in/credit-bazaar-4b20483b8?utm_source=share_via&utm_content=profile&utm_medium=member_android" target="_blank" rel="noopener noreferrer" className="w-8 h-8 bg-gray-700 rounded-full flex items-center justify-center hover:bg-blue-700 cursor-pointer transition-colors block">
                                        <svg className="w-4 h-4 text-white" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                                            <path d="M19 0h-14c-2.761 0-5 2.239-5 5v14c0 2.761 2.239 5 5 5h14c2.762 0 5-2.239 5-5v-14c0-2.761-2.238-5-5-5zm-11 19h-3v-11h3v11zm-1.5-12.268c-.966 0-1.75-.79-1.75-1.764s.784-1.764 1.75-1.764 1.75.79 1.75 1.764-.783 1.764-1.75 1.764zm13.5 12.268h-3v-5.604c0-3.368-4-3.113-4 0v5.604h-3v-11h3v1.765c1.396-2.586 7-2.777 7 2.476v6.759z"/>
                                        </svg>
                                    </a>
                                    <a href="https://x.com/CreditsBazaar" target="_blank" rel="noopener noreferrer" className="w-8 h-8 bg-gray-700 rounded-full flex items-center justify-center hover:bg-black cursor-pointer transition-colors block">
                                        <svg className="w-4 h-4 text-white" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                                            <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>
                                        </svg>
                                    </a>
                                </li>
                            </ul>
                        </div>
                    </div>
                    <div className="border-t border-gray-700 mt-12 pt-8">
                        <div className="flex flex-wrap justify-center gap-x-8 gap-y-4 text-xs font-medium text-gray-400 mb-6 uppercase tracking-wide">
                            <a href="/privacy-policy" className="hover:text-white transition-colors duration-200">Privacy Policy</a>
                            <a href="/terms-condition" className="hover:text-white transition-colors duration-200">Terms & Conditions</a>
                            <a href="/disclaimer" className="hover:text-white transition-colors duration-200">Disclaimer</a>
                        </div>
                        <div className="text-center text-xs text-gray-600">
                            <p>&copy; 2026 Creditsbazaar.com. All Rights Reserved.</p>
                            <p className="mt-2">Disclaimer: All info provided is for informational purposes only.</p>
                        </div>
                    </div>
                </div>
            </footer>
        );

        const SectionHeading = ({ eyebrow, title }) => (
            <div className="mb-8 text-center max-w-2xl mx-auto">
                <span className="inline-block text-xs font-bold tracking-widest uppercase text-[#FF6F3C] mb-2">{eyebrow}</span>
                <h2 className="text-2xl md:text-3xl font-bold text-[#052F5F]">{title}</h2>
            </div>
        );

        const CheckIcon = () => (
            <svg className="w-5 h-5 text-green-500 flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M5 13l4 4L19 7" />
            </svg>
        );

        const DocIcon = () => (
            <svg className="w-5 h-5 text-blue-500 flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
            </svg>
        );

        const StarIcon = () => (
            <svg className="w-6 h-6 text-[#FF6F3C] flex-shrink-0" fill="currentColor" viewBox="0 0 20 20">
                <path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.915c.969 0 1.371 1.24.588 1.81l-3.976 2.888a1 1 0 00-.363 1.118l1.518 4.674c.3.922-.755 1.688-1.538 1.118l-3.976-2.888a1 1 0 00-1.176 0l-3.976 2.888c-.783.57-1.838-.196-1.538-1.118l1.518-4.674a1 1 0 00-.363-1.118L2.176 9.1c-.783-.57-.38-1.81.588-1.81h4.914a1 1 0 00.951-.69l1.519-4.674z" />
            </svg>
        );

        const InfoCallout = ({ heading, text }) => (
            <div className="bg-blue-50 border-l-4 border-blue-500 rounded-r-xl p-6 md:p-8">
                <h3 className="text-lg font-bold text-[#052F5F] mb-2">{heading}</h3>
                <p className="text-gray-700 leading-relaxed">{text}</p>
            </div>
        );

        const ComparisonTable = ({ heading, rows }) => (
            <div>
                <h3 className="text-lg font-bold text-[#052F5F] mb-4 text-center">{heading}</h3>
                <div className="overflow-x-auto rounded-xl border border-gray-200 shadow-sm">
                    <table className="w-full text-sm text-left">
                        <thead className="bg-[#052F5F] text-white">
                            <tr>
                                <th className="px-5 py-3 font-semibold">Feature</th>
                                <th className="px-5 py-3 font-semibold">Overdraft</th>
                                <th className="px-5 py-3 font-semibold">Loan</th>
                            </tr>
                        </thead>
                        <tbody>
                            {rows.map((row, idx) => (
                                <tr key={idx} className={idx % 2 === 0 ? "bg-white" : "bg-gray-50"}>
                                    <td className="px-5 py-3 font-semibold text-gray-700">{row.feature}</td>
                                    <td className="px-5 py-3 text-gray-600">{row.overdraft}</td>
                                    <td className="px-5 py-3 text-gray-600">{row.loan}</td>
                                </tr>
                            ))}
                        </tbody>
                    </table>
                </div>
            </div>
        );

        const ListCard = ({ title, items, icon, accent }) => (
            <div className="bg-white rounded-2xl shadow-md border border-gray-100 p-6 md:p-8 h-full">
                <h3 className={`text-lg font-bold mb-5 ${accent}`}>{title}</h3>
                <ul className="space-y-3">
                    {items.map((item, idx) => (
                        <li key={idx} className="flex items-start gap-3 text-gray-600 text-sm leading-relaxed">
                            {icon}
                            <span>{item}</span>
                        </li>
                    ))}
                </ul>
            </div>
        );

        const LoanDetails = ({ content, gallery, name }) => (
            <div className="space-y-16">
                {/* Intro */}
                <section className="grid grid-cols-1 lg:grid-cols-5 gap-10 items-center">
                    <div className="lg:col-span-3 space-y-5">
                        <span className="inline-block text-xs font-bold tracking-widest uppercase text-[#FF6F3C]">About {name}</span>
                        <h2 className="text-2xl md:text-3xl font-bold text-[#052F5F] leading-snug">What is a {name}?</h2>
                        <p className="text-gray-600 leading-relaxed">{content.intro}</p>
                    </div>
                    {gallery[0] && (
                        <div className="lg:col-span-2 rounded-2xl overflow-hidden shadow-xl">
                            <img src={`/static/${gallery[0]}`} alt={`${name} illustration`} className="w-full h-full object-cover" />
                        </div>
                    )}
                </section>

                {/* Interest rate + example */}
                <section className="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div className="bg-gradient-to-br from-[#052F5F] to-[#0a4a8f] text-white rounded-2xl p-6 md:p-8 flex flex-col justify-center">
                        <span className="text-xs font-bold tracking-widest uppercase text-orange-300 mb-2">Interest Rates</span>
                        <p className="leading-relaxed text-gray-100">{content.rate}</p>
                    </div>
                    {content.example ? (
                        <InfoCallout heading={content.example.heading} text={content.example.text} />
                    ) : (
                        gallery[1] && (
                            <div className="rounded-2xl overflow-hidden shadow-lg">
                                <img src={`/static/${gallery[1]}`} alt={`${name} details`} className="w-full h-full object-cover" />
                            </div>
                        )
                    )}
                </section>

                {/* Comparison table (overdraft only) */}
                {content.comparison_table && (
                    <section>
                        <ComparisonTable heading={content.comparison_table.heading} rows={content.comparison_table.rows} />
                    </section>
                )}

                {/* Eligibility, Documents, Benefits */}
                <section>
                    <SectionHeading eyebrow="Know Before You Apply" title={`Eligibility, Documents & Benefits`} />
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                        <ListCard title="Eligibility Criteria" items={content.eligibility} icon={<CheckIcon />} accent="text-[#052F5F]" />
                        <ListCard title="Documents Required" items={content.documents} icon={<DocIcon />} accent="text-[#052F5F]" />
                        <ListCard title="Key Benefits" items={content.benefits} icon={<StarIcon />} accent="text-[#052F5F]" />
                    </div>
                </section>

                {/* How to apply */}
                <section>
                    <SectionHeading eyebrow="Get Started" title={`How to Apply for a ${name}`} />
                    <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-4">
                        {content.apply_steps.map((step, idx) => (
                            <div key={idx} className="bg-white rounded-2xl shadow-md border border-gray-100 p-6 relative">
                                <div className="w-10 h-10 rounded-full bg-[#FF6F3C] text-white font-bold flex items-center justify-center mb-4">{idx + 1}</div>
                                <p className="text-sm text-gray-600 leading-relaxed">{step}</p>
                            </div>
                        ))}
                    </div>
                </section>

                {/* Gallery */}
                {gallery.length > 1 && (
                    <section>
                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-6">
                            {gallery.map((img, idx) => (
                                <div key={idx} className="rounded-2xl overflow-hidden shadow-lg">
                                    <img src={`/static/${img}`} alt={`${name} - ${idx + 1}`} className="w-full h-64 object-cover" />
                                </div>
                            ))}
                        </div>
                    </section>
                )}

                {/* Conclusion */}
                <section className="bg-white rounded-2xl shadow-md border border-gray-100 p-8 md:p-10 text-center max-w-3xl mx-auto">
                    <h3 className="text-xl font-bold text-[#052F5F] mb-3">In Summary</h3>
                    <p className="text-gray-600 leading-relaxed">{content.conclusion}</p>
                </section>
            </div>
        );

        const LoanTypePage = () => {
            return (
                <div className="min-h-screen flex flex-col bg-gray-50">
                    <Navbar />
                    <div className="bg-white py-12 md:py-16 border-b border-gray-100">
                        <div className="mx-2 md:mx-8 lg:mx-16 grid grid-cols-1 lg:grid-cols-2 gap-10 items-center">
                            <div>
                                <span className="inline-block text-xs font-bold tracking-widest uppercase text-[#FF6F3C] mb-3">Apply Now</span>
                                <h1 className="text-3xl md:text-4xl font-bold text-[#052F5F] leading-tight mb-4">{loanData.headline}</h1>
                                <p className="text-gray-600 leading-relaxed mb-6">{loanData.subtext}</p>
                                <LoanForm />
                            </div>
                            <div className="rounded-2xl overflow-hidden shadow-xl self-center">
                                <img src={`/static/${loanData.heroImage}`} alt={loanData.name} className="w-full h-full object-cover" />
                            </div>
                        </div>
                    </div>

                    <div className="py-16 px-4 md:px-8 lg:px-16">
                        <div className="max-w-6xl mx-auto">
                            <LoanDetails content={loanData.content} gallery={loanData.content.gallery || []} name={loanData.name} />
                        </div>
                    </div>

                    <Footer />
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<LoanTypePage />);
    </script>
    {% endraw %}
</body>

</html>
