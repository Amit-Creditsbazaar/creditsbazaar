<!DOCTYPE html>

<head>

    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

<body class="bg-gray-50">
    <div id="root"></div>

    {% raw %}
    <script type="text/babel">
        const { useState, useEffect } = React;

        const Navbar = () => {
            const menuItems = [
                { name: "Home", link: "/" },
                { name: "Loans", link: "/loans" },
                { name: "Credit Cards", link: "/creditcards" },
                { name: "Calculators", link: "/calculators" }

            return (
                <nav className="bg-white shadow-md sticky top-0 z-50">
                    <div className="mx-2 md:mx-8 lg:mx-16 py-3 flex items-center justify-between">
                        <div className="flex items-center">

                        </div>
                        <div className="flex items-center gap-4">
                            <div className="hidden lg:flex items-center gap-6">

                        </div>
                    </div>

        };

        const AboutHero = () => (
            <div className="bg-[#052F5F] text-white py-20 text-center relative overflow-hidden">
                <div className="absolute top-0 left-0 w-64 h-64 bg-blue-500 rounded-full mix-blend-multiply filter blur-3xl opacity-20 -translate-x-1/2 -translate-y-1/2"></div>
                <div className="absolute bottom-0 right-0 w-64 h-64 bg-purple-500 rounded-full mix-blend-multiply filter blur-3xl opacity-20 translate-x-1/2 translate-y-1/2"></div>

                <div className="relative z-10 mx-2 md:mx-8 lg:mx-16">
                    <h1 className="text-4xl md:text-6xl font-bold mb-6">About Us</h1>
                    <p className="text-xl md:text-2xl text-blue-100 max-w-3xl mx-auto leading-relaxed">
                        CreditsBazaar.com is a digital financial platform committed to helping individuals and businesses make informed, safe, and responsible borrowing decisions.
                    </p>
                </div>
            </div>
        );

        // Animated Counter Component - re-animates each time section comes into view
        const AnimatedCounter = ({ end, duration = 2000, suffix = "" }) => {
            const [count, setCount] = useState(0);
            const counterRef = React.useRef(null);
            const animationRef = React.useRef(null);

            useEffect(() => {
                const observer = new IntersectionObserver(
                    (entries) => {
                        if (entries[0].isIntersecting) {
                            // Cancel any ongoing animation
                            if (animationRef.current) {
                                cancelAnimationFrame(animationRef.current);
                            }
                            // Reset count and start fresh animation
                            setCount(0);
                            let startTime;
                            const animate = (currentTime) => {
                                if (!startTime) startTime = currentTime;
                                const progress = Math.min((currentTime - startTime) / duration, 1);
                                setCount(Math.floor(progress * end));
                                if (progress < 1) {
                                    animationRef.current = requestAnimationFrame(animate);
                                }
                            };
                            animationRef.current = requestAnimationFrame(animate);
                        } else {
                            // Reset count when leaving view so it animates again on next view
                            setCount(0);
                            if (animationRef.current) {
                                cancelAnimationFrame(animationRef.current);
                            }
                        }
                    },
                    { threshold: 0.5 }
                );
                if (counterRef.current) observer.observe(counterRef.current);
                return () => {
                    observer.disconnect();
                    if (animationRef.current) {
                        cancelAnimationFrame(animationRef.current);
                    }
                };
            }, [end, duration]);

            return <span ref={counterRef}>{count}{suffix}</span>;
        };

        const AboutContent = () => {
            return (
                <div className="py-16 bg-gradient-to-b from-white via-blue-50/30 to-white">
                    <div className="mx-2 md:mx-8 lg:mx-16 space-y-20">

                        {/* Intro Section with Image */}
                        <div className="grid md:grid-cols-2 gap-12 items-center">
                            <div className="space-y-6 order-2 md:order-1">
                                <div className="inline-block px-4 py-2 bg-blue-100 text-blue-700 rounded-full text-sm font-semibold mb-2">
                                    🎯 Our Mission
                                </div>
                                <h2 className="text-4xl font-bold text-[#052F5F] leading-tight">
                                    Empowering Your <span className="text-transparent bg-clip-text bg-gradient-to-r from-blue-600 to-purple-600">Financial Future</span>
                                </h2>
                                <p className="text-gray-600 leading-relaxed text-lg">
                                    In today's fast-moving financial environment, many people take loans due to urgency or immediate needs without fully understanding interest rates, EMIs, hidden charges, or long-term repayment impact. At CreditsBazaar.com, we aim to change this by putting <span className="font-semibold text-[#052F5F]">education and transparency first</span>.
                                </p>
                                <p className="text-gray-600 leading-relaxed text-lg">
                                    Our core belief is simple: <span className="font-bold text-transparent bg-clip-text bg-gradient-to-r from-blue-600 to-purple-600">an informed customer is a safe customer.</span> That is why our goal is to explain every detail clearly before you choose any lender.
                                </p>
                                <div className="flex flex-wrap gap-4 pt-4">
                                    <a href="/loans" className="inline-flex items-center gap-2 bg-gradient-to-r from-blue-600 to-blue-700 text-white px-6 py-3 rounded-xl font-semibold hover:from-blue-700 hover:to-blue-800 transition-all transform hover:scale-105 shadow-lg">

                                    </a>
                                </div>
                            </div>
                            <div className="order-1 md:order-2 relative">

                            <div className="relative bg-[#052F5F]/90 backdrop-blur-sm rounded-3xl p-8 md:p-12">
                                <div className="grid grid-cols-2 md:grid-cols-4 gap-8 text-center text-white">
                                    <div className="space-y-2">
                                        <div className="text-4xl md:text-5xl font-bold">
                                            <AnimatedCounter end={25} suffix="+" />
                                        </div>
                                        <p className="text-blue-200 text-sm md:text-base">Partner Banks & NBFCs</p>
                                    </div>
                                    <div className="space-y-2">
                                        <div className="text-4xl md:text-5xl font-bold">
                                            <AnimatedCounter end={20} suffix="+" />
                                        </div>
                                        <p className="text-blue-200 text-sm md:text-base">Happy Customers</p>
                                    </div>
                                    <div className="space-y-2">
                                        <div className="text-4xl md:text-5xl font-bold">
                                            ₹<AnimatedCounter end={300} suffix="Lakhs+" />
                                        </div>
                                        <p className="text-blue-200 text-sm md:text-base">Loans Disbursed</p>
                                    </div>
                                    <div className="space-y-2">
                                        <div className="text-4xl md:text-5xl font-bold">
                                            <AnimatedCounter end={98} suffix="%" />
                                        </div>
                                        <p className="text-blue-200 text-sm md:text-base">Customer Satisfaction</p>
                                    </div>
                                </div>
                            </div>
                        </div>

                        {/* Why Choose Us - Glassmorphism Cards */}
                        <div className="grid md:grid-cols-2 gap-12 items-center">
                            <div className="relative">
                                <div className="absolute -inset-4 bg-gradient-to-r from-purple-400 to-blue-500 rounded-3xl blur-2xl opacity-20"></div>
                                <img
                                    src="/static/about_team.png"
                                    alt="Our Expert Team"
                                    className="relative rounded-3xl shadow-2xl w-full object-cover hover:scale-[1.02] transition-transform duration-500"
                                />
                            </div>
                            <div className="space-y-6">
                                <div className="inline-block px-4 py-2 bg-purple-100 text-purple-700 rounded-full text-sm font-semibold mb-2">
                                    ✨ Why Choose Us
                                </div>
                                <h2 className="text-4xl font-bold text-[#052F5F] leading-tight">Your Trusted Financial Partner</h2>

                                        { icon: "🔍", title: "Smart Comparison", desc: "Compare loan options to find the best solution" },
                                        { icon: "🤝", title: "Expert Guidance", desc: "Focus on helping, not selling" },

                                                {item.icon}

                        {/* Our Services with Gradient Cards */}

                                {[
                                    { title: "Personal Loans", icon: "M17 9V7a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2m2 4h10a2 2 0 002-2v-6a2 2 0 00-2-2H9a2 2 0 00-2 2v6a2 2 0 002 2zm7-5a2 2 0 11-4 0 2 2 0 014 0z", gradient: "from-blue-500 to-blue-600" },

                                    { title: "Overdraft (OD)", icon: "M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z", gradient: "from-orange-500 to-orange-600" },
                                    { title: "Balance Transfer", icon: "M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4", gradient: "from-green-500 to-green-600" }

                                            </div>
                                            <h3 className="font-bold text-gray-800 group-hover:text-white transition-colors duration-500">{service.title}</h3>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>

                        {/* Technology Section */}
                        <div className="grid md:grid-cols-2 gap-12 items-center">
                            <div className="space-y-6 order-2 md:order-1">
                                <div className="inline-block px-4 py-2 bg-cyan-100 text-cyan-700 rounded-full text-sm font-semibold mb-2">
                                    🔐 Secure & Modern
                                </div>
                                <h2 className="text-4xl font-bold text-[#052F5F] leading-tight">Powered by Advanced Technology</h2>
                                <p className="text-gray-600 leading-relaxed text-lg">
                                    We leverage cutting-edge fintech solutions to provide you with a seamless, secure, and efficient borrowing experience. Our platform uses bank-grade encryption to protect your data.
                                </p>
                                <div className="grid grid-cols-2 gap-4">
                                    {[
                                        { icon: "🔒", text: "256-bit Encryption" },
                                        { icon: "⚡", text: "Instant Processing" },
                                        { icon: "📱", text: "Mobile Friendly" },
                                        { icon: "🔄", text: "Real-time Updates" }
                                    ].map((item, idx) => (
                                        <div key={idx} className="flex items-center gap-3 p-3 bg-white rounded-xl shadow-sm">

                            </div>
                            <div className="order-1 md:order-2 relative">
                                <div className="absolute -inset-4 bg-gradient-to-r from-cyan-400 to-blue-500 rounded-3xl blur-2xl opacity-20"></div>
                                <img
                                    src="/static/about_technology.png"
                                    alt="Secure Financial Technology"
                                    className="relative rounded-3xl shadow-2xl w-full object-cover hover:scale-[1.02] transition-transform duration-500"
                                />
                            </div>
                        </div>

                        {/* Our Features - Premium Cards */}
                        <div>

                                </div>
                                <h2 className="text-4xl font-bold text-[#052F5F] mb-4">What Sets Us Apart</h2>
                                <p className="text-gray-600 text-lg max-w-2xl mx-auto">Experience banking services reimagined with these exclusive features</p>
                            </div>
                            <div className="grid md:grid-cols-2 lg:grid-cols-3 gap-6">
                                {[
                                    { title: "Education-First Approach", desc: "We clearly explain interest rates, EMIs, repayment structure, and loan impact before application.", icon: "📚", color: "blue" },
                                    { title: "Transparent Interest Rates", desc: "No hidden charges. Complete clarity on pricing and terms.", icon: "💎", color: "purple" },
                                    { title: "Multiple Lender Comparison", desc: "Compare loan options from several private banks and NBFCs in one place.", icon: "📊", color: "green" },
                                    { title: "Personalized Loan Guidance", desc: "Loan recommendations based on customer income, eligibility, and requirements.", icon: "🎯", color: "orange" },

                                    { title: "Fast Approval & Direct Disbursal", desc: "Quick processing with direct bank disbursal to your account.", icon: "⚡", color: "amber" },
                                    { title: "Safe & Responsible Borrowing", desc: "Guidance focused on long-term financial safety, not short-term selling.", icon: "🛡️", color: "rose" }
                                ].map((feature, idx) => (
                                    <div key={idx} className={`group relative bg-white p-6 rounded-2xl border border-gray-100 hover:border-${feature.color}-200 hover:shadow-xl transition-all duration-300 hover:-translate-y-1 overflow-hidden`}>

                            </div>
                            <div className="relative text-white rounded-3xl p-8 md:p-16 text-center md:text-left">
                                <div className="grid md:grid-cols-2 gap-12">
                                    <div className="space-y-6">
                                        <div className="flex items-center gap-3 justify-center md:justify-start">
                                            <div className="w-12 h-12 bg-gradient-to-br from-[#FF6F3C] to-orange-500 rounded-xl flex items-center justify-center text-2xl">
                                                🔭

                                            To educate customers and promote responsible borrowing by creating a transparent, trustworthy, and customer-first financial marketplace.

        const FloatingContactWidget = ({ isOpen, setIsOpen, hasBeenClosed, setHasBeenClosed }) => {

            return (
                <div

                    style={{
                        transform: `translateY(-50%) translateX(${isOpen || !hasBeenClosed ? '0' : 'calc(100% - 40px)'})`
                    }}
                    onMouseEnter={() => hasBeenClosed && setIsOpen(true)}
                    onMouseLeave={() => hasBeenClosed && setIsOpen(false)}
                >
                    <div className="bg-gradient-to-br from-blue-600 to-blue-700 text-white rounded-l-2xl shadow-2xl overflow-hidden" style={{ width: '320px' }}>

                                    <div>
                                        <p className="text-xs text-gray-500 font-semibold">Customer Executive</p>

                                    <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"></path></svg>

                            <p className="text-xs text-blue-100 text-center">Call us for instant loan & credit card assistance</p>
                        </div>
                        {!isOpen && hasBeenClosed && (
                            <div className="absolute left-0 top-1/2 -translate-y-1/2 -translate-x-full bg-blue-600 text-white px-3 py-6 rounded-l-lg shadow-lg cursor-pointer">
                                <div className="flex flex-col items-center gap-2">
                                    <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"></path></svg>
                                    <span className="text-xs font-bold writing-mode-vertical transform rotate-180" style={{ writingMode: 'vertical-rl' }}>CONTACT</span>
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const Footer = ({ onContactClick }) => (
            <footer className="bg-[#1A202C] text-gray-400 py-12 text-sm">
                <div className="mx-2 md:mx-8 lg:mx-16">
                    <div className="grid grid-cols-2 md:grid-cols-4 gap-8 mb-8">
                        <div>
                            <h4 className="text-white font-bold mb-4 uppercase">Company</h4>
                            <ul className="space-y-2">
                                <li className="hover:text-white cursor-pointer"><a href="/about">About Us</a></li>
                                <li className="hover:text-white cursor-pointer">Partners</li>
                                <li className="hover:text-white cursor-pointer">Careers</li>
                                <li className="hover:text-white cursor-pointer" onClick={onContactClick}>Contact Us</li>
                            </ul>
                        </div>
                        <div>
                            <h4 className="text-white font-bold mb-4 uppercase">Services</h4>
                            <ul className="space-y-2">
                                <li className="hover:text-white cursor-pointer">Personal Loan</li>
                                <li className="hover:text-white cursor-pointer">Credit Card</li>
                                <li className="hover:text-white cursor-pointer">Mutual Funds</li>
                                <li className="hover:text-white cursor-pointer">Credit Score</li>
                            </ul>
                        </div>
                        <div>
                            <h4 className="text-white font-bold mb-4 uppercase">Resources</h4>
                            <ul className="space-y-2">
                                <li className="hover:text-white cursor-pointer">Financial Tools</li>
                                <li className="hover:text-white cursor-pointer">Blogs</li>
                                <li className="hover:text-white cursor-pointer">FAQs</li>
                                <li className="hover:text-white cursor-pointer">Glossary</li>
                            </ul>
                        </div>
                        <div>
                            <h4 className="text-white font-bold mb-4 uppercase">Contact</h4>
                            <ul className="space-y-2">
                                <li>amit@creditsbazaar.com</li>
                                <li>9625835453</li>
                                <li className="mt-4 flex gap-4">
                                    <span className="w-8 h-8 bg-gray-700 rounded-full flex items-center justify-center hover:bg-blue-600 cursor-pointer">f</span>
                                    <span className="w-8 h-8 bg-gray-700 rounded-full flex items-center justify-center hover:bg-blue-400 cursor-pointer">t</span>
                                    <span className="w-8 h-8 bg-gray-700 rounded-full flex items-center justify-center hover:bg-pink-600 cursor-pointer">i</span>
                                </li>
                            </ul>
                        </div>
                    </div>
                    <div className="border-t border-gray-700 pt-8 text-center text-xs">
                        <p>&copy; 2026 Creditsbazaar.com. All Rights Reserved.</p>
                        <p className="mt-2">Disclaimer: All info provided is for informational purposes only.</p>
                    </div>
                </div>
            </footer>
        );

        function App() {
            const [isContactOpen, setIsContactOpen] = useState(true);
            const [contactHasBeenClosed, setContactHasBeenClosed] = useState(false);

            useEffect(() => {
                let timer;
                if (isContactOpen) {
                    timer = setTimeout(() => {
                        setIsContactOpen(false);
                        setContactHasBeenClosed(true);
                    }, 5000);
                }
                return () => clearTimeout(timer);
            }, [isContactOpen]);

            const handleTalkToExpert = () => {
                setIsContactOpen(true);
            };

            return (
                <div className="font-sans text-gray-800 bg-gray-50 min-h-screen pb-0">
                    <Navbar />
                    <AboutHero />
                    <AboutContent />
                    <Footer onContactClick={handleTalkToExpert} />
                    <FloatingContactWidget
                        isOpen={isContactOpen}
                        setIsOpen={setIsContactOpen}
                        hasBeenClosed={contactHasBeenClosed}
                        setHasBeenClosed={setContactHasBeenClosed}
                    />
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
    {% endraw %}
</body>

</html>
