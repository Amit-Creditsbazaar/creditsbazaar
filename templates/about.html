<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About Us - CreditBazaar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Open Sans', sans-serif;
        }
    </style>
</head>

<body class="bg-gray-50">
    <div id="root"></div>

    {% raw %}
    <script type="text/babel">
        const { useState, useEffect } = React;

        const Navbar = () => {
            const menuItems = [
                { name: "Home", link: "/" },
                { name: "Loans", link: "/loans" },
                { name: "Credit Cards", link: "/creditcards" },
                { name: "Calculators", link: "/calculators" }
            ];

            return (
                <nav className="bg-white shadow-md sticky top-0 z-50">
                    <div className="mx-2 md:mx-8 lg:mx-16 py-3 flex items-center justify-between">
                        <div className="flex items-center">
                            <a href="/" className="flex items-center gap-2">
                                <img src="/static/logo.png" alt="CreditBazaar" className="h-16" />
                            </a>
                        </div>
                        <div className="flex items-center gap-4">
                            <div className="hidden lg:flex items-center gap-6">
                                {menuItems.map((item) => (
                                    <a key={item.name} href={item.link} className="font-semibold text-sm cursor-pointer text-gray-700 hover:text-blue-600 flex items-center gap-1 transition-colors">
                                        {item.name}
                                    </a>
                                ))}
                            </div>
                            <button className="text-blue-600 font-bold text-sm border border-blue-600 px-5 py-2 rounded hover:bg-blue-50 transition">
                                Sign In
                            </button>
                        </div>
                    </div>
                </nav>
            );
        };

        const AboutHero = () => (
            <div className="bg-[#052F5F] text-white py-20 text-center relative overflow-hidden">
                <div className="absolute top-0 left-0 w-64 h-64 bg-blue-500 rounded-full mix-blend-multiply filter blur-3xl opacity-20 -translate-x-1/2 -translate-y-1/2"></div>
                <div className="absolute bottom-0 right-0 w-64 h-64 bg-purple-500 rounded-full mix-blend-multiply filter blur-3xl opacity-20 translate-x-1/2 translate-y-1/2"></div>

                <div className="relative z-10 mx-2 md:mx-8 lg:mx-16">
                    <h1 className="text-4xl md:text-6xl font-bold mb-6">About Us</h1>
                    <p className="text-xl md:text-2xl text-blue-100 max-w-3xl mx-auto leading-relaxed">
                        CreditsBazaar.com is a digital financial platform committed to helping individuals and businesses make informed, safe, and responsible borrowing decisions.
                    </p>
                </div>
            </div>
        );

        const AboutContent = () => {
            return (
                <div className="py-16 bg-white">
                    <div className="mx-2 md:mx-8 lg:mx-16 space-y-16">

                        {/* Intro Section */}
                        <div className="grid md:grid-cols-2 gap-12 items-center">
                            <div className="space-y-6">
                                <h2 className="text-3xl font-bold text-[#052F5F] leading-tight">Empowering Financial Decisions</h2>
                                <p className="text-gray-600 leading-relaxed text-lg">
                                    In today’s fast-moving financial environment, many people take loans due to urgency or immediate needs without fully understanding interest rates, EMIs, hidden charges, or long-term repayment impact. At CreditsBazaar.com, we aim to change this by putting education and transparency first.
                                </p>
                                <p className="text-gray-600 leading-relaxed text-lg">
                                    Our core belief is simple: <span className="font-bold text-blue-600">an informed customer is a safe customer.</span> That is why our goal is to explain every detail clearly before you choose any lender.
                                </p>
                            </div>
                            <div className="bg-blue-50 rounded-2xl p-8 shadow-inner">
                                <h3 className="text-xl font-bold text-[#052F5F] mb-4">Why Choose Us?</h3>
                                <ul className="space-y-4">
                                    <li className="flex gap-3">
                                        <svg className="w-6 h-6 text-green-500 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 13l4 4L19 7"></path></svg>
                                        <span className="text-gray-700">Connected with multiple private banks and NBFCs</span>
                                    </li>
                                    <li className="flex gap-3">
                                        <svg className="w-6 h-6 text-green-500 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 13l4 4L19 7"></path></svg>
                                        <span className="text-gray-700">Compare loan options for the suitable solution</span>
                                    </li>
                                    <li className="flex gap-3">
                                        <svg className="w-6 h-6 text-green-500 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 13l4 4L19 7"></path></svg>
                                        <span className="text-gray-700">Focus on guidance—not pressure</span>
                                    </li>
                                    <li className="flex gap-3">
                                        <svg className="w-6 h-6 text-green-500 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 13l4 4L19 7"></path></svg>
                                        <span className="text-gray-700">Support for long-term financial stability</span>
                                    </li>
                                </ul>
                            </div>
                        </div>

                        {/* Our Services */}
                        <div className="text-center">
                            <h2 className="text-3xl font-bold text-gray-800 mb-8">Our Services</h2>
                            <div className="grid grid-cols-2 md:grid-cols-4 gap-6">
                                {[
                                    { title: "Personal Loans", icon: "M17 9V7a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2m2 4h10a2 2 0 002-2v-6a2 2 0 00-2-2H9a2 2 0 00-2 2v6a2 2 0 002 2zm7-5a2 2 0 11-4 0 2 2 0 014 0z" },
                                    { title: "Business Loans", icon: "M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4" },
                                    { title: "Overdraft (OD)", icon: "M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z" },
                                    { title: "Balance Transfer", icon: "M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4" }
                                ].map((service, idx) => (
                                    <div key={idx} className="bg-gray-50 p-6 rounded-xl hover:shadow-md transition">
                                        <div className="w-12 h-12 bg-blue-100 rounded-full flex items-center justify-center mx-auto mb-4 text-blue-600">
                                            <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d={service.icon}></path></svg>
                                        </div>
                                        <h3 className="font-bold text-gray-800">{service.title}</h3>
                                    </div>
                                ))}
                            </div>
                        </div>

                        {/* Our Features */}
                        <div>
                            <h2 className="text-3xl font-bold text-gray-800 mb-10 text-center">Our Features</h2>
                            <div className="grid md:grid-cols-2 lg:grid-cols-3 gap-8">
                                {[
                                    { title: "Education-First Approach", desc: "We clearly explain interest rates, EMIs, repayment structure, and loan impact before application." },
                                    { title: "Transparent Interest Rates", desc: "No hidden charges. Complete clarity on pricing and terms." },
                                    { title: "Multiple Lender Comparison", desc: "Compare loan options from several private banks and NBFCs in one place." },
                                    { title: "Personalized Loan Guidance", desc: "Loan recommendations based on customer income, eligibility, and requirements." },
                                    { title: "Simple Online Process", desc: "Easy digital application with minimal documentation." },
                                    { title: "Fast Approval & Direct Disbursal", desc: "Quick processing with direct bank disbursal to your account." },
                                    { title: "Safe & Responsible Borrowing", desc: "Guidance focused on long-term financial safety, not short-term selling." }
                                ].map((feature, idx) => (
                                    <div key={idx} className="border border-gray-100 p-6 rounded-xl hover:border-blue-100 hover:shadow-md transition bg-white">
                                        <h3 className="font-bold text-[#052F5F] mb-2">{feature.title}</h3>
                                        <p className="text-gray-600 text-sm">{feature.desc}</p>
                                    </div>
                                ))}
                            </div>
                        </div>

                        {/* Vision & Commitment */}
                        <div className="bg-[#052F5F] text-white rounded-3xl p-8 md:p-12 text-center md:text-left">
                            <div className="grid md:grid-cols-2 gap-12">
                                <div>
                                    <h2 className="text-2xl font-bold mb-4 flex items-center gap-2">
                                        <span className="w-8 h-1 bg-[#FF6F3C] rounded-full"></span> OUR VISION
                                    </h2>
                                    <p className="text-blue-100 text-lg leading-relaxed">
                                        To educate customers and promote responsible borrowing by creating a transparent, trustworthy, and customer-first financial marketplace.
                                    </p>
                                </div>
                                <div>
                                    <h2 className="text-2xl font-bold mb-4 flex items-center gap-2">
                                        <span className="w-8 h-1 bg-[#FF6F3C] rounded-full"></span> OUR COMMITMENT
                                    </h2>
                                    <p className="text-blue-100 text-lg leading-relaxed space-y-2">
                                        At CreditsBazaar.com, education comes before selling.
                                    </p>
                                    <p className="text-blue-200 mt-2">
                                        We are committed to helping customers understand every aspect of a loan so they can borrow confidently and responsibly.
                                    </p>
                                </div>
                            </div>
                        </div>

                    </div>
                </div>
            );
        };

        const FloatingContactWidget = ({ isOpen, setIsOpen, hasBeenClosed, setHasBeenClosed }) => {
            const handleClose = () => {
                setIsOpen(false);
                setHasBeenClosed(true);
            };

            return (
                <div
                    className="fixed right-0 top-1/2 -translate-y-1/2 z-50 transition-all duration-500 ease-in-out"
                    style={{
                        transform: `translateY(-50%) translateX(${isOpen || !hasBeenClosed ? '0' : 'calc(100% - 40px)'})`
                    }}
                    onMouseEnter={() => hasBeenClosed && setIsOpen(true)}
                    onMouseLeave={() => hasBeenClosed && setIsOpen(false)}
                >
                    <div className="bg-gradient-to-br from-blue-600 to-blue-700 text-white rounded-l-2xl shadow-2xl overflow-hidden" style={{ width: '320px' }}>
                        <div className="bg-blue-800 px-6 py-4 flex items-center justify-between">
                            <div className="flex items-center gap-3">
                                <div className="w-10 h-10 bg-white rounded-full flex items-center justify-center">
                                    <svg className="w-6 h-6 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"></path></svg>
                                </div>
                                <div>
                                    <h3 className="font-bold text-sm">Need Help?</h3>
                                    <p className="text-xs text-blue-100">Talk to Expert</p>
                                </div>
                            </div>
                            {hasBeenClosed && (
                                <button onClick={handleClose} className="text-white hover:text-blue-200 transition">
                                    <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                                </button>
                            )}
                        </div>
                        <div className="px-6 py-6">
                            <p className="text-sm mb-4 text-blue-50">Get instant assistance from our customer executives. We're here to help!</p>
                            <div className="bg-white rounded-xl p-4 mb-4">
                                <div className="flex items-center gap-3 mb-3">
                                    <div className="w-12 h-12 bg-blue-100 rounded-full flex items-center justify-center">
                                        <svg className="w-6 h-6 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                                    </div>
                                    <div>
                                        <p className="text-xs text-gray-500 font-semibold">Customer Executive</p>
                                        <p className="text-sm text-gray-800 font-bold">Available 24/7</p>
                                    </div>
                                </div>
                                <a href="tel:9625835453" className="flex items-center justify-center gap-2 bg-gradient-to-r from-blue-600 to-blue-700 text-white font-bold py-3 px-4 rounded-lg hover:from-blue-700 hover:to-blue-800 transition shadow-lg transform hover:scale-105 no-underline">
                                    <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"></path></svg>
                                    9625835453
                                </a>
                            </div>
                            <p className="text-xs text-blue-100 text-center">Call us for instant loan & credit card assistance</p>
                        </div>
                        {!isOpen && hasBeenClosed && (
                            <div className="absolute left-0 top-1/2 -translate-y-1/2 -translate-x-full bg-blue-600 text-white px-3 py-6 rounded-l-lg shadow-lg cursor-pointer">
                                <div className="flex flex-col items-center gap-2">
                                    <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"></path></svg>
                                    <span className="text-xs font-bold writing-mode-vertical transform rotate-180" style={{ writingMode: 'vertical-rl' }}>CONTACT</span>
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const Footer = ({ onContactClick }) => (
            <footer className="bg-[#1A202C] text-gray-400 py-12 text-sm">
                <div className="mx-2 md:mx-8 lg:mx-16">
                    <div className="grid grid-cols-2 md:grid-cols-4 gap-8 mb-8">
                        <div>
                            <h4 className="text-white font-bold mb-4 uppercase">Company</h4>
                            <ul className="space-y-2">
                                <li className="hover:text-white cursor-pointer"><a href="/about">About Us</a></li>
                                <li className="hover:text-white cursor-pointer">Partners</li>
                                <li className="hover:text-white cursor-pointer">Careers</li>
                                <li className="hover:text-white cursor-pointer" onClick={onContactClick}>Contact Us</li>
                            </ul>
                        </div>
                        <div>
                            <h4 className="text-white font-bold mb-4 uppercase">Services</h4>
                            <ul className="space-y-2">
                                <li className="hover:text-white cursor-pointer">Personal Loan</li>
                                <li className="hover:text-white cursor-pointer">Credit Card</li>
                                <li className="hover:text-white cursor-pointer">Mutual Funds</li>
                                <li className="hover:text-white cursor-pointer">Credit Score</li>
                            </ul>
                        </div>
                        <div>
                            <h4 className="text-white font-bold mb-4 uppercase">Resources</h4>
                            <ul className="space-y-2">
                                <li className="hover:text-white cursor-pointer">Financial Tools</li>
                                <li className="hover:text-white cursor-pointer">Blogs</li>
                                <li className="hover:text-white cursor-pointer">FAQs</li>
                                <li className="hover:text-white cursor-pointer">Glossary</li>
                            </ul>
                        </div>
                        <div>
                            <h4 className="text-white font-bold mb-4 uppercase">Contact</h4>
                            <ul className="space-y-2">
                                <li>support@paisabazaar.com</li>
                                <li>9625835453</li>
                                <li className="mt-4 flex gap-4">
                                    <span className="w-8 h-8 bg-gray-700 rounded-full flex items-center justify-center hover:bg-blue-600 cursor-pointer">f</span>
                                    <span className="w-8 h-8 bg-gray-700 rounded-full flex items-center justify-center hover:bg-blue-400 cursor-pointer">t</span>
                                    <span className="w-8 h-8 bg-gray-700 rounded-full flex items-center justify-center hover:bg-pink-600 cursor-pointer">i</span>
                                </li>
                            </ul>
                        </div>
                    </div>
                    <div className="border-t border-gray-700 pt-8 text-center text-xs">
                        <p>&copy; 2026 Paisabazaar.com. All Rights Reserved.</p>
                        <p className="mt-2">Disclaimer: All info provided is for informational purposes only.</p>
                    </div>
                </div>
            </footer>
        );

        function App() {
            const [isContactOpen, setIsContactOpen] = useState(true);
            const [contactHasBeenClosed, setContactHasBeenClosed] = useState(false);

            useEffect(() => {
                let timer;
                if (isContactOpen) {
                    timer = setTimeout(() => {
                        setIsContactOpen(false);
                        setContactHasBeenClosed(true);
                    }, 5000);
                }
                return () => clearTimeout(timer);
            }, [isContactOpen]);

            const handleTalkToExpert = () => {
                setIsContactOpen(true);
            };

            return (
                <div className="font-sans text-gray-800 bg-gray-50 min-h-screen pb-0">
                    <Navbar />
                    <AboutHero />
                    <AboutContent />
                    <Footer onContactClick={handleTalkToExpert} />
                    <FloatingContactWidget
                        isOpen={isContactOpen}
                        setIsOpen={setIsContactOpen}
                        hasBeenClosed={contactHasBeenClosed}
                        setHasBeenClosed={setContactHasBeenClosed}
                    />
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
    {% endraw %}
</body>

</html>
