<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loan Calculators - Financial Planning Tools</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Open Sans', sans-serif;
        }

        @keyframes gradient {
            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }
        }

        .animate-gradient {
            background-size: 200% 200%;
            animation: gradient 8s ease infinite;
        }

        .glass-effect {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        /* Custom range slider styles */
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            cursor: pointer;
            box-shadow: 0 3px 10px rgba(102, 126, 234, 0.4);
            transition: all 0.2s;
        }

        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.15);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.6);
        }

        input[type="range"]::-moz-range-thumb {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            cursor: pointer;
            border: none;
            box-shadow: 0 3px 10px rgba(102, 126, 234, 0.4);
        }

        input[type="range"]::-webkit-slider-runnable-track {
            height: 6px;
            border-radius: 3px;
            background: linear-gradient(to right, #667eea 0%, var(--track-percent), #e2e8f0 var(--track-percent));
        }

        input[type="range"]::-moz-range-track {
            height: 6px;
            border-radius: 3px;
            background: #e2e8f0;
        }

        input[type="range"]::-moz-range-progress {
            height: 6px;
            border-radius: 3px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .stat-card {
            transition: all 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
        }

        .tab-button.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .currency-symbol {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
    </style>
</head>

<body>
    <div id="root"></div>

    {% raw %}
    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const Logo = () => (
            <div className="flex items-center">
                <img src="/static/logo.png" alt="CreditBazaar" className="h-16" />
            </div>
        );

        const Navbar = () => {
            const menuItems = [
                { name: "Home", link: "/" },
                { name: "Loans", link: "/loans" },
                { name: "Credit Cards", link: "/creditcards" },
                { name: "Calculators", link: "/calculators" }
            ];
            return (
                <nav className="bg-white shadow-md sticky top-0 z-50">
                    <div className="mx-2 md:mx-8 lg:mx-16 py-3 flex items-center justify-between">
                        <Logo />
                        <div className="flex items-center gap-4">
                            <div className="hidden lg:flex items-center gap-6">
                                {menuItems.map((item) => (
                                    <a key={item.name} href={item.link} className={`font-semibold text-sm cursor-pointer flex items-center gap-1 transition-colors ${item.name === "Calculators" ? "text-blue-600" : "text-gray-700 hover:text-blue-600"}`}>
                                        {item.name}
                                    </a>
                                ))}
                            </div>

                        </div>
                    </div>
                </nav>
            );
        };

        const Hero = () => (
            <div className="relative overflow-hidden bg-gradient-to-br from-indigo-50 via-purple-50 to-pink-50 py-16">
                <div className="absolute inset-0 opacity-10">
                    <div className="absolute top-0 left-0 w-96 h-96 bg-purple-500 rounded-full mix-blend-multiply filter blur-3xl animate-pulse"></div>
                    <div className="absolute top-0 right-0 w-96 h-96 bg-blue-500 rounded-full mix-blend-multiply filter blur-3xl animate-pulse animation-delay-2000"></div>
                    <div className="absolute bottom-0 left-1/2 w-96 h-96 bg-pink-500 rounded-full mix-blend-multiply filter blur-3xl animate-pulse animation-delay-4000"></div>
                </div>

                <div className="mx-2 md:mx-8 lg:mx-16 relative z-10">
                    <div className="text-center max-w-4xl mx-auto">
                        <div className="inline-block mb-4">
                        </div>
                        <h1 className="text-4xl md:text-6xl font-extrabold text-gray-900 leading-tight mb-6">
                            Smart <span className="bg-gradient-to-r from-purple-600 to-blue-600 bg-clip-text text-transparent">Calculators</span> for Better Decisions
                        </h1>
                        <p className="text-gray-600 text-lg md:text-xl max-w-2xl mx-auto leading-relaxed mb-8">
                            Plan your financial future with precision. Calculate EMIs, compare loan options, and make informed decisions.
                        </p>
                        <div className="flex flex-wrap justify-center gap-6 text-sm text-gray-600">
                            <div className="flex items-center gap-2 bg-white px-4 py-2 rounded-full shadow-sm">
                                <svg className="w-5 h-5 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 13l4 4L19 7"></path>
                                </svg>
                                <span className="font-semibold">100% Accurate</span>
                            </div>
                            <div className="flex items-center gap-2 bg-white px-4 py-2 rounded-full shadow-sm">
                                <svg className="w-5 h-5 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 13l4 4L19 7"></path>
                                </svg>
                                <span className="font-semibold">Real-time Results</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        );

        const LoanCalculator = () => {
            const [activeTab, setActiveTab] = useState('home');
            const chartRef = useRef(null);
            const chartInstance = useRef(null);

            // Home Loan States
            const [homeLoanAmount, setHomeLoanAmount] = useState(5000000);
            const [homeInterestRate, setHomeInterestRate] = useState(9);
            const [homeTenure, setHomeTenure] = useState(20);
            const [homeTenureType, setHomeTenureType] = useState('year');

            // Local tenure input state
            const [homeTenureInput, setHomeTenureInput] = useState(20);

            // Personal Loan States
            const [personalLoanAmount, setPersonalLoanAmount] = useState(500000);
            const [personalInterestRate, setPersonalInterestRate] = useState(12);
            const [personalTenure, setPersonalTenure] = useState(3);
            const [personalTenureType, setPersonalTenureType] = useState('year');

            // Local tenure input state
            const [personalTenureInput, setPersonalTenureInput] = useState(3);

            const calculateEMI = (principal, rate, tenure, tenureType) => {
                const tenureInMonths = tenureType === 'year' ? tenure * 12 : tenure;
                const monthlyRate = rate / 12 / 100;

                if (monthlyRate === 0) {
                    return {
                        emi: principal / tenureInMonths,
                        totalInterest: 0,
                        totalPayment: principal
                    };
                }

                const emi = (principal * monthlyRate * Math.pow(1 + monthlyRate, tenureInMonths)) /
                    (Math.pow(1 + monthlyRate, tenureInMonths) - 1);
                const totalPayment = emi * tenureInMonths;
                const totalInterest = totalPayment - principal;

                return {
                    emi: Math.round(emi),
                    totalInterest: Math.round(totalInterest),
                    totalPayment: Math.round(totalPayment)
                };
            };

            const homeResults = calculateEMI(homeLoanAmount, homeInterestRate, homeTenure, homeTenureType);
            const personalResults = calculateEMI(personalLoanAmount, personalInterestRate, personalTenure, personalTenureType);

            const results = activeTab === 'home' ? homeResults : personalResults;
            const loanAmount = activeTab === 'home' ? homeLoanAmount : personalLoanAmount;

            const formatCurrency = (amount) => {
                return new Intl.NumberFormat('en-IN', {
                    style: 'currency',
                    currency: 'INR',
                    maximumFractionDigits: 0
                }).format(amount);
            };

            const formatNumber = (num) => {
                return new Intl.NumberFormat('en-IN').format(num);
            };

            useEffect(() => {
                const ctx = chartRef.current.getContext('2d');

                if (chartInstance.current) {
                    chartInstance.current.destroy();
                }

                const principalPercentage = ((loanAmount / results.totalPayment) * 100).toFixed(1);
                const interestPercentage = ((results.totalInterest / results.totalPayment) * 100).toFixed(1);

                chartInstance.current = new Chart(ctx, {
                    type: 'doughnut',
                    data: {
                        labels: ['Principal Amount', 'Total Interest'],
                        datasets: [{
                            data: [loanAmount, results.totalInterest],
                            backgroundColor: [
                                'rgba(102, 126, 234, 0.9)',
                                'rgba(251, 146, 60, 0.9)'
                            ],
                            borderWidth: 0,
                            hoverOffset: 10
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: true,
                        plugins: {
                            legend: {
                                display: false
                            },
                            tooltip: {
                                backgroundColor: 'rgba(0, 0, 0, 0.8)',
                                padding: 12,
                                titleFont: { size: 14, weight: 'bold' },
                                bodyFont: { size: 13 },
                                callbacks: {
                                    label: function (context) {
                                        const label = context.label || '';
                                        const value = formatCurrency(context.parsed);
                                        const percentage = context.dataIndex === 0 ? principalPercentage : interestPercentage;
                                        return `${label}: ${value} (${percentage}%)`;
                                    }
                                }
                            }
                        },
                        cutout: '70%'
                    }
                });

                return () => {
                    if (chartInstance.current) {
                        chartInstance.current.destroy();
                    }
                };
            }, [activeTab, homeLoanAmount, homeInterestRate, homeTenure, homeTenureType,
                personalLoanAmount, personalInterestRate, personalTenure, personalTenureType]);

            const SliderInput = ({ label, value, onChange, min, max, step, suffix, icon }) => {
                const [inputValue, setInputValue] = useState(value);

                // Update local state when parent value changes (e.g., slider movement or tab change)
                useEffect(() => {
                    setInputValue(value);
                }, [value]);

                const handleBlur = () => {
                    const numValue = parseFloat(inputValue) || 0;
                    const clampedValue = Math.min(max, Math.max(min, numValue));
                    setInputValue(clampedValue);
                    onChange(clampedValue);
                };

                const handleKeyPress = (e) => {
                    if (e.key === 'Enter') {
                        handleBlur();
                        e.target.blur();
                    }
                };

                return (
                    <div className="space-y-3">
                        <div className="flex items-center justify-between">
                            <label className="text-sm font-semibold text-gray-700 flex items-center gap-2">
                                {icon}
                                {label}
                            </label>
                            <div className="flex items-center gap-2">
                                <input
                                    type="text"
                                    value={inputValue}
                                    onChange={(e) => setInputValue(e.target.value)}
                                    onBlur={handleBlur}
                                    onKeyPress={handleKeyPress}
                                    className="w-32 px-3 py-2 text-right font-bold text-gray-800 bg-white border-2 border-gray-200 rounded-lg focus:border-purple-500 focus:ring-2 focus:ring-purple-200 outline-none transition"
                                />
                                <span className="text-sm font-semibold text-gray-500 w-8">{suffix}</span>
                            </div>
                        </div>
                        <input
                            type="range"
                            min={min}
                            max={max}
                            step={step}
                            value={value}
                            onChange={(e) => onChange(parseFloat(e.target.value))}
                            className="w-full h-2 rounded-lg appearance-none cursor-pointer"
                            style={{
                                '--track-percent': `${((value - min) / (max - min)) * 100}%`
                            }}
                        />
                        <div className="flex justify-between text-xs text-gray-400 font-medium">
                            <span>{formatNumber(min)}</span>
                            <span>{formatNumber(max)}</span>
                        </div>
                    </div>
                );
            };

            const currentLoanAmount = activeTab === 'home' ? homeLoanAmount : personalLoanAmount;
            const currentInterestRate = activeTab === 'home' ? homeInterestRate : personalInterestRate;
            const currentTenure = activeTab === 'home' ? homeTenure : personalTenure;
            const currentTenureType = activeTab === 'home' ? homeTenureType : personalTenureType;
            const currentTenureInput = activeTab === 'home' ? homeTenureInput : personalTenureInput;
            const setCurrentLoanAmount = activeTab === 'home' ? setHomeLoanAmount : setPersonalLoanAmount;
            const setCurrentInterestRate = activeTab === 'home' ? setHomeInterestRate : setPersonalInterestRate;
            const setCurrentTenure = activeTab === 'home' ? setHomeTenure : setPersonalTenure;
            const setCurrentTenureType = activeTab === 'home' ? setHomeTenureType : setPersonalTenureType;
            const setCurrentTenureInput = activeTab === 'home' ? setHomeTenureInput : setPersonalTenureInput;

            // Sync tenure input with tenure value when slider changes or tab changes
            useEffect(() => {
                setCurrentTenureInput(currentTenure);
            }, [currentTenure, activeTab]);

            const loanAmountConfig = activeTab === 'home'
                ? { min: 100000, max: 20000000, step: 100000 }
                : { min: 50000, max: 5000000, step: 10000 };

            const interestRateConfig = activeTab === 'home'
                ? { min: 6, max: 15, step: 0.1 }
                : { min: 10, max: 24, step: 0.1 };

            const tenureConfig = currentTenureType === 'year'
                ? (activeTab === 'home' ? { min: 1, max: 30, step: 1 } : { min: 1, max: 7, step: 1 })
                : (activeTab === 'home' ? { min: 12, max: 360, step: 1 } : { min: 6, max: 84, step: 1 });

            return (
                <div className="pt-8 pb-20 bg-gradient-to-b from-gray-50 to-white">
                    <div className="mx-2 md:mx-8 lg:mx-16">
                        {/* Tab Buttons */}
                        <div className="flex justify-center mb-10">
                            <div className="inline-flex bg-white rounded-2xl p-2 shadow-lg border border-gray-100">
                                <button
                                    onClick={() => setActiveTab('home')}
                                    className={`tab-button px-8 py-4 rounded-xl font-bold text-sm transition-all duration-300 flex items-center gap-3 ${activeTab === 'home' ? 'active' : 'text-gray-600 hover:bg-gray-50'}`}
                                >
                                    <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path>
                                    </svg>
                                    Home Loan
                                </button>
                                <button
                                    onClick={() => setActiveTab('personal')}
                                    className={`tab-button px-8 py-4 rounded-xl font-bold text-sm transition-all duration-300 flex items-center gap-3 ${activeTab === 'personal' ? 'active' : 'text-gray-600 hover:bg-gray-50'}`}
                                >
                                    <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                                    </svg>
                                    Personal Loan
                                </button>
                            </div>
                        </div>

                        {/* Calculator Card */}
                        <div className="max-w-7xl mx-auto bg-white rounded-3xl shadow-2xl overflow-hidden border border-gray-100">
                            <div className="bg-gradient-to-r from-purple-600 to-blue-600 p-8 text-white">
                                <h2 className="text-3xl font-bold mb-2">
                                    {activeTab === 'home' ? 'Home Loan Calculator' : 'Personal Loan Calculator'}
                                </h2>
                                <p className="text-purple-100">
                                    {activeTab === 'home'
                                        ? 'Calculate your monthly EMI for your dream home'
                                        : 'Plan your personal loan with accurate EMI calculations'}
                                </p>
                            </div>

                            <div className="p-8 md:p-12">
                                <div className="grid grid-cols-1 lg:grid-cols-2 gap-12">
                                    {/* Left Column - Input Controls */}
                                    <div className="space-y-8">
                                        <SliderInput
                                            label="Loan Amount"
                                            value={currentLoanAmount}
                                            onChange={setCurrentLoanAmount}
                                            min={loanAmountConfig.min}
                                            max={loanAmountConfig.max}
                                            step={loanAmountConfig.step}
                                            suffix="₹"
                                            icon={
                                                <svg className="w-5 h-5 text-purple-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M17 9V7a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2m2 4h10a2 2 0 002-2v-6a2 2 0 00-2-2H9a2 2 0 00-2 2v6a2 2 0 002 2zm7-5a2 2 0 11-4 0 2 2 0 014 0z"></path>
                                                </svg>
                                            }
                                        />

                                        <SliderInput
                                            label="Interest Rate"
                                            value={currentInterestRate}
                                            onChange={setCurrentInterestRate}
                                            min={interestRateConfig.min}
                                            max={interestRateConfig.max}
                                            step={interestRateConfig.step}
                                            suffix="%"
                                            icon={
                                                <svg className="w-5 h-5 text-purple-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"></path>
                                                </svg>
                                            }
                                        />

                                        <div className="space-y-3">
                                            <div className="flex items-center justify-between">
                                                <label className="text-sm font-semibold text-gray-700 flex items-center gap-2">
                                                    <svg className="w-5 h-5 text-purple-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                                                    </svg>
                                                    Loan Tenure
                                                </label>
                                                <div className="flex items-center gap-2">
                                                    <input
                                                        type="text"
                                                        value={currentTenureInput}
                                                        onChange={(e) => setCurrentTenureInput(e.target.value)}
                                                        onBlur={(e) => {
                                                            const numValue = parseFloat(e.target.value) || 0;
                                                            const clampedValue = Math.min(tenureConfig.max, Math.max(tenureConfig.min, numValue));
                                                            setCurrentTenureInput(clampedValue);
                                                            setCurrentTenure(clampedValue);
                                                        }}
                                                        onKeyPress={(e) => {
                                                            if (e.key === 'Enter') {
                                                                e.target.blur();
                                                            }
                                                        }}
                                                        className="w-20 px-3 py-2 text-right font-bold text-gray-800 bg-white border-2 border-gray-200 rounded-lg focus:border-purple-500 focus:ring-2 focus:ring-purple-200 outline-none transition"
                                                    />
                                                    <div className="flex bg-gray-100 rounded-lg p-1">
                                                        <button
                                                            onClick={() => setCurrentTenureType('year')}
                                                            className={`px-3 py-1 rounded text-xs font-bold transition ${currentTenureType === 'year' ? 'bg-purple-600 text-white shadow-sm' : 'text-gray-600'}`}
                                                        >
                                                            Yr
                                                        </button>
                                                        <button
                                                            onClick={() => setCurrentTenureType('month')}
                                                            className={`px-3 py-1 rounded text-xs font-bold transition ${currentTenureType === 'month' ? 'bg-purple-600 text-white shadow-sm' : 'text-gray-600'}`}
                                                        >
                                                            Mo
                                                        </button>
                                                    </div>
                                                </div>
                                            </div>
                                            <input
                                                type="range"
                                                min={tenureConfig.min}
                                                max={tenureConfig.max}
                                                step={tenureConfig.step}
                                                value={currentTenure}
                                                onChange={(e) => setCurrentTenure(parseFloat(e.target.value))}
                                                className="w-full h-2 rounded-lg appearance-none cursor-pointer"
                                                style={{
                                                    '--track-percent': `${((currentTenure - tenureConfig.min) / (tenureConfig.max - tenureConfig.min)) * 100}%`
                                                }}
                                            />
                                            <div className="flex justify-between text-xs text-gray-400 font-medium">
                                                <span>{tenureConfig.min}</span>
                                                <span>{tenureConfig.max}</span>
                                            </div>
                                        </div>
                                    </div>

                                    {/* Right Column - Results */}
                                    <div className="space-y-6">
                                        {/* EMI Display */}
                                        <div className="bg-gradient-to-br from-purple-600 to-blue-600 rounded-2xl p-8 text-white shadow-xl">
                                            <div className="text-sm font-semibold mb-2 text-purple-100">Monthly EMI</div>
                                            <div className="text-4xl md:text-5xl font-extrabold mb-1">{formatCurrency(results.emi)}</div>
                                            <div className="text-purple-100 text-sm">Per month for {currentTenure} {currentTenureType === 'year' ? 'years' : 'months'}</div>
                                        </div>

                                        {/* Breakdown Stats */}
                                        <div className="grid grid-cols-2 gap-4">
                                            <div className="stat-card bg-gradient-to-br from-blue-50 to-indigo-50 rounded-xl p-6 border border-blue-100">
                                                <div className="text-xs font-semibold text-gray-600 mb-2 uppercase tracking-wide">Total Interest</div>
                                                <div className="text-2xl font-bold text-orange-600">{formatCurrency(results.totalInterest)}</div>
                                            </div>
                                            <div className="stat-card bg-gradient-to-br from-purple-50 to-pink-50 rounded-xl p-6 border border-purple-100">
                                                <div className="text-xs font-semibold text-gray-600 mb-2 uppercase tracking-wide">Total Payment</div>
                                                <div className="text-2xl font-bold text-purple-600">{formatCurrency(results.totalPayment)}</div>
                                            </div>
                                        </div>

                                        {/* Chart */}
                                        <div className="bg-gray-50 rounded-2xl p-6 border border-gray-100">
                                            <h3 className="text-sm font-bold text-gray-700 mb-4 uppercase tracking-wide">Payment Breakdown</h3>
                                            <div className="relative" style={{ height: '250px' }}>
                                                <canvas ref={chartRef}></canvas>
                                            </div>
                                            <div className="mt-6 grid grid-cols-2 gap-4">
                                                <div className="flex items-center gap-3">
                                                    <div className="w-4 h-4 rounded-full" style={{ background: 'rgba(102, 126, 234, 0.9)' }}></div>
                                                    <div>
                                                        <div className="text-xs text-gray-500 font-medium">Principal</div>
                                                        <div className="text-sm font-bold text-gray-800">{((loanAmount / results.totalPayment) * 100).toFixed(1)}%</div>
                                                    </div>
                                                </div>
                                                <div className="flex items-center gap-3">
                                                    <div className="w-4 h-4 rounded-full" style={{ background: 'rgba(251, 146, 60, 0.9)' }}></div>
                                                    <div>
                                                        <div className="text-xs text-gray-500 font-medium">Interest</div>
                                                        <div className="text-sm font-bold text-gray-800">{((results.totalInterest / results.totalPayment) * 100).toFixed(1)}%</div>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>

                                        {/* CTA Button */}
                                        <a href="/loans" className="w-full bg-gradient-to-r from-orange-500 to-pink-600 text-white font-bold py-4 px-8 rounded-xl hover:shadow-2xl transition-all duration-300 transform hover:-translate-y-1 flex items-center justify-center gap-2 text-lg no-underline">
                                            Apply for {activeTab === 'home' ? 'Home' : 'Personal'} Loan
                                            <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M13 7l5 5m0 0l-5 5m5-5H6"></path>
                                            </svg>
                                        </a>
                                    </div>
                                </div>
                            </div>
                        </div>


                    </div>
                </div>
            );
        };

        const FloatingContactWidget = ({ isOpen, setIsOpen, hasBeenClosed, setHasBeenClosed }) => {


            useEffect(() => {
                const timer = setTimeout(() => {
                    if (!hasBeenClosed) {
                        setIsOpen(false);
                        setHasBeenClosed(true);
                    }
                }, 2000);
                return () => clearTimeout(timer);
            }, []);

            const handleClose = () => {
                setIsOpen(false);
                setHasBeenClosed(true);
            };

            return (
                <div
                    className="fixed right-0 top-1/2 -translate-y-1/2 z-50 transition-all duration-500 ease-in-out"
                    style={{
                        transform: `translateY(-50%) translateX(${isOpen || !hasBeenClosed ? '0' : 'calc(100% - 40px)'})`
                    }}
                    onMouseEnter={() => hasBeenClosed && setIsOpen(true)}
                    onMouseLeave={() => hasBeenClosed && setIsOpen(false)}
                >
                    <div className="bg-gradient-to-br from-blue-600 to-blue-700 text-white rounded-l-2xl shadow-2xl overflow-hidden" style={{ width: '320px' }}>
                        <div className="bg-blue-800 px-6 py-4 flex items-center justify-between">
                            <div className="flex items-center gap-3">
                                <div className="w-10 h-10 bg-white rounded-full flex items-center justify-center">
                                    <svg className="w-6 h-6 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"></path>
                                    </svg>
                                </div>
                                <div>
                                    <h3 className="font-bold text-sm">Need Help?</h3>
                                    <p className="text-xs text-blue-100">Talk to Expert</p>
                                </div>
                            </div>
                            {hasBeenClosed && (
                                <button
                                    onClick={handleClose}
                                    className="text-white hover:text-blue-200 transition"
                                >
                                    <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12"></path>
                                    </svg>
                                </button>
                            )}
                        </div>
                        <div className="px-6 py-6">
                            <p className="text-sm mb-4 text-blue-50">
                                Get instant assistance from our customer executives. We're here to help!
                            </p>
                            <div className="bg-white rounded-xl p-4 mb-4">
                                <div className="flex items-center gap-3 mb-3">
                                    <div className="w-12 h-12 bg-blue-100 rounded-full flex items-center justify-center">
                                        <svg className="w-6 h-6 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                                        </svg>
                                    </div>
                                    <div>
                                        <p className="text-xs text-gray-500 font-semibold">Customer Executive</p>
                                        <p className="text-sm text-gray-800 font-bold">Available 24/7</p>
                                    </div>
                                </div>
                                <a
                                    href="tel:9625835453"
                                    className="flex items-center justify-center gap-2 bg-gradient-to-r from-blue-600 to-blue-700 text-white font-bold py-3 px-4 rounded-lg hover:from-blue-700 hover:to-blue-800 transition shadow-lg transform hover:scale-105 no-underline"
                                >
                                    <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"></path>
                                    </svg>
                                    9625835453
                                </a>
                            </div>
                            <p className="text-xs text-blue-100 text-center">
                                Call us for instant loan & credit card assistance
                            </p>
                        </div>
                        {!isOpen && hasBeenClosed && (
                            <div className="absolute left-0 top-1/2 -translate-y-1/2 -translate-x-full bg-blue-600 text-white px-3 py-6 rounded-l-lg shadow-lg cursor-pointer">
                                <div className="flex flex-col items-center gap-2">
                                    <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"></path>
                                    </svg>
                                    <span className="text-xs font-bold writing-mode-vertical transform rotate-180" style={{ writingMode: 'vertical-rl' }}>
                                        CONTACT
                                    </span>
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const Footer = ({ onContactClick }) => (
            <footer className="bg-[#1A202C] text-gray-400 py-12 text-sm">
                <div className="mx-2 md:mx-8 lg:mx-16">
                    <div className="grid grid-cols-2 md:grid-cols-4 gap-8 mb-8">
                        <div>
                            <h4 className="text-white font-bold mb-4 uppercase">Company</h4>
                            <ul className="space-y-2">
                                <li className="hover:text-white cursor-pointer"><a href="/about">About Us</a></li>
                                <li className="hover:text-white cursor-pointer">Partners</li>
                                <li className="hover:text-white cursor-pointer">Careers</li>
                                <li className="hover:text-white cursor-pointer" onClick={onContactClick}>Contact Us</li>
                            </ul>
                        </div>
                        <div>
                            <h4 className="text-white font-bold mb-4 uppercase">Services</h4>
                            <ul className="space-y-2">
                                <li className="hover:text-white cursor-pointer">Personal Loan</li>
                                <li className="hover:text-white cursor-pointer">Credit Card</li>
                                <li className="hover:text-white cursor-pointer">Mutual Funds</li>
                                <li className="hover:text-white cursor-pointer">Credit Score</li>
                            </ul>
                        </div>
                        <div>
                            <h4 className="text-white font-bold mb-4 uppercase">Resources</h4>
                            <ul className="space-y-2">
                                <li className="hover:text-white cursor-pointer">Financial Tools</li>
                                <li className="hover:text-white cursor-pointer">Blogs</li>
                                <li className="hover:text-white cursor-pointer">FAQs</li>
                                <li className="hover:text-white cursor-pointer">Glossary</li>
                            </ul>
                        </div>
                        <div>
                            <h4 className="text-white font-bold mb-4 uppercase">Contact</h4>
                            <ul className="space-y-2">
                                <li>amit@creditsbazaar.com</li>
                                <li>9625835453</li>
                                <li className="mt-4 flex gap-4">
                                    <span className="w-8 h-8 bg-gray-700 rounded-full flex items-center justify-center hover:bg-blue-600 cursor-pointer">f</span>
                                    <span className="w-8 h-8 bg-gray-700 rounded-full flex items-center justify-center hover:bg-blue-400 cursor-pointer">t</span>
                                    <span className="w-8 h-8 bg-gray-700 rounded-full flex items-center justify-center hover:bg-pink-600 cursor-pointer">i</span>
                                </li>
                            </ul>
                        </div>
                    </div>
                    <div className="border-t border-gray-700 pt-8 text-center text-xs">
                        <p>&copy; 2026 Creditsbazaar.com. All Rights Reserved.</p>
                        <p className="mt-2">Disclaimer: All info provided is for informational purposes only.</p>
                    </div>
                </div>
            </footer>
        );

        function App() {
            const [isContactOpen, setIsContactOpen] = useState(true);
            const [contactHasBeenClosed, setContactHasBeenClosed] = useState(false);

            useEffect(() => {
                let timer;
                if (isContactOpen) {
                    timer = setTimeout(() => {
                        setIsContactOpen(false);
                        setContactHasBeenClosed(true);
                    }, 5000);
                }
                return () => clearTimeout(timer);
            }, [isContactOpen]);

            const handleTalkToExpert = () => {
                setIsContactOpen(true);
            };
            return (
                <div className="font-sans text-gray-800 bg-gray-50 min-h-screen">
                    <Navbar />
                    <Hero />
                    <LoanCalculator />
                    <Footer onContactClick={handleTalkToExpert} />
                    <FloatingContactWidget
                        isOpen={isContactOpen}
                        setIsOpen={setIsContactOpen}
                        hasBeenClosed={contactHasBeenClosed}
                        setHasBeenClosed={setContactHasBeenClosed}
                    />
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
    {% endraw %}
</body>

</html>
