<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="google-site-verification" content="xD85Mz8xn2ZWUWSRvvkrPq_47S2qwhhu5urrxYnTYdI" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Creditsbazaar Support</title>
    <meta name="description"
        content="Get in touch with Creditsbazaar for any loan or credit card queries. Call us at +91-9625835453 or email creditsbazaar@gmail.com for expert assistance.">
    <meta name="keywords"
        content="contact creditsbazaar, customer support, loan enquiry, credit card help, finance support">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://creditsbazaar.com/contact">

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://creditsbazaar.com/contact">
    <meta property="og:title" content="Contact Us - Creditsbazaar Support">
    <meta property="og:description"
        content="Get in touch with Creditsbazaar for any loan or credit card queries. We are here to help.">
    <meta property="og:image" content="https://creditsbazaar.com/static/contact_1.png">

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://creditsbazaar.com/contact">
    <meta property="twitter:title" content="Contact Us - Creditsbazaar Support">
    <meta property="twitter:description"
        content="Get in touch with Creditsbazaar for any loan or credit card queries. We are here to help.">
    <meta property="twitter:image" content="https://creditsbazaar.com/static/contact_1.png">

    <!-- Schema.org Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "ContactPage",
      "mainEntity": {
        "@type": "Organization",
        "name": "Creditsbazaar",
        "contactPoint": {
          "@type": "ContactPoint",
          "telephone": "+91-9625835453",
          "contactType": "customer service",
          "email": "creditsbazaar@gmail.com",
          "areaServed": "IN",
          "availableLanguage": "en"
        }
      }
    }
    </script>

    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
    <style>
        body {
            font-family: 'Open Sans', sans-serif;
        }
    </style>
</head>

<body class="bg-gray-50">
    <div id="root"></div>

    {% raw %}
    <script type="text/babel">
        const { useState, useEffect } = React;

        const Navbar = () => {
            const [isMenuOpen, setIsMenuOpen] = useState(false);
            const menuItems = [
                { name: "Home", link: "/" },
                { name: "Loans", link: "/loans" },
                { name: "Credit Cards", link: "/creditcards" },
                { name: "Calculators", link: "/calculators" }
            ];
            const loanTypes = [
                { name: "Personal Loan", link: "/loans/personal-loan" },
                { name: "Business Loan", link: "/loans/business-loan" },
                { name: "Loan Against Property", link: "/loans/loan-against-property" },
                { name: "Home Loan", link: "/loans/home-loan" },
                { name: "OverDraft", link: "/loans/overdraft" },
                { name: "Credit Card", link: "/loans/credit-card" },
                { name: "Car Loan", link: "/loans/car-loan" }
            ];

            return (
                <nav className="bg-white shadow-md sticky top-0 z-50">
                    <div className="mx-2 md:mx-8 lg:mx-16 py-3 flex items-center justify-between">
                        <div className="flex items-center gap-4">
                            <button
                                className="lg:hidden text-gray-700 focus:outline-none"
                                onClick={() => setIsMenuOpen(!isMenuOpen)}
                            >
                                <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    {isMenuOpen ? (
                                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12" />
                                    ) : (
                                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 6h16M4 12h16M4 18h16" />
                                    )}
                                </svg>
                            </button>
                            <a href="/" className="flex items-center gap-2">
                                <img src="/static/logo.png" alt="Creditsbazaar" className="h-16" />
                            </a>
                        </div>
                        <div className="flex items-center gap-4">
                            <div className="hidden lg:flex items-center gap-6">
                                {menuItems.map((item) => (
                                    item.name === "Loans" ? (
                                        <div key={item.name} className="relative group">
                                            <a href="/loans" className="font-semibold text-sm cursor-pointer flex items-center gap-1 transition-colors text-gray-700 hover:text-blue-600 py-2">
                                                Loans
                                                <svg className="w-3 h-3 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 9l-7 7-7-7" /></svg>
                                            </a>
                                            <div className="absolute left-0 top-full hidden group-hover:block bg-white shadow-xl rounded-lg border border-gray-100 py-2 w-56 z-50">
                                                {loanTypes.map((lt) => (
                                                    <a key={lt.name} href={lt.link} className="block px-4 py-2 text-sm text-gray-700 hover:bg-blue-50 hover:text-blue-600 transition-colors">
                                                        {lt.name}
                                                    </a>
                                                ))}
                                            </div>
                                        </div>
                                    ) : (
                                        <a key={item.name} href={item.link} className="font-semibold text-sm cursor-pointer text-gray-700 hover:text-blue-600 transition-colors">
                                            {item.name}
                                        </a>
                                    )
                                    ))}
                            </div>
                        </div>
                    </div>
                    {isMenuOpen && (
                        <div className="lg:hidden bg-white border-t border-gray-100 shadow-lg absolute w-full left-0 py-4 flex flex-col gap-4 px-6">
                            {menuItems.map((item) => (
                                item.name === "Loans" ? (
                                    <div key={item.name} className="flex flex-col gap-2">
                                        <span className="block text-gray-700 font-bold">Loans</span>
                                        <div className="flex flex-col gap-2 pl-4 border-l-2 border-gray-100">
                                            {loanTypes.map((lt) => (
                                                <a key={lt.name} href={lt.link} className="block text-gray-600 text-sm hover:text-blue-600 transition" onClick={() => setIsMenuOpen(false)}>
                                                    {lt.name}
                                                </a>
                                            ))}
                                        </div>
                                    </div>
                                ) : (
                                <a key={item.name} href={item.link} className="block text-gray-700 font-semibold hover:text-blue-600 transition" onClick={() => setIsMenuOpen(false)}>
                                    {item.name}
                                </a>
                                )
                            ))}
                        </div>
                    )}
                </nav>
            );
        };

        const ContactHero = () => (
            <div className="bg-[#052F5F] text-white py-16 text-center relative overflow-hidden">
                <div className="absolute top-0 left-0 w-64 h-64 bg-blue-500 rounded-full mix-blend-multiply filter blur-3xl opacity-20 -translate-x-1/2 -translate-y-1/2"></div>
                <div className="absolute bottom-0 right-0 w-64 h-64 bg-purple-500 rounded-full mix-blend-multiply filter blur-3xl opacity-20 translate-x-1/2 translate-y-1/2"></div>
                <div className="relative z-10 mx-4">
                    <h1 className="text-4xl md:text-5xl font-bold mb-4">Contact Us</h1>
                    <p className="text-xl text-blue-100 max-w-2xl mx-auto">We're here to help you with your financial journey.</p>
                </div>
            </div>
        );

        const ContactContent = () => (
            <div className="py-16 bg-white">
                <div className="mx-4 md:mx-8 lg:mx-16">
                    <div className="grid md:grid-cols-2 gap-12 items-center">
                        {/* Images Section */}
                        <div className="grid grid-cols-2 gap-4">
                            <img src="/static/contact_1.png" alt="Support Team" className="rounded-2xl shadow-lg w-full h-48 object-cover transform translate-y-4" onError={(e) => e.target.src = 'https://images.unsplash.com/photo-1516321318423-f06f85e504b3?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80'} />
                            <img src="/static/contact_2.png" alt="Office" className="rounded-2xl shadow-lg w-full h-48 object-cover transform -translate-y-4" onError={(e) => e.target.src = 'https://images.unsplash.com/photo-1497366216548-37526070297c?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80'} />
                        </div>

                        {/* Details Section */}
                        <div>
                            <h2 className="text-3xl font-bold text-[#052F5F] mb-8">Get in Touch</h2>
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
                                <div className="flex gap-4">
                                    <div className="w-12 h-12 bg-blue-100 rounded-lg flex items-center justify-center flex-shrink-0 text-blue-600">
                                        <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
                                    </div>
                                    <div>
                                        <h3 className="font-bold text-gray-800">Email</h3>
                                        <p className="text-gray-600 text-sm">creditsbazaar@gmail.com</p>
                                    </div>
                                </div>

                                <div className="flex gap-4">
                                    <div className="w-12 h-12 bg-blue-100 rounded-lg flex items-center justify-center flex-shrink-0 text-blue-600">
                                        <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"></path></svg>
                                    </div>
                                    <div>
                                        <h3 className="font-bold text-gray-800">Customer Support</h3>
                                        <p className="text-gray-600 text-sm">+91-9625835453</p>
                                    </div>
                                </div>

                                <div className="flex gap-4">
                                    <div className="w-12 h-12 bg-blue-100 rounded-lg flex items-center justify-center flex-shrink-0 text-blue-600">
                                        <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                                    </div>
                                    <div>
                                        <h3 className="font-bold text-gray-800">Support Hours</h3>
                                        <p className="text-gray-600 text-sm">Mon-Sat, 10:00 AM – 6:00 PM (IST)</p>
                                    </div>
                                </div>

                                <div className="flex gap-4">
                                    <div className="w-12 h-12 bg-blue-100 rounded-lg flex items-center justify-center flex-shrink-0 text-blue-600">
                                        <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                                    </div>
                                    <div>
                                        <h3 className="font-bold text-gray-800">Registered Office</h3>
                                        <p className="text-gray-600 text-sm">146-C, First Floor, Hastsal, Uttam Nagar, New Delhi, Delhi 110059</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        );

                <div className="mx-2 md:mx-8 lg:mx-16">
                    <div className="grid grid-cols-2 md:grid-cols-4 gap-8 mb-8">
                        <div>
                            <h4 className="text-white font-bold mb-4 uppercase">Company</h4>
                            <ul className="space-y-2">
                                <li className="hover:text-white cursor-pointer"><a href="/about">About Us</a></li>
                                <li className="hover:text-white cursor-pointer"><a href="/careers">Careers</a></li>
                                <li className="hover:text-white cursor-pointer"><a href="/#partners">Partners</a></li>
                                <li className="hover:text-white cursor-pointer"><a href="/contact">Contact Us</a></li>
                            </ul>
                        </div>
                        <div>
                            <h4 className="text-white font-bold mb-4 uppercase">Our DSA's Partner Services</h4>
                            <ul className="space-y-2">
                                <li className="hover:text-white cursor-pointer"><a href="/loans/personal-loan">Personal Loan</a></li>
                                <li className="hover:text-white cursor-pointer"><a href="/loans/business-loan">Business Loan</a></li>
                                <li className="hover:text-white cursor-pointer"><a href="/loans/loan-against-property">Loan Against Property</a></li>
                                <li className="hover:text-white cursor-pointer"><a href="/loans/home-loan">Home Loan</a></li>
                                <li className="hover:text-white cursor-pointer"><a href="/loans/overdraft">OverDraft</a></li>
                                <li className="hover:text-white cursor-pointer"><a href="/loans/credit-card">Credit Card</a></li>
                                <li className="hover:text-white cursor-pointer"><a href="/loans/car-loan">Car Loan</a></li>
                            </ul>
                        </div>
                        <div>
                            <h4 className="text-white font-bold mb-4 uppercase">Resources</h4>
                            <ul className="space-y-2">
                                <li className="hover:text-white cursor-pointer"><a href="/calculators">Financial Tools</a></li>
                                <li className="hover:text-white cursor-pointer">Blogs</li>
                                <li className="hover:text-white cursor-pointer"><a href="/faq">FAQs</a></li>
                                <li className="hover:text-white cursor-pointer"><a href="/glossary">Glossary</a></li>
                            </ul>
                        </div>
                        <div>
                            <h4 className="text-white font-bold mb-4 uppercase">Contact Us</h4>

                                <li>amit@creditsbazaar.com</li>
                                <li className="mt-4 flex gap-4">
                                    <a href="https://www.instagram.com/officialcreditsbazaar?igsh=MTI0bWR0ZGw4OG5rcQ==" target="_blank" rel="noopener noreferrer" className="w-8 h-8 bg-gray-700 rounded-full flex items-center justify-center hover:bg-pink-600 cursor-pointer transition-colors block">
                                        <svg className="w-4 h-4 text-white" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                                            <path fillRule="evenodd" d="M12.315 2c2.43 0 2.784.013 3.808.06 1.064.049 1.791.218 2.427.465a4.902 4.902 0 011.772 1.153 4.902 4.902 0 011.153 1.772c.247.636.416 1.363.465 2.427.048 1.067.06 1.407.06 4.123v.08c0 2.643-.012 2.987-.06 4.043-.049 1.064-.218 1.791-.465 2.427a4.902 4.902 0 01-1.153 1.772 4.902 4.902 0 01-1.772 1.153c-.636.247-1.363.416-2.427.465-1.067.048-1.407.06-4.123.06h-.08c-2.643 0-2.987-.012-4.043-.06-1.064-.049-1.791-.218-2.427-.465a4.902 4.902 0 01-1.772-1.153 4.902 4.902 0 01-1.153-1.772c-.247-.636-.416-1.363-.465-2.427-.047-1.024-.06-1.379-.06-3.808v-.63c0-2.43.013-2.784.06-3.808.049-1.064.218-1.791.465-2.427a4.902 4.902 0 011.153-1.772A4.902 4.902 0 015.468 2.525c.636-.247 1.363-.416 2.427-.465C8.901 2.013 9.256 2 11.685 2h.63zm-.081 1.802h-.468c-2.456 0-2.784.011-3.807.058-.975.045-1.504.207-1.857.344-.467.182-.8.398-1.15.748-.35.35-.566.683-.748 1.15-.137.353-.3.882-.344 1.857-.047 1.023-.058 1.351-.058 3.807v.468c0 2.456.011 2.784.058 3.807.045.975.207 1.504.344 1.857.182.466.399.8.748 1.15.35.35.683.566 1.15.748.353.137.882.3 1.857.344 1.054.048 1.37.058 4.041.058h.08c2.597 0 2.917-.01 3.96-.058.976-.045 1.505-.207 1.858-.344.466-.182.8-.398 1.15-.748.35-.35.566-.683.748-1.15.137-.353.3-.882.344-1.857.048-1.055.058-1.37.058-4.041v-.08c0-2.597-.01-2.917-.058-3.96-.045-.976-.207-1.505-.344-1.858a3.097 3.097 0 00-.748-1.15 3.098 3.098 0 00-1.15-.748c-.353-.137-.882-.3-1.857-.344-1.023-.047-1.351-.058-3.807-.058zM12 6.865a5.135 5.135 0 110 10.27 5.135 5.135 0 010-10.27zm0 1.802a3.333 3.333 0 100 6.666 3.333 3.333 0 000-6.666zm5.338-3.205a1.2 1.2 0 110 2.4 1.2 1.2 0 010-2.4z" clipRule="evenodd" />
                                        </svg>
                                    </a>
                                    <a href="https://www.facebook.com/share/1ApxzjYFjQ/" target="_blank" rel="noopener noreferrer" className="w-8 h-8 bg-gray-700 rounded-full flex items-center justify-center hover:bg-blue-600 cursor-pointer transition-colors block">
                                        <svg className="w-4 h-4 text-white" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                                            <path d="M22 12c0-5.523-4.477-10-10-10S2 6.477 2 12c0 4.991 3.657 9.128 8.438 9.878v-6.987h-2.54V12h2.54V9.797c0-2.506 1.492-3.89 3.777-3.89 1.094 0 2.238.195 2.238.195v2.46h-1.26c-1.243 0-1.63.771-1.63 1.562V12h2.773l-.443 2.89h-2.33v6.988C18.343 21.128 22 16.991 22 12z"/>
                                        </svg>
                                    </a>
                                    <a href="https://youtube.com/@creditbazaar_official?si=B0tJjpEkb_es0Di9" target="_blank" rel="noopener noreferrer" className="w-8 h-8 bg-gray-700 rounded-full flex items-center justify-center hover:bg-red-600 cursor-pointer transition-colors block">
                                        <svg className="w-4 h-4 text-white" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                                            <path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/>
                                        </svg>
                                    </a>
                                </li>
                            </ul>
                        </div>
                    </div>
                    <div className="border-t border-gray-700 mt-12 pt-8">
                        <div className="flex flex-wrap justify-center gap-x-8 gap-y-4 text-xs font-medium text-gray-400 mb-6 uppercase tracking-wide">
                            <a href="/privacy-policy" className="hover:text-white transition-colors duration-200">Privacy Policy</a>
                            <a href="/terms-condition" className="hover:text-white transition-colors duration-200">Terms & Conditions</a>
                            <a href="/disclaimer" className="hover:text-white transition-colors duration-200">Disclaimer</a>
                        </div>
                        <div className="text-center text-xs text-gray-600">
                            <p>&copy; 2026 Creditsbazaar.com. All Rights Reserved.</p>
                            <p className="mt-2">Disclaimer: All info provided is for informational purposes only.</p>
                        </div>
                    </div>
                </div>
            </footer>
        );

        const ContactMap = () => (
            <div className="bg-white pb-16">
                <div className="mx-4 md:mx-8 lg:mx-16 h-96 rounded-2xl overflow-hidden shadow-lg">
                    <iframe
                        src="https://maps.google.com/maps?q=28.6340717,77.0582898&t=&z=15&ie=UTF8&iwloc=&output=embed"
                        width="100%"
                        height="100%"
                        style={{ border: 0 }}
                        allowFullScreen=""
                        loading="lazy"
                        referrerPolicy="no-referrer-when-downgrade">
                    </iframe>
                </div>
            </div>
        );

        function App() {
            return (
                <div className="font-sans text-gray-800 bg-gray-50 min-h-screen pb-0">
                    <Navbar />
                    <ContactHero />
                    <ContactContent />
                    <ContactMap />
                    <Footer />
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
    {% endraw %}
</body>

</html>
